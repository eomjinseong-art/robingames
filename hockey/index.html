<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07142a">
<title>나두 아이스하키 101 · Nadoo Ice Hockey 101 | 초보도 3초 만에 이해하는 쉬운 하키 게임</title>
<meta name="description" content="아이스하키 규칙(파란 선 오프사이드, 빨간 선 아이싱, 2분 감옥 파워플레이, 달리는 중 선수 교체, 1대1 승부차기)을 왕초보 눈높이로 쉽고 재미있게 배우는 나두 아이스하키 101">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E🏒%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #07142a;
  --panel: rgba(9, 22, 44, 0.95);
  --card: #10284a;
  --line: rgba(255, 214, 74, 0.36);
  --gold: #ffd54a;
  --blue: #38b6ff;
  --red: #ff5e57;
  --ok: #55e68c;
  --text: #f5faf7;
  --mute: #d4e8dc;
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: radial-gradient(circle at 50% 0%, #143f75 0%, #07142a 75%);
  color: var(--text);
  font: 400 17px/1.55 var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}
header.top {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
  background: rgba(6, 16, 34, 0.95);
  border-bottom: 2px solid var(--line);
  backdrop-filter: blur(8px);
}
#brand {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  font-size: 19px;
  color: var(--gold);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
main#app {
  max-width: 780px;
  margin: 0 auto;
  padding: 14px 14px 80px;
}
.btn {
  appearance: none;
  border: 2px solid var(--line);
  background: linear-gradient(180deg, #1d4479, #102a50);
  color: var(--text);
  font: 600 17px/1.3 var(--sans);
  padding: 12px 16px;
  border-radius: 14px;
  cursor: pointer;
  min-height: 50px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  touch-action: manipulation;
  user-select: none;
  transition: transform 0.08s, border-color 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: linear-gradient(180deg, #ffe066, #f5b700);
  color: #112215;
  border-color: #fff3b0;
  font-weight: 700;
}
.btn.blue {
  background: linear-gradient(180deg, #2980b9, #1b557a);
  border-color: #74c0fc;
}
.btn.ok {
  background: linear-gradient(180deg, #2b8a3e, #1b5e2a);
  border-color: #8ce99a;
}
.btn.small {
  font-size: 16px;
  padding: 8px 12px;
  min-height: 42px;
}
.btn.wide { width: 100%; margin-top: 10px; }
.card-box {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.arcade-card {
  background: linear-gradient(135deg, rgba(41,128,185,0.35), rgba(255,213,74,0.22));
  border: 2px solid var(--gold);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
}
.goal-bar {
  background: linear-gradient(90deg, rgba(255,213,74,0.2), rgba(56,182,255,0.16));
  border: 2px solid var(--gold);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.5;
  color: #fff;
}
.easy-rule-box {
  background: rgba(20, 52, 92, 0.92);
  border: 1.5px solid #74c0fc;
  border-radius: 12px;
  padding: 10px 13px;
  margin-bottom: 10px;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.55;
  color: #f5faf7;
}
.scorebug {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: linear-gradient(180deg, #0b1622, #152638);
  border: 2px solid #4a6b8a;
  border-radius: 14px;
  padding: 10px 12px;
  margin-bottom: 10px;
  font-size: 16px;
}
.sb-teams { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.sb-team { background: #1e3a56; padding: 4px 10px; border-radius: 8px; }
.sb-down {
  background: var(--gold);
  color: #102015;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 16px;
}
.sb-spot { color: #9ad8ff; font-weight: 500; }
.sb-clock { color: #ffe066; font-weight: 700; }
.hearts { font-size: 19px; letter-spacing: 2px; }
.field-wrap {
  position: relative;
  width: 100%;
  border: 3px solid #e9f5ed;
  border-radius: 16px;
  overflow: hidden;
  background: #e8f4ff;
  margin-bottom: 12px;
}
canvas#rinkCanvas {
  display: block;
  width: 100%;
  height: 320px;
  touch-action: manipulation;
  cursor: pointer;
}
.coach-box {
  background: rgba(14, 34, 66, 0.96);
  border-left: 5px solid var(--gold);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 12px;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.55;
  color: var(--text);
}
.coach-title {
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 4px;
  font-size: 18px;
}
.play-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 10px;
  margin-top: 8px;
}
.play-btn {
  text-align: left;
  flex-direction: column;
  align-items: flex-start;
  padding: 13px 15px;
  position: relative;
}
.play-btn.recommend {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(255, 213, 74, 0.35);
}
.play-btn .p-title { font-weight: 700; font-size: 17px; color: var(--gold); }
.play-btn.primary .p-title { color: #112215; }
.play-btn .p-desc { font-weight: 400; font-size: 16px; color: var(--mute); margin-top: 4px; line-height: 1.45; }
.play-btn.primary .p-desc { color: #1d3524; }
.badge-guide {
  display: inline-block;
  background: var(--gold);
  color: #102418;
  font-weight: 700;
  font-size: 14px;
  padding: 2px 8px;
  border-radius: 99px;
  margin-bottom: 4px;
}
.play-btn.primary .badge-guide {
  background: #102418;
  color: var(--gold);
}
.stage-list { display: flex; flex-direction: column; gap: 10px; }
.stage-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 14px;
}
.stage-card h3 { margin: 0 0 4px; font-size: 19px; color: var(--gold); }
.stage-card p { margin: 0; font-size: 17px; color: var(--mute); font-weight: 400; line-height: 1.5; }
.decoder-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin: 12px 0;
}
.dex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.dex-item {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 14px;
}
.dex-item h4 { margin: 0 0 4px; font-size: 18px; color: var(--gold); }
.dex-item .role { font-size: 16px; color: #8ce99a; margin-bottom: 6px; font-weight: 500; }
.dex-item p { margin: 0; font-size: 17px; color: var(--text); font-weight: 400; line-height: 1.55; }
.quiz-opt {
  width: 100%;
  text-align: left;
  justify-content: flex-start;
  margin-bottom: 10px;
  font-weight: 400;
  font-size: 17px;
  line-height: 1.5;
}
.quiz-opt.correct { border-color: var(--ok); background: rgba(43, 138, 62, 0.45); }
.quiz-opt.wrong { border-color: var(--red); background: rgba(201, 42, 42, 0.4); }
footer.foot {
  text-align: center;
  padding: 20px 10px;
  color: var(--mute);
  font-size: 16px;
}
</style>
</head>
<body>
<header class="top">
  <a id="homeLink" class="btn small" href="/">🏠 홈</a>
  <div id="brand">🏒 나두 아이스하키 101</div>
  <button id="langBtn" class="btn small" type="button">EN</button>
  <button id="muteBtn" class="btn small" type="button" aria-label="Sound">🔊</button>
</header>
<main id="app"></main>
<footer class="foot">© 나두게임즈 Nadoo Games · Developed by 나두Ai</footer>
<script src="/hockey/data.js"></script>
<script src="/hockey/audio.js"></script>
<script src="/hockey/app.js"></script>
<script src="/counter.js" defer></script>
</body>
</html>
