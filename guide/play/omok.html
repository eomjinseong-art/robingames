<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>오목 PC 대국 | 나두게임즈</title>
<meta name="description" content="오목(고모쿠) 컴퓨터와 한 판: 초급·중급·고급 AI, 흑/백 선택, 무르기. 15×15 자유 규칙(5개 이상 승리).">
<meta name="theme-color" content="#ffd32a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="stylesheet" href="/guide/guide.css?v=20261002c">
<link rel="stylesheet" href="/guide/play/play.css">
<script src="/counter.js" defer></script>
</head>
<body>
<div class="wrap" id="playApp"><div class="panel">불러오는 중… Loading…</div></div>
<script src="/guide/play/omok.rules.js"></script>
<script src="/guide/play/play.js"></script>
<script>
(function () {
  var N = 15, C = 30, P = 22, S = P * 2 + C * (N - 1), R = NadooRules.omok;
  function X(c) { return P + c * C; }
  NadooPlay.start({
    id: 'omok',
    text: {
      title: ['오목', 'Gomoku'], sub: ['15×15 · 자유 규칙', '15×15 · free-style'],
      side0: ['먼저 두기 (흑 ●)', 'Go first (Black ●)'], side1: ['나중 두기 (백 ○)', 'Go second (White ○)'],
      rulesNote: ['규칙: 흑부터 번갈아 교차점에 1개씩. 가로·세로·대각선으로 5개 이상 이으면 승리 (자유 규칙: 장목도 승리, 쌍삼·렌주 금수 없음). 초급에서는 막아야 할 곳(상대가 다음에 5를 만드는 곳)을 빨간 점으로 알려 줘요.',
        'Rules: Black first, one stone per turn on an intersection. 5 or more in a row wins (free-style: no renju bans, overlines win). Easy marks with red dots where the computer would make five next.']
    },
    hintNote: false,
    info: function (s, api, cur) { return api.esc(api.t('me')) + ' ' + (cur.human === 0 ? '●' : '○') + ' · ' + api.esc(api.t('pc')) + ' ' + (cur.human === 0 ? '○' : '●') + ' · ' + s.n + api.esc(api.t('nth')); },
    render: function (el, s, ctx, api) {
      var h = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="omok board">';
      h += '<rect x="0" y="0" width="' + S + '" height="' + S + '" rx="12" fill="#e9c27d"/>';
      for (var i = 0; i < N; i++) {
        h += '<line x1="' + X(0) + '" y1="' + X(i) + '" x2="' + X(N - 1) + '" y2="' + X(i) + '" stroke="#5a3a10" stroke-width="1"/>';
        h += '<line x1="' + X(i) + '" y1="' + X(0) + '" x2="' + X(i) + '" y2="' + X(N - 1) + '" stroke="#5a3a10" stroke-width="1"/>';
      }
      [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]].forEach(function (p) { h += '<circle cx="' + X(p[1]) + '" cy="' + X(p[0]) + '" r="3" fill="#5a3a10"/>'; });
      for (var k = 0; k < N * N; k++) {
        var v = s.b[k]; if (!v) continue;
        var r = (k / N) | 0, c = k % N;
        h += '<circle class="stone" cx="' + X(c) + '" cy="' + X(r) + '" r="' + (C * 0.44) + '" fill="' + (v === 1 ? '#1b1b1b' : '#fafafa') + '" stroke="#111" stroke-width="1.2"/>';
      }
      if (s.last >= 0) h += '<circle cx="' + X(s.last % N) + '" cy="' + X((s.last / N) | 0) + '" r="4.5" fill="#ff3b3b"/>';
      if (s.line) { var a = s.line[0], b = s.line[1]; h += '<line x1="' + X(a % N) + '" y1="' + X((a / N) | 0) + '" x2="' + X(b % N) + '" y2="' + X((b / N) | 0) + '" stroke="#ff3b3b" stroke-width="10" stroke-linecap="round" opacity=".5"/>'; }
      if (ctx.hints && ctx.myTurn) {
        var oc = 2 - ctx.human, bb = s.b.slice();
        for (k = 0; k < N * N; k++) if (!bb[k]) { bb[k] = oc; if (R.fiveLine(bb, k, oc)) h += '<circle class="hint" cx="' + X(k % N) + '" cy="' + X((k / N) | 0) + '" r="6" fill="#e74c3c" opacity=".8"/>'; bb[k] = 0; }
      }
      h += '</svg>';
      el.innerHTML = h;
      var svg = el.firstChild;
      svg.addEventListener('click', function (ev) {
        var p = NadooPlay.pt(svg, ev), c = Math.round((p.x - P) / C), r = Math.round((p.y - P) / C);
        if (r < 0 || r >= N || c < 0 || c >= N) return;
        api.move(r * N + c);
      });
    }
  });
})();
</script>
</body>
</html>
