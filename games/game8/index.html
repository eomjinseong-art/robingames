<script>
(() => {
'use strict';
/* ================== 기본 설정 ================== */
const W = 360, H = 640;           // 논리 해상도 (세로형)
const GROUND = 590;               // 땅 높이
const cvs = document.getElementById('c');

const stage = document.getElementById('stage');
let scale = 1, dpr = 1;

function resize() {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  cvs.height = Math.round(r.height * dpr);
  scale = cvs.width / W;

  scale = Math.min(scale, sy);
}

/* ================== 저장 (localStorage) ================== */
const SKEY = 'bbungRocket_v1';
const store = (() => {
  let d = { best: 0, skin: 0, potatoes: 0, plays: 0 };
  try { Object.assign(d, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch (e) {}
  return {
    d,
    save() { try { localStorage.setItem(SKEY, JSON.stringify(d)); } catch (e) {} }
  };
})();

/* ================== 캐릭터 (잠금 해제) ================== */
/* ================== 언어 (KO/EN) ================== */
const LANG_KEY = 'nadoo_lang';
let lang = localStorage.getItem(LANG_KEY) || ((navigator.language || 'en').toLowerCase().startsWith('ko') ? 'ko' : 'en');
const T = {
  title: ['뿡뿡 방귀 로켓', 'Fart Rocket'],
  sub: ['고구마 먹고 <b>뿡!</b> 하늘을 날아라!<br>휴지탑에 부딪히면 방귀가 새버려요 🤭', 'Eat sweet potatoes, go <b>PFFT!</b> and fly!<br>Bonk a toilet-paper tower and… oops 🤭'],
  start: ['뿡! 시작하기', 'TOOT! Start'], pauseT: ['잠깐 쉬는 중...', 'Taking a break...'], pauseS: ['방귀 참는 중! 참을 수 있을까?', 'Holding in a fart… can you?!'],
  resume: ['계속하기', 'Resume'], quit: ['처음으로', 'Menu'], newrec: ['신기록!', 'NEW BEST!'], retry: ['다시 뿡!', 'Toot again!'],
  share: ['자랑하기', 'Brag'], chars: ['캐릭터', 'Characters'],
  best: ['🏆 최고 기록: {b}점 · 모은 🍠 {p}개', '🏆 Best: {b} · 🍠 collected: {p}'],

  pts: ['{s}점', '{s}'], ptsNeed: ['{n}점', '{n} pts'],
  unlockNew: ['🔓 새 캐릭터 등장! {l}', '🔓 New character! {l}'],

  locked: ['🔒 최고 {n}점을 넘으면 열려요!', '🔒 Score {n}+ to unlock!'],
  gauge: ['방귀 게이지', 'Fart meter'], tapTap: ['👆 탭! 탭! 뿡! 뿡!', '👆 Tap! Tap! Toot! Toot!'],
  superF: ['🔥슈퍼 방귀!!🔥', '🔥SUPER FART!!🔥'], crash: ['뿌지지직~!!', 'PBBBTTT~!!'],
  shareText: ['💨 뿡뿡 방귀 로켓에서 {b}점 찍었다! 너도 도전해봐! 🍠', '💨 I scored {b} in Fart Rocket! Can you beat me? 🍠'],
  copied: ['📋 복사 완료! 친구에게 붙여넣기 해요', '📋 Copied! Paste it to a friend'], brag: ['📋 {b}점! 친구에게 자랑해요!', '📋 {b} points! Go brag to a friend!'],
};
const t = (k, v = {}) => T[k][lang === 'ko' ? 0 : 1].replace(/\{(\w)\}/g, (_, x) => v[x]);
const pick = a => a[lang === 'ko' ? 0 : 1];

const SKINS = [
  { e: '🐷', g: '🐖', flip: 1, n: ['꿀꿀이', 'Piggy'], need: 0,  fx: ['뿡!', 'PFFT!'] },
  { e: '🐸', n: ['개굴이', 'Froggy'], need: 8,  fx: ['뽀옹~', 'Poot~'] },
  { e: '🐔', flip: 1, n: ['꼬꼬닭', 'Chicky'], need: 15, fx: ['꼬뿡!', 'Bawk-toot!'] },
  { e: '🐙', n: ['문어빵', 'Octo'], need: 25, fx: ['뿌르륵', 'Blurrrp'] },
  { e: '🦄', flip: 1, n: ['유니콘', 'Unicorn'], need: 35, fx: ['반짝뿡✨', 'Sparkle toot✨'] },
  { e: '👽', n: ['외계인', 'Alien'], need: 50, fx: ['삐뿡?', 'Beep-toot?'] },
  { e: '👴', n: ['할아버지', 'Grandpa'], need: 70, fx: ['에헴뿡', 'Ahem-PFFT'] },
  { e: '💩', n: ['황금똥', 'Golden Poop'], need: 100, fx: ['뿌지직!', 'SPLORT!'] },
];
// 인게임 스프라이트: 진행 방향(오른쪽)을 보도록 옆모습 이모지(왼쪽 보기)를 좌우 반전 → 방귀는 엉덩이(왼쪽)에서
const sprite = s => s.g || s.e;
const faceX = s => s.flip ? -1 : 1;
const unlocked = i => store.d.best >= SKINS[i].need;

/* ================== 사운드 (WebAudio 합성) ================== */
const snd = {
  // ---- 오디오 코어: 첫 터치/클릭/키에서 확실히 켜기 (iOS 무음 스위치·interrupted·suspended 대응)
  ac: null, muted: localStorage.getItem('bbungRocket_mute2') === '1', master: null, comp: null, an: null, sfx: null, musicBus: null, noiseBuf: null,
  unlocked: false, el: null, musicOn: false, mTimer: null, mNext: 0, mStep: 0,
  MASTER: 0.9, MUSIC: 0.2,
  init() {
    try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch (e) {}  // iOS 17+: 무음 스위치 무시
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ac = new AC({ latencyHint: 'interactive' }); } catch (e) { this.ac = new AC(); }
      const ac = this.ac;
      this.master = ac.createGain(); this.master.gain.value = this.muted ? 0 : this.MASTER;
      this.comp = ac.createDynamicsCompressor();
      this.comp.threshold.value = -20; this.comp.knee.value = 12; this.comp.ratio.value = 4; this.comp.attack.value = 0.003; this.comp.release.value = 0.2;
      const make = ac.createGain(); make.gain.value = 1.35;
      this.an = ac.createAnalyser(); this.an.fftSize = 512;
      this.master.connect(this.comp); this.comp.connect(make); make.connect(this.an); this.an.connect(ac.destination);
      this.sfx = this.master;
      this.musicBus = ac.createGain(); this.musicBus.gain.value = 0.0001; this.musicBus.connect(this.master);
      const len = ac.sampleRate;
      this.noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const ch = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      if (this.ac.addEventListener) this.ac.addEventListener('statechange', () => { if (this.ac.state === 'running' && this.musicOn) this.mNext = Math.max(this.mNext, this.ac.currentTime + 0.05); });
    }
    const ac = this.ac;
    if (ac.state !== 'running') { try { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }  // suspended + iOS 'interrupted'
    if (!this.unlocked) {   // WebKit: 제스처 안에서 무음 버퍼를 한 번 재생해야 풀림
      try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); this.unlocked = true; } catch (e) {}
    }
    // iOS 16 이하: 무음 스위치가 켜져 있으면 WebAudio가 묵음 → 조용한 <audio>를 재생해 '미디어 재생'으로 전환
    if (!navigator.audioSession && /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document) {
      if (!this.el) {
        const sr = 8000, n = 800, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
        const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
        this.el = document.createElement('audio'); this.el.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
        this.el.loop = true; this.el.setAttribute('playsinline', ''); this.el.setAttribute('x-webkit-airplay', 'deny'); this.el.preload = 'auto';
      }
      if (this.el.paused && !document.hidden) { const p = this.el.play(); if (p && p.catch) p.catch(() => {}); }
    }
  },
  get running() { return !!this.ac && this.ac.state === 'running'; },
  level() { if (!this.an) return 0; const a = new Float32Array(this.an.fftSize); this.an.getFloatTimeDomainData(a); let s = 0; for (const x of a) s += x * x; return Math.sqrt(s / a.length); },
  setMute(m) {
    this.muted = m; try { localStorage.setItem('bbungRocket_mute2', m ? '1' : '0'); } catch (e) {}
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : this.MASTER, this.ac.currentTime, 0.02);
  },
  sleep() { if (this.el && !this.el.paused) this.el.pause(); if (this.ac && this.ac.state === 'running' && this.ac.suspend) this.ac.suspend().catch(() => {}); },
  // ---- 배경음악: 통통 튀는 병맛 칩튠 (WebAudio 합성, 룩어헤드 스케줄러)
  startMusic() {
    if (!this.ac || this.musicOn) return;
    this.musicOn = true; this.mStep = 0; this.mNext = this.ac.currentTime + 0.08;
    this.musicBus.gain.cancelScheduledValues(this.ac.currentTime);
    this.musicBus.gain.setTargetAtTime(this.MUSIC, this.ac.currentTime, 0.15);
    clearInterval(this.mTimer); this.mTimer = setInterval(() => this.tickMusic(), 60); this.tickMusic();
  },
  stopMusic() {
    if (!this.musicOn) return;
    this.musicOn = false; clearInterval(this.mTimer); this.mTimer = null;
    if (this.ac) this.musicBus.gain.setTargetAtTime(0.0001, this.ac.currentTime, 0.06);
  },
  tickMusic() {
    const ac = this.ac; if (!ac || !this.musicOn || ac.state !== 'running') return;
    if (this.mNext < ac.currentTime - 0.05) this.mNext = ac.currentTime + 0.05;
    const e8 = 60 / 150 / 2;
    while (this.mNext < ac.currentTime + 0.3) { this.note(this.mStep, this.mNext, e8); this.mNext += e8; this.mStep++; }
  },
  note(step, t, e8) {
    const ac = this.ac, bus = this.musicBus;
    const PROG = [[0, 4, 7], [-3, 0, 4], [-7, -3, 0], [-5, -1, 2]];            // C, Am, F, G
    const MEL = [0, null, 4, 7, 12, null, 7, 4,  0, 4, 7, 9, 7, null, 4, null,  12, null, 9, 7, 4, null, 7, 12,  14, 12, 9, 7, 4, 2, null, null];
    const bar = Math.floor(step / 8) % 4, s8 = step % 8, ch = PROG[bar];
    const hz = st => 261.63 * Math.pow(2, st / 12);
    const blip = (f, dur, type, vol, slide) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);

    };
    if (s8 % 2 === 0) blip(hz(ch[0] - 12), e8 * 1.6, 'triangle', 0.55);                      // 통통 베이스
    if (s8 === 0 || s8 === 4) blip(150, 0.12, 'sine', 0.7, 0.3);                               // 킥
    if (s8 % 2 === 1) {                                                                         // 칙 (하이햇)
      const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      n.buffer = this.noiseBuf; f.type = 'highpass'; f.frequency.value = 6000;
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      n.connect(f); f.connect(g); g.connect(bus); n.start(t, Math.random() * 0.5); n.stop(t + 0.05);
    }
    const m = MEL[(step % 32)];
    if (m !== null) blip(hz(ch[0] + m + 12), e8 * 0.8, 'square', 0.13);                        // 멜로디
    if (step % 32 === 30) blip(hz(ch[0] + 19), e8 * 1.8, 'sine', 0.2, 0.5);                     // 뿌잉~ (병맛 슬라이드)
  },
  // ---- 방귀 소리: 폰 스피커에서도 잘 들리게 — 버즈(톱니+사각) + 입술 떨림(AM) + 중음 강조 + 바람 노이즈
  fart(len = 0.22, base = 0, vol = 0.6, delay = 0) {
    if (!this.ac || this.muted) return;
    const ac = this.ac, t = ac.currentTime + delay;
    const f0 = base ? Math.max(base, 60) * 1.4 : 105 + Math.random() * 70;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0 * 1.35, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.75, t + len);
    const o2 = ac.createOscillator(); o2.type = 'square';
    o2.frequency.setValueAtTime(f0 * 2.02, t); o2.frequency.exponentialRampToValueAtTime(f0 * 1.5, t + len);
    const lfo = ac.createOscillator(); lfo.frequency.value = 16 + Math.random() * 18;
    const lg = ac.createGain(); lg.gain.value = f0 * 0.3; lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    const flt = ac.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 1700; flt.Q.value = 5;
    const pk = ac.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 480; pk.Q.value = 1.2; pk.gain.value = 9;
    const g2 = ac.createGain(); g2.gain.value = 0.35;
    const trem = ac.createGain(); trem.gain.value = 0.65;
    const am = ac.createOscillator(); am.type = 'square'; am.frequency.value = 24 + Math.random() * 16;
    const amg = ac.createGain(); amg.gain.value = 0.35; am.connect(amg); amg.connect(trem.gain);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.setValueAtTime(vol, t + len * 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(flt); o2.connect(g2); g2.connect(flt); flt.connect(pk); pk.connect(trem); trem.connect(g); g.connect(this.sfx);
    const n = ac.createBufferSource(); n.buffer = this.noiseBuf;
    const nf = ac.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 420; nf.Q.value = 0.9;
    const ng = ac.createGain(); ng.gain.setValueAtTime(vol * 0.35, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + len * 0.85);
    n.connect(nf); nf.connect(ng); ng.connect(this.sfx);
    const end = t + len + 0.05;
    o.start(t); o2.start(t); lfo.start(t); am.start(t); n.start(t, Math.random() * 0.5);
    o.stop(end); o2.stop(end); lfo.stop(end); am.stop(end); n.stop(t + len);
  },
  tone(freq, dur, type = 'square', vol = 0.18, slideTo = 0, delay = 0) {

    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);

    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  eat() { this.tone(660, 0.08, 'square', 0.12); this.tone(990, 0.1, 'square', 0.12, 0, 0.07); },
  point() { this.tone(880, 0.06, 'triangle', 0.15, 1320); },
  boing() { this.tone(300, 0.35, 'sine', 0.3, 900); },
  crash() { this.fart(1.1, 55); this.tone(500, 0.6, 'sine', 0.25, 90, 0.05); },
  super() { this.fart(0.6, 110); [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'square', 0.1, 0, i * 0.07)); },
  fanfare() { [523, 659, 784, 659, 1047].forEach((f, i) => this.tone(f, 0.15, 'triangle', 0.18, 0, i * 0.11)); },
};
// 모든 첫 제스처(터치 끝·클릭·키)에서 오디오를 깨움 — iOS는 touchend/click에서만 풀리므로 여러 이벤트에 등록

/* ================== 이모지 캐시 (성능) ================== */
const emojiCache = {};
function emo(ch, size) {
  const k = ch + size;
  if (emojiCache[k]) return emojiCache[k];
  const c = document.createElement('canvas');
  const px = Math.ceil(size * 1.3 * 2);
  c.width = c.height = px;
  const x = c.getContext('2d');
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `${size * 2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  x.fillText(ch, px / 2, px / 2 + size * 0.1);
  emojiCache[k] = c;
  return c;
}
function drawEmo(ch, x, y, size, rot = 0, sx = 1, sy = 1) {
  const img = emo(ch, size);
  const s = img.width / 2;
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (sx !== 1 || sy !== 1) ctx.scale(sx, sy);
  ctx.drawImage(img, -s / 2, -s / 2, s, s);
  ctx.restore();
}

/* ================== 게임 상태 ================== */
let state = 'title'; // title | play | pause | over
let player, pipes, items, puffs, floaters, clouds, birds;
let score, potatoes, gas, superT, speed, gap, spawnX, time, shake, eventName, eventT, curEvent, deathT, lastScoreEvent, windY, gravMul, flash;
const GRAV = 0.42, FLAP = -7.4;

const EVENTS = [
  { id: 'moon',   name: ['🌙 달나라 구간! 중력이 약해요~', '🌙 Moon zone! Low gravity~'], dur: 9 },
  { id: 'wind',   name: ['🌪️ 방귀 태풍! 몸이 흔들려요!', '🌪️ Fart tornado! Wobble wobble!'], dur: 8 },
  { id: 'duck',   name: ['🦆 오리떼 출몰! 꽥꽥!', '🦆 Duck attack! Quack quack!'], dur: 10 },
  { id: 'potato', name: ['🍠 고구마 비가 내려요!!', '🍠 Sweet potato rain!!'], dur: 7 },
  { id: 'tiny',   name: ['🤏 쪼그라들었다! 작아졌어요', '🤏 Shrunk! Teeny tiny mode'], dur: 8 },
  { id: 'disco',  name: ['🪩 방귀 디스코 타임!', '🪩 Fart disco time!'], dur: 8 },
];
const FAIL_MSG = [['방귀가 새버렸다!', 'The fart leaked out!'], ['뿌지직... 망했다!', 'SPLORT… oh no!'], ['휴지에 코 박음 🤧', 'Nose-bonked the TP 🤧'], ['가스 부족! 삐익-', 'Out of gas! Beeep-'], ['엉덩이가 얼얼해~', 'My butt is tingling~'], ['고구마가 모자랐어!', 'Not enough sweet potatoes!'], ['으악 냄새 역풍!', 'Ew, the smell blew back!'], ['방귀 조절 실패!', 'Fart control FAILED!']];

function initClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 380, s: 0.4 + Math.random() * 0.6 });
}
function reset() {
  player = { x: 100, y: 280, vy: 0, rot: 0, r: 17, squash: 1, alive: true };
  pipes = []; items = []; puffs = []; floaters = []; birds = [];
  score = 0; potatoes = 0; gas = 0; superT = 0; speed = 2.4; gap = 190; spawnX = W + 40;
  time = 0; shake = 0; eventName = ''; eventT = 0; curEvent = null; deathT = 0; lastScoreEvent = 0;
  windY = 0; gravMul = 1; flash = 0;
}
initClouds(); reset();

function startGame() {
  snd.init(); snd.startMusic();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  reset();
  state = 'play';
  store.d.plays++; store.save();
  show(null);
  flap();
}

function show(id) {
  ['titleScr', 'pauseScr', 'overScr'].forEach(s => document.getElementById(s).classList.toggle('show', s === id));
  document.getElementById('credit').style.display = (id === 'titleScr') ? 'block' : 'none';
  document.getElementById('pauseBtn').style.visibility = (state === 'play' || state === 'pause') ? 'visible' : 'hidden';
}

function flap() {
  if (state !== 'play' || !player.alive) return;
  player.vy = FLAP * (curEvent && curEvent.id === 'moon' ? 0.72 : 1);
  player.squash = 1.35;
  snd.fart(0.16 + Math.random() * 0.12);
  // 방귀 구름
  for (let i = 0; i < 4; i++) puffs.push({ x: player.x - 16, y: player.y + 10, vx: -1.5 - Math.random() * 2, vy: 1 + Math.random() * 1.5, r: 6 + Math.random() * 7, life: 1, c: superT > 0 ? '#ff9f43' : '#b8e994' });
  if (Math.random() < 0.18) floaters.push({ x: player.x - 30, y: player.y + 20, t: pick(SKINS[store.d.skin].fx), life: 1 });
}

function spawnPipe() {
  const minTop = 70, maxTop = GROUND - gap - 60;
  const top = minTop + Math.random() * (maxTop - minTop);
  const moving = score >= 20 && Math.random() < Math.min(0.5, (score - 15) / 60);
  pipes.push({ x: spawnX, top, w: 62, passed: false, moving, ph: Math.random() * 6.28, baseTop: top });
  // 고구마
  if (Math.random() < 0.7) items.push({ x: spawnX + 31, y: top + gap / 2 + (Math.random() - 0.5) * (gap * 0.4), t: 'potato', bob: Math.random() * 6 });
  else if (Math.random() < 0.25) items.push({ x: spawnX + 150, y: 150 + Math.random() * 300, t: 'star', bob: 0 });
}

function triggerEvent() {
  const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  curEvent = ev; eventT = ev.dur; eventName = pick(ev.name);
  snd.boing();
  if (ev.id === 'potato') for (let i = 0; i < 10; i++) items.push({ x: W + 40 + i * 60, y: 120 + Math.random() * 360, t: 'potato', bob: Math.random() * 6, fall: true });
  if (ev.id === 'duck') for (let i = 0; i < 4; i++) birds.push({ x: W + 60 + i * 170, y: 120 + Math.random() * 360, vy: (Math.random() - 0.5) * 1.2 });
}

function die() {
  if (!player.alive) return;
  player.alive = false; snd.stopMusic();
  player.vy = -9; deathT = 0; shake = 14; flash = 1;
  snd.crash();
  for (let i = 0; i < 18; i++) puffs.push({ x: player.x, y: player.y, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7, r: 8 + Math.random() * 10, life: 1.4, c: '#b8e994' });
  floaters.push({ x: player.x, y: player.y - 30, t: t('crash'), life: 1.6, big: true });
}

function gameOver() {
  state = 'over';
  const prevBest = store.d.best;
  const isNew = score > prevBest;
  store.d.potatoes += potatoes;
  if (isNew) store.d.best = score;
  store.save();
  document.getElementById('goEmoji').textContent = SKINS[store.d.skin].e;
  document.getElementById('goMsg').textContent = pick(FAIL_MSG[Math.floor(Math.random() * FAIL_MSG.length)]);
  document.getElementById('goScore').textContent = t('pts', { s: score });
  document.getElementById('goNew').style.display = isNew && score > 0 ? 'block' : 'none';
  document.getElementById('goBest').textContent = t('goBest', { b: store.d.best, p: potatoes });
  const newly = SKINS.filter(s => s.need > prevBest && s.need <= store.d.best);
  const u = document.getElementById('goUnlock');
  if (newly.length) {
    u.style.display = 'block';
    u.textContent = t('unlockNew', { l: newly.map(s => s.e + ' ' + pick(s.n)).join(', ') });
    setTimeout(() => snd.fanfare(), 400);
  } else {
    const next = SKINS.find(s => s.need > store.d.best);
    u.style.display = next ? 'block' : 'none';
    u.style.background = '#fff';
    if (next) u.textContent = t('unlockNext', { e: next.e, n: next.need - store.d.best });
  }
  if (newly.length) u.style.background = '#7bed9f';
  show('overScr');
  renderSkins();
}

function hit(ax, ay, ar, rx, ry, rw, rh) {
  const cx = Math.max(rx, Math.min(ax, rx + rw)), cy = Math.max(ry, Math.min(ay, ry + rh));
  const dx = ax - cx, dy = ay - cy;
  return dx * dx + dy * dy < ar * ar;
}

/* ================== 업데이트 (고정 스텝 60Hz) ================== */
function update(dt) {
  time += dt;
  const f = dt * 60; // 프레임 계수
  // 구름
  for (const c of clouds) { c.x -= speed * 0.25 * c.s * f; if (c.x < -80) { c.x = W + 80; c.y = 40 + Math.random() * 380; } }

  if (state !== 'play') return;
  const p = player;
  if (eventT > 0) { eventT -= dt; if (eventT <= 0) { curEvent = null; eventName = ''; } }
  gravMul = curEvent && curEvent.id === 'moon' ? 0.5 : 1;
  windY = curEvent && curEvent.id === 'wind' ? Math.sin(time * 3) * 0.28 : 0;
  const tiny = curEvent && curEvent.id === 'tiny';
  p.r = tiny ? 11 : 17;

  if (p.alive) {
    speed = Math.min(5.2, 2.4 + score * 0.045);
    gap = Math.max(138, 190 - score * 1.3);
    const sp = superT > 0 ? speed * 1.9 : speed;
    if (superT > 0) {
      superT -= dt;
      p.vy += (280 - p.y) * 0.004 * f; p.vy *= 0.92;
      if (Math.random() < 0.6) puffs.push({ x: p.x - 18, y: p.y + 6, vx: -3 - Math.random() * 2, vy: (Math.random() - 0.5), r: 8 + Math.random() * 8, life: 0.8, c: Math.random() < 0.5 ? '#ff9f43' : '#ffd32a' });
    } else {
      p.vy += (GRAV * gravMul + windY) * f;
    }
    p.vy = Math.min(p.vy, 10);
    p.y += p.vy * f;
    p.rot = Math.max(-0.5, Math.min(1.2, p.vy * 0.08));
    p.squash += (1 - p.squash) * 0.2 * f;

    // 파이프 이동/생성
    spawnX -= sp * f;
    if (spawnX < W + 40) { spawnPipe(); spawnX += Math.max(185, 230 - score * 1.2); }
    for (const pp of pipes) {
      pp.x -= sp * f;
      if (pp.moving) pp.top = pp.baseTop + Math.sin(time * 1.8 + pp.ph) * 40;
      if (!pp.passed && pp.x + pp.w < p.x) {
        pp.passed = true; score++; snd.point();
        if (score % 12 === 0 && score !== lastScoreEvent) { lastScoreEvent = score; triggerEvent(); }
      }
      if (superT <= 0 && (hit(p.x, p.y, p.r * 0.85, pp.x, -50, pp.w, pp.top + 50) || hit(p.x, p.y, p.r * 0.85, pp.x, pp.top + gap, pp.w, GROUND))) die();
      if (superT > 0 && !pp.smashed && pp.x < p.x + 20 && pp.x + pp.w > p.x - 20) { pp.smashed = true; shake = 5; }
    }
    pipes = pipes.filter(pp => pp.x > -80);
    // 아이템
    for (const it of items) {
      it.x -= sp * f; it.bob += dt * 4;
      if (it.fall) it.y += Math.sin(it.bob) * 0.4;
      const iy = it.y + Math.sin(it.bob) * 4;
      if (!it.got && Math.hypot(it.x - p.x, iy - p.y) < p.r + 16) {
        it.got = true;
        if (it.t === 'potato') {
          potatoes++; gas++; snd.eat();
          floaters.push({ x: it.x, y: iy, t: '+🍠', life: 1 });
          if (gas >= 5) { gas = 0; superT = 3; snd.super(); floaters.push({ x: W / 2, y: 200, t: t('superF'), life: 1.5, big: true }); shake = 8; }
        } else {
          score += 3; snd.fanfare(); floaters.push({ x: it.x, y: iy, t: '⭐+3', life: 1, big: true });
        }
      }
    }
    items = items.filter(it => it.x > -40 && !it.got);
    // 오리
    for (const b of birds) {
      b.x -= (sp + 1.2) * f; b.y += b.vy * f; if (b.y < 80 || b.y > GROUND - 40) b.vy *= -1;
      if (superT <= 0 && Math.hypot(b.x - p.x, b.y - p.y) < p.r + 13) die();
    }
    birds = birds.filter(b => b.x > -40);
    if (curEvent && curEvent.id === 'duck' && birds.length < 2 && Math.random() < 0.02) birds.push({ x: W + 40, y: 120 + Math.random() * 360, vy: (Math.random() - 0.5) * 1.2 });

    if (p.y > GROUND - p.r) { p.y = GROUND - p.r; if (superT <= 0) die(); }
    if (p.y < p.r) { p.y = p.r; p.vy = 0; }
  } else {
    // 사망 애니메이션: 빙글빙글 튕겨나감
    deathT += dt;
    p.vy += 0.5 * f; p.y += p.vy * f; p.x += 1.5 * f; p.rot += 0.35 * f;
    if (deathT > 1.1) gameOver();
  }
  // 파티클
  for (const pf of puffs) { pf.x += pf.vx * f; pf.y += pf.vy * f; pf.vy *= 0.96; pf.r += 0.3 * f; pf.life -= dt * 1.6; }
  puffs = puffs.filter(pf => pf.life > 0);
  if (puffs.length > 120) puffs.splice(0, puffs.length - 120);
  for (const fl of floaters) { fl.y -= 0.8 * f; fl.life -= dt; }
  floaters = floaters.filter(fl => fl.life > 0);
  if (shake > 0) shake = Math.max(0, shake - 0.6 * f);
  if (flash > 0) flash = Math.max(0, flash - dt * 3);
}

/* ================== 그리기 ================== */
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function drawPipe(pp) {
  // 두루마리 휴지 탑
  const drawStack = (y0, y1, flipped) => {
    const rollH = 34;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#2d1b00'; ctx.lineWidth = 3;
    roundRect(pp.x, y0, pp.w, y1 - y0, 8); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(45,27,0,.25)'; ctx.lineWidth = 2;
    for (let y = y0 + rollH; y < y1 - 4; y += rollH) { ctx.beginPath(); ctx.moveTo(pp.x + 3, y); ctx.lineTo(pp.x + pp.w - 3, y); ctx.stroke(); }
    ctx.fillStyle = '#dfe6e9'; ctx.fillRect(pp.x + 6, y0 + 3, 7, y1 - y0 - 6);
    // 끝 캡 (휴지 심)
    const cy = flipped ? y1 : y0;
    ctx.fillStyle = '#ffeaa7'; ctx.strokeStyle = '#2d1b00'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(pp.x + pp.w / 2, cy, pp.w / 2 + 4, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c8a26b'; ctx.beginPath(); ctx.ellipse(pp.x + pp.w / 2, cy, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
    // 흘러내린 휴지 한 칸
    if (flipped) { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2d1b00'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pp.x + pp.w - 8, cy + 6); ctx.quadraticCurveTo(pp.x + pp.w + 6, cy + 22 + Math.sin(time * 5 + pp.ph) * 4, pp.x + pp.w - 2, cy + 34); ctx.lineTo(pp.x + pp.w - 14, cy + 30); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  };
  ctx.save();
  if (pp.smashed) { ctx.globalAlpha = 0.35; }
  drawStack(-20, pp.top, true);
  drawStack(pp.top + gap, GROUND + 20, false);
  ctx.restore();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const disco = curEvent && curEvent.id === 'disco';
  // 전체 배경 (여백 포함)
  ctx.fillStyle = '#8fd8ff'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  const ox = (cvs.width - W * scale) / 2, oy = (cvs.height - H * scale) / 2;
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
  ctx.setTransform(scale, 0, 0, scale, ox + sx * scale, oy + sy * scale);

  // 하늘 그라데이션
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (disco) { const h = (time * 120) % 360; g.addColorStop(0, `hsl(${h},90%,70%)`); g.addColorStop(1, `hsl(${(h + 120) % 360},90%,80%)`); }
  else if (curEvent && curEvent.id === 'moon') { g.addColorStop(0, '#2c2c54'); g.addColorStop(1, '#706fd3'); }
  else { g.addColorStop(0, '#74d0ff'); g.addColorStop(1, '#d6f5ff'); }
  ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);
  if (curEvent && curEvent.id === 'moon') drawEmo('🌕', 290, 90, 40);
  else drawEmo('🌞', 300, 70, 34, Math.sin(time) * 0.1);

  // 구름
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (const c of clouds) {
    const s = c.s * 30;
    ctx.beginPath(); ctx.arc(c.x, c.y, s, 0, 6.28); ctx.arc(c.x + s, c.y + 5, s * 0.8, 0, 6.28); ctx.arc(c.x - s, c.y + 5, s * 0.75, 0, 6.28); ctx.fill();
  }
  // 파이프
  for (const pp of pipes) drawPipe(pp);
  // 땅 (잔디)
  ctx.fillStyle = '#78e08f'; ctx.fillRect(-40, GROUND, W + 80, H - GROUND + 40);
  ctx.fillStyle = '#38ada9';
  const off = (time * speed * 60) % 30;
  for (let x = -off - 30; x < W + 30; x += 30) { ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x + 15, GROUND + 12); ctx.lineTo(x + 30, GROUND); ctx.fill(); }
  ctx.strokeStyle = '#2d1b00'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-40, GROUND); ctx.lineTo(W + 40, GROUND); ctx.stroke();

  // 아이템
  for (const it of items) drawEmo(it.t === 'potato' ? '🍠' : '⭐', it.x, it.y + Math.sin(it.bob) * 4, it.t === 'potato' ? 22 : 24, Math.sin(it.bob) * 0.2);
  for (const b of birds) drawEmo('🦆', b.x, b.y, 26, Math.sin(time * 10) * 0.15, -1, 1);
  // 방귀 구름
  for (const pf of puffs) { ctx.globalAlpha = Math.max(0, Math.min(1, pf.life)) * 0.8; ctx.fillStyle = pf.c; ctx.beginPath(); ctx.arc(pf.x, pf.y, pf.r, 0, 6.28); ctx.fill(); }
  ctx.globalAlpha = 1;

  // 플레이어
  const p = player;
  if (state !== 'title') {
    if (superT > 0) { ctx.fillStyle = 'rgba(255,211,42,.4)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 10 + Math.sin(time * 20) * 3, 0, 6.28); ctx.fill(); }
    const sq = p.squash;
    const sk = SKINS[store.d.skin];
    drawEmo(sprite(sk), p.x, p.y, p.r * 2, p.rot, faceX(sk) / sq * (disco ? 1 + Math.sin(time * 16) * 0.15 : 1), sq);
  } else {
    // 타이틀 데모: 둥실둥실
    drawEmo(sprite(SKINS[store.d.skin]), 180, 560 + Math.sin(time * 3) * 6, 30, Math.sin(time * 2) * 0.2, faceX(SKINS[store.d.skin]));
  }
  // 떠다니는 글자
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const fl of floaters) {
    ctx.globalAlpha = Math.min(1, fl.life * 1.5);
    ctx.font = `bold ${fl.big ? 26 : 18}px 'Jua','Malgun Gothic',sans-serif`;
    ctx.lineWidth = 5; ctx.strokeStyle = '#2d1b00'; ctx.strokeText(fl.t, fl.x, fl.y);
    ctx.fillStyle = fl.big ? '#ffd32a' : '#fff'; ctx.fillText(fl.t, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;

  if (state === 'play' || state === 'pause') {
    // 점수
    ctx.font = "bold 54px 'Jua','Malgun Gothic',sans-serif";
    ctx.lineWidth = 8; ctx.strokeStyle = '#2d1b00'; ctx.strokeText(score, W / 2, 95);
    ctx.fillStyle = '#fff'; ctx.fillText(score, W / 2, 95);
    // 가스 게이지 (고구마 5개)
    const gx = 70, gy = 612;
    ctx.font = "bold 14px 'Jua','Malgun Gothic',sans-serif"; ctx.fillStyle = '#2d1b00'; ctx.textAlign = 'left';
    ctx.fillText(t('gauge'), 12, gy - 14);
    for (let i = 0; i < 5; i++) {
      ctx.globalAlpha = i < gas || superT > 0 ? 1 : 0.25;
      drawEmo('🍠', 22 + i * 26, gy + 4, 11);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'right'; ctx.fillText(`🏆 ${store.d.best}`, W - 12, gy + 4);
    ctx.textAlign = 'center';
    // 이벤트 배너
    if (eventName) {
      const a = Math.min(1, eventT, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#2d1b00'; roundRect(20, 128, W - 40, 36, 14); ctx.fill();
      ctx.fillStyle = '#ffd32a'; ctx.font = "bold 17px 'Jua','Malgun Gothic',sans-serif"; ctx.fillText(eventName, W / 2, 147);
      ctx.globalAlpha = 1;
    }
    if (state === 'play' && time < 1.2 && score === 0) {
      ctx.font = "bold 20px 'Jua','Malgun Gothic',sans-serif"; ctx.fillStyle = '#2d1b00'; ctx.fillText(t('tapTap'), W / 2, 200);
    }
  }
  if (flash > 0) { ctx.fillStyle = `rgba(184,233,148,${flash * 0.6})`; ctx.fillRect(-40, -40, W + 80, H + 80); }
}

/* ================== 메인 루프 ================== */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (state !== 'pause') {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; }
  }
  render();
  requestAnimationFrame(loop);
}

/* ================== UI ================== */
function renderSkins() {
  const box = document.getElementById('skins');
  box.innerHTML = '';
  SKINS.forEach((s, i) => {
    const b = document.createElement('button');
    const ok = unlocked(i);
    b.className = 'skin' + (ok ? '' : ' locked') + (store.d.skin === i ? ' sel' : '');
    b.innerHTML = `${ok ? s.e : '❓'}<small>${ok ? pick(s.n) : t('ptsNeed', { n: s.need })}</small>`;
    b.setAttribute('aria-label', ok ? pick(s.n) : t('locked', { n: s.need }));
    b.addEventListener('click', e => {
      e.stopPropagation();
      snd.init();
      if (!ok) { toast(t('locked', { n: s.need })); snd.tone(200, 0.15, 'square', 0.1); return; }
      store.d.skin = i; store.save(); snd.fart(0.25); renderSkins();
    });
    box.appendChild(b);
  });
  document.getElementById('titleBest').textContent = t('best', { b: store.d.best, p: store.d.potatoes });
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 1600);
}
function pause() { if (state !== 'play') return; state = 'pause'; snd.stopMusic(); show('pauseScr'); document.getElementById('pauseBtn').textContent = '▶️'; }
function resume() { if (state !== 'pause') return; state = 'play'; snd.init(); snd.startMusic(); show(null); document.getElementById('pauseBtn').textContent = '⏸️'; last = performance.now(); acc = 0; }
function toTitle() { state = 'title'; snd.stopMusic(); reset(); show('titleScr'); renderSkins(); document.getElementById('pauseBtn').textContent = '⏸️'; }
function updateMuteBtn() { document.getElementById('muteBtn').textContent = snd.muted ? '🔇' : '🔊'; }

document.getElementById('startBtn').addEventListener('click', e => { e.stopPropagation(); startGame(); });
document.getElementById('retryBtn').addEventListener('click', e => { e.stopPropagation(); startGame(); });
document.getElementById('menuBtn').addEventListener('click', e => { e.stopPropagation(); toTitle(); });
document.getElementById('resumeBtn').addEventListener('click', e => { e.stopPropagation(); resume(); });
document.getElementById('quitBtn').addEventListener('click', e => { e.stopPropagation(); toTitle(); });
document.getElementById('shareBtn').addEventListener('click', async e => {
  e.stopPropagation();
  const text = t('shareText', { b: store.d.best });
  const url = location.origin + location.pathname;
  try {
    if (navigator.share) { await navigator.share({ title: t('title'), text, url }); return; }
    await navigator.clipboard.writeText(text + ' ' + url); toast(t('copied'));
  } catch (err) { toast(t('brag', { b: store.d.best })); }
});
document.querySelectorAll('.overlay button').forEach(el => el.addEventListener('pointerdown', e => e.stopPropagation()));
// 상단 버튼(🏠 🌏 ⏸️ 🔊): 게임 중에도 확실히 눌리게.
// 손을 뗄 때(pointerup) 바로 실행하고, 뒤따르는 click은 한 번 무시 (모바일 브라우저가 click을 늦추거나 삼켜도 동작).
// 버튼 탭은 게임 입력(방귀/회전)으로 넘어가지 않음.
function uiTap(el, fn) {
  let pid = null, fired = -1e9;
  const run = e => { fired = performance.now(); try { el.blur && el.blur(); } catch (err) {} fn(e); };
  el.addEventListener('pointerdown', e => { e.stopPropagation(); pid = e.pointerId; });
  el.addEventListener('pointerup', e => {
    e.stopPropagation();
    if (pid !== e.pointerId) return; pid = null;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const r = el.getBoundingClientRect();
    if (e.clientX < r.left - 10 || e.clientX > r.right + 10 || e.clientY < r.top - 10 || e.clientY > r.bottom + 10) return;
    run(e);
  });
  el.addEventListener('pointercancel', () => { pid = null; });
  el.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); if (performance.now() - fired < 800) return; run(e); });
  ['touchstart', 'touchend'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation(), { passive: true }));
}
const homeBtn = document.getElementById('homeBtn');
uiTap(homeBtn, () => { location.href = homeBtn.href; });
uiTap(document.getElementById('pauseBtn'), () => { state === 'pause' ? resume() : pause(); });
uiTap(document.getElementById('muteBtn'), () => { snd.init(); snd.setMute(!snd.muted); updateMuteBtn(); });


// 게임 입력: 캔버스 탭 / 마우스
cvs.addEventListener('pointerdown', e => {
  if (e.target !== cvs) return;
  e.preventDefault();
  if (state === 'play') { snd.init(); flap(); }
}, { passive: false });
// 키보드
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'play') flap();
    else if (state === 'title') startGame();
    else if (state === 'over' && deathT > 1.1) startGame();
    else if (state === 'pause') resume();
  } else if (k === 'p' || k === 'P' || k === 'Escape') {
    state === 'pause' ? resume() : pause();
  } else if (k === 'm' || k === 'M') {
    snd.init(); snd.setMute(!snd.muted); updateMuteBtn();
  }
});
// 탭을 벗어나면 자동 일시정지
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', () => pause());

// 테스트용 훅 (게임 상태 조회만)
window.__bbung = { get audio() { return { state: snd.ac ? snd.ac.state : 'none', level: snd.level(), music: snd.musicOn, muted: snd.muted }; }, get state() { return state; }, get score() { return score; }, get y() { return player.y; }, get pipes() { return pipes.map(p => ({ x: p.x, top: p.top, gap })); } };

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.title = lang === 'ko' ? '뿡뿡 방귀 로켓 🍠💨 | 나두게임즈' : 'Fart Rocket 🍠💨 | Nadoo Games';
  document.getElementById('langBtn').textContent = lang === 'ko' ? '🌏 EN' : '🌏 한';
  renderSkins();
}
uiTap(document.getElementById('langBtn'), () => { lang = lang === 'ko' ? 'en' : 'ko'; localStorage.setItem(LANG_KEY, lang); applyLang(); snd.init(); snd.boing(); if (state === 'play') pause(); });
resize(); applyLang(); updateMuteBtn(); show('titleScr');
requestAnimationFrame(loop);
})();
</script>
