function playLabel(){let s=tt(cur().play[0],cur().play[1]);if(cur().kind==='throne')s+=' '+(waveI+1)+'/'+throneWaves().length;if(combo>1)s+='  ×'+combo;return s}
function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#24185a');g.addColorStop(.55,'#14102e');g.addColorStop(1,'#0c0818');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#2a1c10';x.fillRect(0,H*.86,W,H);x.fillStyle='#ffd76f33';x.fillRect(0,H*.86,W,3);x.fillStyle='#ffffff22';for(let i=0;i<16;i++)x.fillRect((i*97)%W,(i*53)%(H*.42),2,2)}

 const h=hintText();if(h){x.font='500 16px sans-serif';const ls=wordLines(h,W-28).slice(0,2);ls.forEach((ln,i)=>body(ln,W/2,y1+50+i*21,16,'#ffe9a8'))}
 if(timeMax>0&&st==='play'){const bw=W-84,bx=14,by=146,r=Math.max(0,Math.min(1,timeLeft/timeMax));x.fillStyle='#0008';rr(bx,by,bw,10,5);x.fill();x.fillStyle=r>.45?'#7bed9f':r>.22?'#ffd76f':'#ff6b6b';rr(bx,by,Math.max(10,bw*r),10,5);x.fill();txt(Math.ceil(Math.max(0,timeLeft))+(lang==='ko'?'초':'s'),W-36,by+5,17,r>.22?'#fff':'#ffb0b0')}}
function drawPlay(){const boxes=layout();hud();if(cur().kind==='tree')drawTreeChrome();else{const y=(boardA[0]?boardA[0].y:topY())-13;if(boardA[0])body(tt(cur().ha[0],cur().ha[1]),boardA[0].x+boardA[0].w/2,y,16,'#fff');if(boardB[0])body(tt(cur().hb[0],cur().hb[1]),boardB[0].x+boardB[0].w/2,y,16,'#fff')}for(const Lx of links){x.globalAlpha=Math.max(0,Lx.l*2);x.strokeStyle='#ffd76f';x.lineWidth=4;x.beginPath();x.moveTo(Lx.x1,Lx.y1);x.quadraticCurveTo((Lx.x1+Lx.x2)/2,Math.min(Lx.y1,Lx.y2)-30,Lx.x2,Lx.y2);x.stroke();x.globalAlpha=1}boxes.forEach(drawCard);if(cool>.12)txt(L().wait,W/2,H-40,20,'#ffc4c4')}
function drawGoal(){panel(W*.06,H*.16,W*.88,H*.56);txt(cur().em+'  '+(stage+1)+' / '+STAGES.length,W/2,H*.24,18,'#ffd76f');const g=tt(cur().goal[0],cur().goal[1]);x.font='500 20px sans-serif';x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=4;wrap(g,W/2,H*.34,W*.78,29);x.shadowBlur=0;const meta=(cur().hearts||3)+' ❤'+(cur().time?('   '+cur().time+(lang==='ko'?'초':'s')):'');body(meta,W/2,H*.52,18,'#ffe9c0');body(tt(cur().play[0],cur().play[1]),W/2,H*.58,18,'#c8f4ff');txt(L().tap,W/2,H*.66,22,Math.sin(now*5)>0?'#7bed9f':'#fff')}
function drawClear(){panel(W*.06,H*.14,W*.88,H*.64);txt(L().good,W/2,H*.2,22,'#7bed9f');txt('+'+lastBonus,W/2,H*.26,20,'#ffd76f');x.font='17px sans-serif';x.fillStyle='#fff3da';const y=wrap(tt(cur().learn[0],cur().learn[1]),W/2,H*.34,W*.78,25);if(newly){body('🃏 +'+newly,W/2,y+10,18,'#aff')}txt(stage>=STAGES.length-1?L().quizgo:L().next,W/2,H*.7,18,Math.sin(now*5)>0?'#7bed9f':'#fff')}
function drawTitle(){panel(W*.06,H*.12,W*.88,H*.62);body(L().sub,W/2,H*.18,17,'#ffd76f');txt(L().t,W/2,H*.24,Math.min(28,W*.072),'#fff');x.font='40px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('⚡   🦉',W/2,H*.34);x.strokeStyle='#ffd76f';x.lineWidth=3;x.beginPath();x.moveTo(W/2-70,H*.4);x.lineTo(W/2+70,H*.4);x.stroke();x.font='18px sans-serif';x.fillStyle='#fff';let y=wrap(L().h,W/2,H*.45,W*.8,25);x.font='16px sans-serif';x.fillStyle='#fff3da';y=wrap(L().w,W/2,y+6,W*.8,22);txt(L().go,W/2,H*.66,22,'#7bed9f');x.font='16px sans-serif';x.fillStyle='#fff';x.textAlign='center';x.fillText(L().best+' '+best+' · '+(lang==='ko'?'단계 ':'stage ')+bestStage+'/'+STAGES.length+' · 🏛️ '+Myth.get().length+'/'+Object.keys(Myth.C).length,W/2,H*.72)}
function drawOver(win){panel(W*.08,H*.18,W*.84,H*.52);txt(win?'🏆':'💨',W/2,H*.26,36,'#fff');txt(win?L().win:L().over,W/2,H*.34,26,win?'#ffd76f':'#fff');if(win){x.font='500 17px sans-serif';x.fillStyle='#ffe9c0';wrap(L().win2,W/2,H*.4,W*.74,23)}if(nb)body(L().nb,W/2,H*.47,17,'#ffd76f');x.font='17px sans-serif';x.fillStyle='#fff';x.textAlign='center';x.fillText(score+' · '+L().best+' '+best,W/2,H*.53);x.fillStyle='#aff';x.fillText('🃏 '+found.length+' · 🏛️ '+Myth.get().length+'/'+Object.keys(Myth.C).length,W/2,H*.58);txt(L().retry,W/2,H*.645,18,Math.sin(now*5)>0?'#7bed9f':'#fff')}
function draw(){x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);bg();if(st==='title')drawTitle();else if(st==='goal')drawGoal();else if(st==='play'||st==='quiz')drawPlay();else if(st==='clear')drawClear();else if(st==='over')drawOver(false);else if(st==='win')drawOver(true);for(const p of parts){x.globalAlpha=Math.max(0,p.l*2);x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5)}x.globalAlpha=1;for(const p of pops){x.globalAlpha=Math.min(1,p.l*1.6);txt(p.t,Math.max(90,Math.min(W-90,p.x)),p.y,20,p.c)}x.globalAlpha=1;x.restore();if(flash>0){x.fillStyle='rgba(255,244,210,'+Math.min(.35,flash)+')';x.fillRect(0,0,W,H)}}
function loop(t){const dt=Math.min(.033,(t-lt)/1000);lt=t;if(!paused){upd(dt);draw()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function overlap(a,b){return a.x<b.x+b.w-2&&b.x<a.x+a.w-2&&a.y<b.y+b.h-2&&b.y<a.y+a.h-2}
function audit(){const ps=[];const prev=st,pi=stage,pw=waveI,pt=timeMax;for(let i=0;i<STAGES.length;i++){stage=i;const S=cur();const waves=S.kind==='throne'?throneWaves().length:1;for(let w=0;w<waves;w++){waveI=w;deal();st='play';timeMax=S.time||0;const boxes=layout();if(!boxes.length)ps.push({stage:i+1,empty:true});boxes.forEach(b=>{if(b.w<40||b.h<40||b.x<0||b.y<50||b.x+b.w>W+1||b.y+b.h>H-2)ps.push({stage:i+1,wave:w,id:b.id,x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.w),h:Math.round(b.h),W,H})});for(let a=0;a<boxes.length;a++)for(let b=a+1;b<boxes.length;b++)if(overlap(boxes[a],boxes[b]))ps.push({stage:i+1,overlap:[boxes[a].id,boxes[b].id]});if(S.kind==='tree'&&S.fromTree!=null){const row=kidSlice(S);if(S.expect&&S.expect.join(',')!==row.join(','))ps.push({stage:i+1,treeDrift:row});if(boardB.filter(g=>g.key==='kid').length<boardA.length)ps.push({stage:i+1,unsolvable:'kids'});(S.dist||[]).forEach(d=>{if(row.includes(d))ps.push({stage:i+1,distInKids:d})})}else if(S.kind==='tree'){boardA.forEach(sl=>{if(!boardB.some(g=>g.key===sl.key))ps.push({stage:i+1,unsolvable:sl.key})})}else{boardA.forEach(a=>{if(!boardB.some(b=>b.key===a.key))ps.push({stage:i+1,wave:w,unsolvable:a.key})})}}}oly().forEach(id=>{if(!ROLES[id]||!Myth.C[id])ps.push({missingRole:id})});const ids=[];STAGES.forEach(S=>{(S.grant||[]).forEach(id=>ids.push(id));(S.pairs||[]).forEach(p=>{if(typeof p.a==='string')ids.push(p.a);if(typeof p.b==='string')ids.push(p.b)});(S.pool||[]).forEach(id=>ids.push(id));(S.dist||[]).forEach(d=>{if(typeof d==='string')ids.push(d);else if(d.kind==='god')ids.push(d.id)})});[...new Set(ids)].filter(id=>!Myth.C[id]).forEach(id=>ps.push({missing:id}));st=prev;stage=pi;waveI=pw;timeMax=pt;return ps}
function auto(){const boxes=layout().filter(b=>!isDone(b));const a=boxes.find(b=>b.side==='a');if(!a)return'no-a';const b=boxes.find(c=>c.side==='b'&&c.key===a.key);if(!b)return'no-b '+a.key;playTap(a.x+4,a.y+4);playTap(b.x+b.w/2,b.y+b.h/2);return cleared()?'cleared':'ok'}
window.__g30={get st(){return st},get stage(){return stage},get hearts(){return hearts},get score(){return score},get combo(){return combo},get cool(){return cool},get wave(){return waveI},get solved(){return solved.size},get kind(){return cur().kind},get timeLeft(){return timeLeft},boxes(){return layout().map(b=>({uid:b.uid,id:b.id,side:b.side,key:String(b.key),x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.w),h:Math.round(b.h),done:!!isDone(b)}))},tap(px,py){onTap(px,py)},jump(i){stage=i;waveI=0;st='goal'},audit,auto,tick(dt){upd(dt)},paint(){draw()},pause(v){paused=!!v},setGuard(v){guard=v}};
})();
