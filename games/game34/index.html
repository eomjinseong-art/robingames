  ['\'모카\'라는 이름은 어디서 왔을까요?','Where does the name \'mocha\' come from?','예멘의 모카 항구','The port of Mocha in Yemen','초콜릿 회사 이름','A chocolate company','커피 기계 이름','A coffee machine','옛날 커피는 예멘의 모카 항구에서 세계로 퍼졌어요.','Long ago, coffee travelled to the world from the port of Mocha in Yemen.']]},
{id:'vanilla',e:'🍯',n:K('바닐라 라떼','Vanilla Latte'),d:K('컵 크기에 맞게 시럽 펌프!','Syrup pumps that match the cup size!'),cup:'cup',steps:['order','shot','steam','build','art'],build:[['vanilla','P'],['shot','S'],['milk',1]],temp:'hot',sizes:true,milk:{t:[60,65],f:.25},

{id:'macch',e:'🍮',n:K('캐러멜 마키아토','Caramel Macchiato'),d:K('층 쌓기! 에스프레소를 맨 마지막에','Layering! Espresso goes on last'),cup:'glass',steps:['order','shot','steam','build'],build:[['vanilla','P'],['milk',1],['foam',1],['shot','S'],['caramel',1]],temp:'hot',sizes:true,milk:{t:[60,65],f:.4},

  ['캐러멜 마키아토에서 에스프레소를 마지막에 붓는 이유는?','Why is the espresso poured last in a caramel macchiato?','우유 위에 예쁜 층을 만들려고','To make pretty layers on the milk','빨리 식히려고','To cool it quickly','시럽을 아끼려고','To save syrup','거품이 샷을 잠깐 받쳐 주면서 갈색·흰색 층이 생겨요.','The foam catches the shot, making brown and white layers.']]},
{id:'iceame',e:'🧊',n:K('아이스 아메리카노','Iced Americano'),d:K('얼음이 먼저! 이유는?','Ice first! Why?'),cup:'ice',steps:['order','beans','shot','build'],build:[['ice',1],['coldw',1],['shot','S']],temp:'iced',sizes:true,beans:true,xshot:true,

function cutInfo(a){if(!a.cut||a.cut.length<2)return null;const p=a.cut[0],q=a.cut[a.cut.length-1];const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy);if(len<.05)return null;return {p,q,dx:dx/len,dy:dy/len,len,ang:Math.atan2(dy,dx)-Math.PI/2}}

 if(a.mess>0){cx.fillStyle='rgba(255,250,240,.55)';for(let i=0;i<Math.min(30,a.mess*40);i++){ell(Math.cos(i*2.7)*.7*((i%5)/5+.2),Math.sin(i*2.7)*.7*((i%5)/5+.2),.06,.05);cx.fill()}}
 const bl=a.blobs;for(let i=0;i<bl.length;i++){const b=bl[i];const wob=Math.min(.12,b.w*.08);
  if(ci&&b.cut){cx.fillStyle='#fffaf0';heartPath(b.x,b.y,b.r,ci.ang);cx.fill();if(i>0){cx.strokeStyle='rgba(150,85,40,.7)';cx.lineWidth=.03;heartPath(b.x,b.y,b.r*1.02,ci.ang);cx.stroke()}}
  else{cx.fillStyle='#fffaf0';cx.beginPath();for(let k=0;k<=24;k++){const an=k/24*Math.PI*2,rr_=b.r*(1+Math.sin(an*5+i)*wob);cx.lineTo(b.x+Math.cos(an)*rr_,b.y+Math.sin(an)*rr_)}cx.closePath();cx.fill();if(i>0){cx.strokeStyle='rgba(150,85,40,.7)';cx.lineWidth=.03;cx.stroke()}}}
 if(ci){cx.strokeStyle='rgba(255,250,240,.9)';cx.lineWidth=.025;cx.beginPath();cx.moveTo(ci.p[0],ci.p[1]);cx.lineTo(ci.q[0],ci.q[1]);cx.stroke()}
 cx.restore()}

 const big=bl.reduce((m,b)=>b.r>m.r?b:m,bl[0]);
 if(type=='heart'){if(bl.length>1){s-=12*(bl.length-1);why.push(Z('동그라미가 여러 개예요. 하트는 한 번에 동그랗게!','Several blobs. A heart is one round blob!'))}
  const d=Math.hypot(big.x,big.y);if(d>.25){s-=Math.min(30,(d-.25)*90);why.push(Z('가운데에서 조금 벗어났어요.','A bit off-centre.'))}
  if(big.r<.38){s-=Math.min(30,(.38-big.r)*120);why.push(Z('하트가 작아요. 낮게 조금 더 오래 부어요.','The heart is small. Pour low a little longer.'))}if(big.r>.75){s-=Math.min(25,(big.r-.75)*100);why.push(Z('너무 커서 넘칠 것 같아요.','So big it nearly overflows.'))}
  if(!ci){s-=30;why.push(Z('마지막에 높이 들고 쓱 가르기를 안 했어요.','No cut-through at the end (lift high and swipe).'))}else{const px=big.x-ci.p[0],py=big.y-ci.p[1],perp=Math.abs(px*ci.dy-py*ci.dx);if(perp>.12){s-=Math.min(25,(perp-.12)*120);why.push(Z('가르기가 가운데를 지나지 않았어요.','The cut missed the middle.'))}if(ci.len<big.r*1.8){s-=15;why.push(Z('가르기가 짧아요. 끝까지 쭉!','The cut is short. Go all the way through!'))}}}
 else{const n=bl.length;if(n<2){s-=35;why.push(Z('튤립은 동그라미를 2~3개 겹쳐요.','A tulip stacks 2–3 blobs.'))}else if(n>4){s-=10*(n-4);why.push(Z('동그라미가 너무 많아요.','Too many blobs.'))}
  const mx=bl.reduce((a,b)=>a+b.x,0)/n,my=bl.reduce((a,b)=>a+b.y,0)/n;const d=Math.hypot(mx,my);if(d>.3){s-=Math.min(25,(d-.3)*80);why.push(Z('가운데에서 벗어났어요.','Off-centre.'))}

 if(a.mess>.3){s-=Math.min(20,a.mess*20);why.push(Z('처음에 낮게 부어 크레마가 얼룩졌어요. 처음엔 높이서!','Pouring low at first stained the crema. Start high!'))}
 return {s:Math.max(0,Math.round(s)),why:why.join('<br>')}}

 geo(){const A=area();const R=Math.min(W*.36,(A.bot-A.top)*.34);return {x:W/2,y:A.top+(A.bot-A.top)*.5,R}},
 down(x,y){const g=this.geo();if(Math.hypot(x-g.x,y-g.y)>g.R*1.25||this.done)return;this.down_=true;this.move(x,y);if(this.hi&&this.fill>=.45)this.a.cut=[[this.px,this.py]];this.cur=null},

 finish(){if(this.done)return;this.done=true;this.down_=false;fingerOff();const r=artScore(this.a,this.type);G.art={...this.a,score:r.s,type:this.type};if(r.s>=60&&this.type=='heart'){SV.heart=1}if(r.s>=60&&this.type=='tulip')SV.tulip=1;SV.artTut=1;save();
  const nm=this.type=='heart'?Z('❤️ 하트','❤️ Heart'):Z('🌷 튤립','🌷 Tulip');const st=r.s>=85?3:r.s>=60?2:r.s>=35?1:0;sfx(st>=2?'win':st?'good':'fail');
