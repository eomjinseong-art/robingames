const NT=[220,261.6,293.7,329.6,392,440,523.3,587.3];const RIFF=[0,0,3,0,4,3,2,1,0,0,3,0,5,4,3,4];const BASS=[55,55,43.65,49];

 let g=x.createLinearGradient(0,0,0,HY+5);g.addColorStop(0,'#1b1036');g.addColorStop(.55,'#5a2a5e');g.addColorStop(1,'#e2775a');x.fillStyle=g;x.fillRect(-30,-30,W+60,HY+40);

 const mx=W*.78-ox*.05,my=HY*.32,mr=Math.min(W,CH)*.07;g=x.createRadialGradient(mx,my,mr*.5,mx,my,mr*4);g.addColorStop(0,'rgba(255,240,200,.45)');g.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=g;x.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);
 x.fillStyle='#fff3cf';x.beginPath();x.arc(mx,my,mr,0,7);x.fill();x.fillStyle='rgba(200,180,140,.35)';x.beginPath();x.arc(mx-mr*.3,my-mr*.2,mr*.22,0,7);x.arc(mx+mr*.35,my+mr*.3,mr*.15,0,7);x.fill();

 // ground
 g=x.createLinearGradient(0,HY,0,CH);g.addColorStop(0,'#3c2a44');g.addColorStop(1,'#1e1424');x.fillStyle=g;x.fillRect(-30,HY,W+60,CH-HY+30);
 const road=(a,b,c)=>{const p1=P(a,0,30),p2=P(b,0,30),p3=P(b,0,.6),p4=P(a,0,.6);x.fillStyle=c;x.beginPath();x.moveTo(...p1);x.lineTo(...p2);x.lineTo(...p3);x.lineTo(...p4);x.fill()};
 road(-1.6,1.6,'#2d2433');road(-2.3,-1.6,'#4b3d4f');road(1.6,2.3,'#4b3d4f');
 x.fillStyle='rgba(255,220,120,.55)';for(let z=1;z<30;z+=1.6){const a=P(-.04,0,z),b=P(.04,0,z+.8);x.fillRect(a[0],b[1],b[0]-a[0]||1,a[1]-b[1])}
 // houses along street
 for(const sd of[-1,1])for(let z=24;z>=1;z-=3){const z2=z+3,X1=sd*2.4,c=((z*7)|0)%3;const a=P(X1,0,z),b=P(X1,0,z2),cc=P(X1,2.1,z2),d=P(X1,2.1,z);x.fillStyle=['#40284a','#3a2440','#47304e'][c];x.beginPath();x.moveTo(...a);x.lineTo(...b);x.lineTo(...cc);x.lineTo(...d);x.fill();x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=1;x.stroke();
  const wa=P(X1,1.3,z+.8),wb=P(X1,.7,z+1.6);x.fillStyle=((z|0)%2)?'rgba(255,190,90,.7)':'rgba(120,90,140,.6)';x.beginPath();x.moveTo(wa[0],wa[1]);x.lineTo(wb[0],P(X1,1.3,z+1.6)[1]);x.lineTo(wb[0],wb[1]);x.lineTo(wa[0],P(X1,.7,z+.8)[1]);x.fill()}

 for(const z of LAMPS)for(const sd of[-1,1]){const top=P(sd*1.75,2.2,z),bot=P(sd*1.75,0,z),s=F/z;x.strokeStyle='#160d1c';x.lineWidth=Math.max(1,s*.04);x.beginPath();x.moveTo(bot[0],bot[1]);x.lineTo(top[0],top[1]);x.stroke();x.fillStyle='#ffe6a8';x.beginPath();x.arc(top[0],top[1],Math.max(1.5,s*.05),0,7);x.fill()}

function fogLayer(t,lo,hi,a){const g=x.createLinearGradient(0,HY-CH*.12,0,HY+CH*hi);g.addColorStop(0,'rgba(200,150,190,0)');g.addColorStop(.35,`rgba(200,160,200,${a})`);g.addColorStop(1,'rgba(200,160,200,0)');x.fillStyle=g;x.fillRect(-30,HY-CH*.12,W+60,CH*(hi+.12));

const WEP={pistol:{mag:6,cd:200,pel:1,spr:0},shotgun:{mag:4,cd:480,pel:5,spr:34},smg:{mag:14,cd:95,pel:1,spr:9},freeze:{mag:6,cd:230,pel:1,spr:0}};
let state='title',wave=1,score=0,combo=0,maxCombo=0,hp=3,best=+localStorage.getItem('g28best')||0,zs=[],parts=[],shells=[],pops=[],splats=[],queue=[],spawnT=0,shake=0,goAt=0,last=0,
 wep='pistol',lvl={shotgun:0,smg:0,freeze:0},ammo=6,relT=0,fireT=0,flashT=0,aim={x:0,y:0},cards=[],pickAt=0,clearT=0,hurtT=0,tracer=null,recoil=0;
function now(){return performance.now()}

function hud(){const m=magSize();document.getElementById('ammo').textContent=relT?'⏳ '+L('rel'):('●'.repeat(ammo)+'○'.repeat(Math.max(0,m-ammo))).slice(0,22);document.getElementById('wp').textContent=L('W')[wep]+(wep!='pistol'?' Lv'+lvl[wep]:'')+'  ·  '+'❤️'.repeat(Math.max(0,hp))}
const TY={n:{hr:.17,hy:1.4,bw:.42,bt:1.2,hp:3,sp:1},dance:{hr:.17,hy:1.4,bw:.42,bt:1.2,hp:3,sp:1},run:{hr:.15,hy:1.45,bw:.34,bt:1.25,hp:2,sp:2.1},shield:{hr:.17,hy:1.4,bw:.5,bt:1.2,hp:3,sp:.9},

function goalText(){const g=L('G');if(wave%5==0)return g[4];const i=wave<=4?wave-1:wave==6?5:wave==7?6:7;return g[i].replace('{n}',queue.length)}
function makeWave(){const w=wave,q=[];const nn=w==1?3:Math.min(26,4+Math.floor(w*1.6));const pool=['n'];if(w>=2)pool.push('dance');if(w>=3)pool.push('run','chub');if(w>=4)pool.push('shield');if(w>=6)pool.push('crawl');if(w>=7)pool.push('bucket');

 for(let i=0;i<nn;i++)q.push(w==1?'n':feat&&i%2==0?feat:pool[Math.random()*pool.length|0]);
 if(w%5==0)q.splice(1,0,'boss');queue=q}
function startWave(){state='play';spawnT=now()+400}

function start(){au();wave=1;score=0;combo=0;maxCombo=0;hp=3;wep='pistol';lvl={shotgun:0,smg:0,freeze:0};zs=[];parts=[];shells=[];pops=[];splats=[];cardWave();if(!bgmOn){bgmOn=true;nextBeat=ac.currentTime+.05;beatN=0}}
function spawn(){const ty=queue.shift(),d=TY[ty],w=wave;const lw=Math.min(.95,W*.42/F);
 zs.push({ty,Z:13,lx:(Math.random()*2-1)*lw*(ty=='boss'?.2:1),hp:d.hp,mx:d.hp,sp:(.8+w*.06)*d.sp*(w==1?.8:1)*(.9+Math.random()*.2),ph:Math.random()*6,fl:0,slow:0,bucket:ty=='bucket'?1:0,lw});if(Math.random()<.5)S('groan')}
function geo(z,t){const d=TY[z.ty],s=F/z.Z;let lx=z.lx;if(z.ty=='dance')lx+=Math.sin(t/380+z.ph)*.35;lx=Math.max(-z.lw,Math.min(z.lw,lx));

function shotAt(px,py,t){// returns hit result
