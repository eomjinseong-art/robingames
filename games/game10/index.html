    if (nextA) { store.d.unl.push(nextA); store.d.unl = ORDER.filter(k => store.d.unl.includes(k)); }
    store.save();
    $('gachaBox').innerHTML = `<div class="reveal">${nextA ? ANIMALS[nextA].e : '💨'}</div>` + (nextA ? miniHtml(nextA) : '');
    $('gachaMsg').textContent = nextA ? t('newFriend', { e: ANIMALS[nextA].e, n: pick(ANIMALS[nextA].n) }) : t('allFriends');
    snd.fart(0.6, 90, 0.7); snd.fanfare(); buzz([30, 40, 30, 40, 80]);
    $('gachaOk').style.visibility = 'visible';
  }, 1100);
}
// 이동 모양 미니 그림 (글 없이 이해)
function miniHtml(tk) {
  const st = { p: [{ t: tk, s: 12 }], k: -1, g: [], w: tk === 'frog' ? [7, 13, 16] : [], cd: 0 };
  const ms = pieceMoves(st, 0, boardOf(st));
  let h = '<div class="mini">';
  for (let s = 0; s < 25; s++) { const m = ms.find(x => x.to === s); h += `<i class="${s === 12 ? 'c' : st.w.includes(s) ? 'b' : m ? (m.tp ? 't' : 'm') : ''}"></i>`; }
  return h + '</div>';
}

/* ================== 화면 ================== */
function show(id) {
  ['titleScr', 'howScr', 'teamScr', 'winScr', 'loseScr', 'gachaScr'].forEach(s => $(s).classList.toggle('show', s === id));
  $('credit').style.display = (id === 'titleScr' || id === 'howScr') ? 'block' : 'none';
}
let toastTimer;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = 'none', 2000); }
function renderStages() {
  const box = $('stages'); box.innerHTML = '';
  for (let n = 1; n <= STAGES; n++) {
    const b = document.createElement('button'), s = store.d.stars[n] || 0, lock = n > store.d.prog, L = LEVELS[n - 1];
    b.className = 'st' + (L.boss ? ' boss' : '') + (n === store.d.prog ? ' cur' : '') + (lock ? ' lock' : '');
    b.innerHTML = (L.boss ? '🧙‍♀️' : '') + n + '<small>' + (lock ? '🔒' : '⭐'.repeat(s) || '·') + '</small>';
    b.addEventListener('click', e => { e.stopPropagation(); snd.init(); if (lock) { toast(t('stageLocked')); return; } openTeam(n); });
    box.appendChild(b);
  }
  $('playLabel').textContent = t('stage', { n: store.d.prog });
}
let picks = [];
function openTeam(n) {
  stageN = n; state = 'team'; picks = store.d.team.slice();
  $('teamTitle').textContent = (LEVELS[n - 1].boss ? t('boss') + ' · ' : '🏁 ') + t('stage', { n });
  renderPicks(); show('teamScr');
}
function renderPicks() {
  const box = $('picks'); box.innerHTML = '';
  ORDER.forEach(k => {
    const ok = store.d.unl.includes(k), o = picks.indexOf(k);
    const b = document.createElement('button'); b.className = 'pick' + (ok ? '' : ' lock') + (o >= 0 ? ' on' : '');
    b.innerHTML = `<div class="e">${ok ? ANIMALS[k].e : '❓'}</div>` + (ok ? miniHtml(k) : '<div style="height:64px;line-height:64px">🔒</div>') + (o >= 0 ? `<span class="ord">${o + 1}</span>` : '');
    b.addEventListener('click', e => {
      e.stopPropagation(); snd.init();
      if (!ok) { toast(t('locked')); return; }
      if (o >= 0) picks.splice(o, 1); else { if (picks.length >= 3) picks.shift(); picks.push(k); }
      snd.tone(700, 0.05, 'triangle', 0.15); renderPicks();
    });
    box.appendChild(b);
  });
}
function startStage() {
  if (!picks.length) { toast(t('needOne')); return; }
  const L = LEVELS[stageN - 1];
  const test = { p: picks.map((tk, i) => ({ t: tk, s: L.s[i] })), k: L.k, g: L.g.slice(), w: L.w, cd: 0 };
  const sol = solve(test, L.lim, 150000);
  if (!sol) { toast(t('cantTeam', { l: L.lim })); $('picks').classList.remove('shake'); void $('picks').offsetWidth; $('picks').classList.add('shake'); snd.tone(200, 0.2, 'square', 0.1); return; }
  store.d.team = picks.slice(); store.d.plays++; store.save();
  snd.init(); snd.startMusic();
  buildStage(stageN, picks);
  show(null); state = 'play';
  snd.fart(0.3);
}
function toTitle() { state = 'title'; renderStages(); show('titleScr'); }
const ui = fn => e => { e.stopPropagation(); if (e.currentTarget && e.currentTarget.blur) e.currentTarget.blur(); fn(e); };
$('playBtn').addEventListener('click', ui(() => { snd.init(); openTeam(store.d.prog); }));
$('howBtn').addEventListener('click', ui(() => { snd.init(); snd.boing(); state = 'how'; show('howScr'); }));
$('howClose').addEventListener('click', ui(() => toTitle()));
$('goBtn').addEventListener('click', ui(() => startStage()));
$('retryBtn').addEventListener('click', ui(() => { if (state !== 'play' && state !== 'lose') return; buildStage(stageN, team); show(null); state = 'play'; snd.boing(); }));
$('teamBtn').addEventListener('click', ui(() => { if (state === 'busy') return; openTeam(stageN); }));
$('nextBtn').addEventListener('click', ui(() => openTeam(Math.min(STAGES, stageN + 1))));
$('againBtn').addEventListener('click', ui(() => { buildStage(stageN, team); show(null); state = 'play'; }));
$('winMapBtn').addEventListener('click', ui(() => toTitle()));
$('loseRetry').addEventListener('click', ui(() => { buildStage(stageN, team); show(null); state = 'play'; }));
$('loseTeam').addEventListener('click', ui(() => openTeam(stageN)));
$('gachaOk').addEventListener('click', ui(() => { if (store.d.gas >= 100) return gacha(); state = 'win'; show('winScr'); }));
document.querySelectorAll('.overlay button').forEach(el => { el.addEventListener('pointerdown', e => e.stopPropagation()); });

function uiTap(el, fn) {
  let pid = null, fired = -1e9;
  const run = e => { fired = performance.now(); try { el.blur && el.blur(); } catch (err) {} fn(e); };
  el.addEventListener('pointerdown', e => { e.stopPropagation(); pid = e.pointerId; });
  el.addEventListener('pointerup', e => {
    e.stopPropagation();
    if (pid !== e.pointerId) return; pid = null;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const r = el.getBoundingClientRect();
    if (e.clientX < r.left - 10 || e.clientX > r.right + 10 || e.clientY < r.top - 10 || e.clientY > r.bottom + 10) return;
    run(e);
  });
  el.addEventListener('pointercancel', () => { pid = null; });
  el.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); if (performance.now() - fired < 800) return; run(e); });
  ['touchstart', 'touchend'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation(), { passive: true }));
}

const homeBtn = document.getElementById('homeBtn');
uiTap(homeBtn, () => { location.href = homeBtn.href; });
uiTap($('mapBtn'), () => { snd.init(); if (state === 'busy') return; toTitle(); });
uiTap($('muteBtn'), () => { snd.init(); snd.setMute(!snd.muted); updateMuteBtn(); if (!snd.muted) snd.fart(0.2); });
function updateMuteBtn() { const m = $('muteBtn'); m.textContent = snd.muted ? '🔇' : '🔊'; m.setAttribute('aria-pressed', snd.muted ? 'true' : 'false'); }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.title = lang === 'ko' ? '뿡뿡 농장 탈출 👨‍🌾💨 | 나두게임즈' : 'Toot Farm Escape 👨‍🌾💨 | Nadoo Games';
  $('langBtn').textContent = lang === 'ko' ? '🌏 EN' : '🌏 한';
  renderStages();
  if (state === 'team') openTeam(stageN);
  if (lvl) { renderTeamBar(); updateDanger(); }
}
uiTap($('langBtn'), () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} applyLang(); snd.init(); snd.boing(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) snd.stopMusic(); else if (state === 'play' || state === 'busy') { snd.init(); snd.startMusic(); } });
window.addEventListener('keydown', e => { if (e.key === 'm' || e.key === 'M') { snd.init(); snd.setMute(!snd.muted); updateMuteBtn(); } else if (e.key === 'Escape' && sel >= 0 && state === 'play') { sel = -1; reach = []; highlight(); renderTeamBar(); } });

/* ================== 읽기 전용 상태 (쇼츠 봇용) ================== */
function solution() {
  if (!cur || state === 'title' || state === 'team') return null;
  const k = keyOf(cur) + '#' + moves;
  if (solCache.k !== k) { const s = cur.k >= 0 ? solve(cur, Math.max(0, lvl.lim - moves), 150000) : null; let st = cur; const path = s ? s.path.map(m => { const o = { from: st.p[m.i].s, to: m.to, animal: st.p[m.i].t, teleport: m.tp }; st = fullTurn(st, m).st; return o; }) : null; solCache = { k, path }; }
  return solCache.path;
}
const snapshot = () => ({
  state, lang, stage: stageN, stages: STAGES, boss: !!(lvl && lvl.boss), par: lvl ? lvl.par : null, limit: lvl ? lvl.lim : null, moves,
  progress: store.d.prog, stars: Object.assign({}, store.d.stars), lastStars, gas: store.d.gas, unlocked: store.d.unl.slice(), team: team.slice(), savedTeam: store.d.team.slice(),
  selected: sel >= 0 && cur ? { animal: cur.p[sel].t, s: cur.p[sel].s } : null, reachable: reach.map(m => ({ to: m.to, teleport: m.tp })),
  board: cur ? { animals: cur.p.map(p => ({ t: p.t, e: ANIMALS[p.t].e, s: p.s })), king: cur.k, guards: cur.g.slice(), walls: cur.w.slice(), alienRest: !!cur.cd } : null,
  kingDanger: !!(cur && cur.k >= 0 && attackedAt(cur, cur.k)), combo,
  get solution() { return solution(); },
  audio: { state: snd.ac ? snd.ac.state : 'none', music: snd.musicOn, muted: snd.muted },
});
window.__tootking = Object.freeze({ snapshot, get state() { return state; }, get stage() { return stageN; } });

applyLang(); updateMuteBtn(); show('titleScr');
})();
</script>
