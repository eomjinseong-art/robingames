<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체스 오프닝 트레이너</title>
<meta name="description" content="초보 체스 오프닝 10개. 메인 라인을 따라 두고, 내 쪽만 연습하고, 이름과 다음 수를 퀴즈로 확인해요.">
<meta name="theme-color" content="#ffd32a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>">
<script src="/counter.js" defer></script>
<style>
:root { --ink:#2d1b00; --paper:#fff8dc; --yellow:#ffd32a; --mint:#7bed9f; --sky:#d7f4ff; --pink:#ffd0e6; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink);
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  background: linear-gradient(180deg, #9adfff 0%, #e7f8ff 38%, #fff3bf 100%);
  min-height: 100vh; min-height: 100dvh;
}
button, a { font-family: inherit; }
.wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.top { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 8px 0 10px; background: linear-gradient(180deg, rgba(154,223,255,.96), rgba(154,223,255,.88) 70%, rgba(154,223,255,0)); }
.top h1 { flex: 1; margin: 0; font-size: 18px; line-height: 1.25; word-break: keep-all; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 12px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; box-shadow: 0 3px 0 var(--ink); touch-action: manipulation; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.grow { flex: 1 1 40%; }
.btn.on, .btn[aria-pressed="true"] { background: var(--yellow); }
.btn.mint { background: var(--mint); }
.btn.ghost { background: var(--paper); box-shadow: none; }
.lead { margin: 4px 0 10px; font-size: 16px; line-height: 1.5; word-break: keep-all; }
.tabs { display: flex; gap: 8px; margin: 4px 0 8px; }
.tabs .btn { flex: 1; }
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 12px; margin: 12px 0; box-shadow: 0 5px 0 var(--ink); }
.card.head { display: flex; align-items: flex-start; gap: 8px; }
.card h2 { margin: 0; font-size: 22px; line-height: 1.2; word-break: keep-all; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 2px solid var(--ink); border-radius: 999px; padding: 2px 8px; font-size: 13px; font-weight: 800; background: #fff; }
.chip.easy { background: var(--mint); }
.chip.mid { background: var(--yellow); }
.chip.b { background: #3a3a3a; color: #fff; }
h3.lab { margin: 12px 0 4px; font-size: 15px; }
ul.goals { margin: 0; padding-left: 18px; }
ul.goals li { margin: 3px 0; font-size: 15px; line-height: 1.45; word-break: keep-all; }
.trap { background: #fff; border: 2px dashed var(--ink); border-radius: 14px; padding: 8px 10px; font-size: 15px; line-height: 1.45; word-break: keep-all; }
.line { display: flex; flex-direction: column; gap: 4px; }
.line div { font-size: 15px; line-height: 1.4; word-break: keep-all; }
.san { font-weight: 800; letter-spacing: .2px; }
.mn { color: #5a3a10; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.panel { background: #fff; border: 3px solid var(--ink); border-radius: 22px; padding: 10px; box-shadow: 0 5px 0 var(--ink); }
.boardwrap { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.boardwrap svg { width: 100%; height: auto; display: block; }
.fb { margin-top: 10px; border-radius: 14px; padding: 10px 12px; font-size: 16px; line-height: 1.45; word-break: keep-all; border: 3px solid var(--ink); }
.fb.ok { background: #d9ffd8; }
.fb.bad { background: #ffe1d6; }
.fb b { display: block; margin-bottom: 4px; }
.played { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.played button, .played span { border: 2px solid var(--ink); border-radius: 10px; background: #fff; min-height: 36px; padding: 4px 8px; font-size: 14px; font-weight: 700; }
.played button.on { background: var(--yellow); }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.opts .btn { width: 100%; justify-content: flex-start; text-align: left; font-weight: 700; white-space: normal; line-height: 1.35; }
.opts .ok { background: #d9ffd8; }
.opts .no { background: #ffe1d6; }
.q { font-size: 18px; font-weight: 800; margin: 8px 0; word-break: keep-all; }
@media (max-width: 360px) { .top h1 { font-size: 16px; } .card h2 { font-size: 20px; } }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/guide/play/chess.rules.js?v=20261022open"></script>
<script src="/games/game36/openings.js?v=20261022open"></script>
<script>
(function () {
  var R = window.NadooRules && window.NadooRules.chess;
  var O = window.NadooOpenings;
  var app = document.getElementById('app');
  if (!R || !O) { app.textContent = '규칙을 불러오지 못했어요.'; return; }

  var LANG_KEY = 'nadoo_lang';
  var lang = 'ko';
  try { lang = localStorage.getItem(LANG_KEY) || ((navigator.language || 'ko').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en'); } catch (e) {}
  if (lang !== 'ko' && lang !== 'en') lang = 'ko';

  var view = 'list', tab = 'w', cur = null, ply = 0, state = null, sel = -1, busy = false, feedback = null, hint = null, timer = null, quiz = null, quizOnly = '';
  var C = 48, PAD = 6, SZ = PAD * 2 + C * 8;
  var GL = { 1: '\u265F', 2: '\u265E', 3: '\u265D', 4: '\u265C', 5: '\u265B', 6: '\u265A' };

  function t(ko, en) { return lang === 'ko' ? ko : en; }
  function tx(v) { return v ? v[lang] || v.ko : ''; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pieceName(san) { return lang === 'ko' ? O.sanKo(san) : O.sanEn(san); }
  function userIs(op, i) { return (i % 2) === (op.side === 'w' ? 0 : 1); }
  function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }
  function closest(el, selStr) {
    while (el && el !== app) {
      if (el.matches && el.matches(selStr)) return el;
      el = el.parentNode;
    }
    return null;
  }

  function boardSVG(s, flip, interactive) {
    var legal = interactive ? R.moves(s) : [], dests = {};
    if (sel >= 0) legal.forEach(function (m) { if (m.f === sel) dests[m.t] = 1; });
    function XY(i) { var r = i >> 3, c = i & 7; if (flip) { r = 7 - r; c = 7 - c; } return [PAD + c * C, PAD + r * C]; }
    var h = '<svg class="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + SZ + ' ' + SZ + '" role="img" aria-label="' + esc(t('체스판', 'Chessboard')) + '">';
    h += '<rect width="' + SZ + '" height="' + SZ + '" rx="12" fill="#e9c27d"/>';
    var i, xy;
    for (i = 0; i < 64; i++) {
      xy = XY(i);
      var dark = ((i >> 3) + (i & 7)) % 2 === 1;
      h += '<rect data-sq="' + i + '" x="' + xy[0] + '" y="' + xy[1] + '" width="' + C + '" height="' + C + '" fill="' + (dark ? '#b58863' : '#f0d9b5') + '"/>';
      if (s.last && (s.last.f === i || s.last.t === i)) h += '<rect x="' + xy[0] + '" y="' + xy[1] + '" width="' + C + '" height="' + C + '" fill="#f6e35a" opacity=".55"/>';
      if (hint && (hint.f === i || hint.t === i)) h += '<rect x="' + xy[0] + '" y="' + xy[1] + '" width="' + C + '" height="' + C + '" fill="#3dce67" opacity=".55"/>';
      if (i === sel) h += '<rect x="' + xy[0] + '" y="' + xy[1] + '" width="' + C + '" height="' + C + '" fill="#fff59d" opacity=".9"/>';
    }
    for (i = 0; i < 64; i++) {
      xy = XY(i);
      var vr = flip ? 7 - (i >> 3) : (i >> 3), vc = flip ? 7 - (i & 7) : (i & 7);
      var light = ((i >> 3) + (i & 7)) % 2 === 0;
      var ink = light ? '#8a6a45' : '#f3e2c4';
      if (vr === 7) h += '<text x="' + (xy[0] + C - 3) + '" y="' + (xy[1] + C - 3) + '" font-size="11" text-anchor="end" fill="' + ink + '">' + 'abcdefgh'[i & 7] + '</text>';
      if (vc === 0) h += '<text x="' + (xy[0] + 3) + '" y="' + (xy[1] + 12) + '" font-size="11" fill="' + ink + '">' + (8 - (i >> 3)) + '</text>';
    }
    for (i = 0; i < 64; i++) {
      var p = s.b[i]; if (!p) continue;
      var w = (p >> 3) === 0; xy = XY(i);
      h += '<text x="' + (xy[0] + C / 2) + '" y="' + (xy[1] + C * 0.78) + '" font-size="' + (C * 0.78) + '" text-anchor="middle" font-family="DejaVu Sans,Segoe UI Symbol,Apple Symbols,Noto Sans Symbols 2,sans-serif" fill="' + (w ? '#fff' : '#161616') + '" stroke="' + (w ? '#161616' : '#fff') + '" stroke-width="' + (w ? 1.4 : 0.7) + '" paint-order="stroke">' + GL[p & 7] + '\uFE0E</text>';
    }
    Object.keys(dests).forEach(function (to) {
      var d = XY(+to), cap = s.b[+to] || ((s.b[sel] & 7) === 1 && (+to & 7) !== (sel & 7));
      h += cap
        ? '<circle cx="' + (d[0] + C / 2) + '" cy="' + (d[1] + C / 2) + '" r="' + (C * 0.42) + '" fill="none" stroke="#333" stroke-width="4" opacity=".5"/>'
        : '<circle cx="' + (d[0] + C / 2) + '" cy="' + (d[1] + C / 2) + '" r="7" fill="#333" opacity=".4"/>';
    });
    h += '</svg>';
    return h;
  }

  function lineBlock(op) {
    var h = '<div class="line">';
    for (var i = 0; i < op.moves.length; i += 2) {
      h += '<div><b>' + (i / 2 + 1) + '.</b> ' + moveBits(op.moves[i]);
      if (op.moves[i + 1]) h += ' · ' + moveBits(op.moves[i + 1]);
      h += '</div>';
    }
    return h + '</div>';
  }
  function moveBits(m) {
    return '<span class="san">' + esc(m.san) + '</span> <span class="mn">' + esc(pieceName(m.san)) + '</span>';
  }
  function header(title, back) {
    return '<div class="top"><a class="btn" href="/">' + esc(t('홈', 'Home')) + '</a>' +
      (back ? '<button class="btn" type="button" data-act="back">' + esc(t('목록', 'List')) + '</button>' : '') +
      '<h1>' + esc(title) + '</h1><button class="btn" type="button" data-act="lang" aria-label="Language">' + (lang === 'ko' ? 'EN' : '한') + '</button></div>';
  }

  function renderList() {
    document.title = t('체스 오프닝 트레이너', 'Chess Opening Trainer');
    var h = header(t('체스 오프닝 트레이너', 'Chess Opening Trainer'), false);
    h += '<p class="lead">' + esc(t('초보 오프닝 10개예요. 수를 따라 두고, 내 쪽만 연습한 다음, 이름이나 다음 수를 맞춰 봐요. 라인 끝 국면으로 컴퓨터와 이어서 둘 수 있어요.', 'Ten beginner openings. Replay the line, practice your side, then quiz the name or the next move. You can continue that position against the computer.')) + '</p>';
    h += '<div class="tabs" role="tablist"><button class="btn" type="button" data-act="tab" data-side="w" aria-pressed="' + (tab === 'w') + '">' + esc(t('백으로 두기', 'Play as White')) + '</button><button class="btn" type="button" data-act="tab" data-side="b" aria-pressed="' + (tab === 'b') + '">' + esc(t('흑으로 받기', 'Play as Black')) + '</button></div>';
    h += '<div class="row"><button class="btn mint grow" type="button" data-act="quiz" data-id="">' + esc(t('섞어서 퀴즈', 'Mixed quiz')) + '</button></div>';
    O.list.filter(function (op) { return op.side === tab; }).forEach(function (op) {
      h += '<article class="card"><div class="head"><div><h2>' + esc(tx(op.name)) + '</h2><div class="meta"><span class="chip ' + (op.side === 'b' ? 'b' : '') + '">' + esc(op.side === 'w' ? t('백', 'White') : t('흑', 'Black')) + '</span><span class="chip ' + (op.diff.ko === '쉬움' ? 'easy' : 'mid') + '">' + esc(tx(op.diff)) + '</span></div></div></div>';
      h += '<p class="lead">' + esc(tx(op.blurb)) + '</p>';
      h += '<h3 class="lab">' + esc(t('목표', 'Goals')) + '</h3><ul class="goals">' + op.goals.map(function (g) { return '<li>' + esc(tx(g)) + '</li>'; }).join('') + '</ul>';
      h += '<h3 class="lab">' + esc(t('기본 수순', 'Main line')) + '</h3>' + lineBlock(op);
      h += '<h3 class="lab">' + esc(t('흔한 함정', 'A common trap')) + '</h3><div class="trap">' + esc(tx(op.trap)) + '</div>';
      h += '<div class="row">' +
        '<button class="btn grow" type="button" data-act="replay" data-id="' + op.id + '">' + esc(t('따라 두기', 'Replay')) + '</button>' +
        '<button class="btn grow" type="button" data-act="practice" data-id="' + op.id + '">' + esc(t('연습', 'Practice')) + '</button>' +
        '<button class="btn grow" type="button" data-act="quiz" data-id="' + op.id + '">' + esc(t('퀴즈', 'Quiz')) + '</button>' +
        '<button class="btn mint grow" type="button" data-act="live" data-id="' + op.id + '">' + esc(t('실전 대국', 'Play vs computer')) + '</button></div></article>';
    });
    app.innerHTML = h;
  }

  function feedbackHtml() {
    if (!feedback) return '';
    var cls = feedback.ok ? 'ok' : 'bad';
    var title = !feedback.ok ? t('그 수는 이 라인이 아니에요', 'That is not the move in this line')
      : feedback.replay ? (feedback.opp ? t('상대의 수', 'Their move') : t('내 수', 'Your move'))
      : (feedback.opp ? t('상대의 수', 'Their move') : t('맞아요', 'Correct'));
    var h = '<div class="fb ' + cls + '" aria-live="polite"><b>' + esc(title) + '</b><div>' + esc(feedback.san) + ' · ' + esc(pieceName(feedback.san)) + '</div><div>' + esc(tx(feedback.why)) + '</div>';
    if (!feedback.ok) h += '<div class="row"><button class="btn mint grow" type="button" data-act="correct">' + esc(t('정답 수 두기', 'Play the correct move')) + '</button></div>';
    return h + '</div>';
  }

  function renderTrain() {
    var flip = cur.side === 'b';
    var interactive = view === 'practice' && !busy && ply < cur.moves.length && userIs(cur, ply);
    var h = header(tx(cur.name), true);
    h += '<div class="panel"><div class="boardwrap">' + boardSVG(state, flip, interactive) + '</div>';
    h += '<div class="meta" style="margin-top:8px"><span class="chip">' + esc(view === 'replay' ? t('따라 두기', 'Replay') : t('연습', 'Practice')) + '</span><span class="chip">' + ply + ' / ' + cur.moves.length + '</span></div>';
    if (view === 'replay') {
      var last = ply ? cur.moves[ply - 1] : null;
      if (last) {
        var prev = ply === 1 ? R.init() : R.replay(O.sans(cur).slice(0, ply - 1));
        var shown = R.toSan(prev, R.parseSan(prev, last.san));
        feedback = { ok: true, replay: true, opp: !userIs(cur, ply - 1), san: shown, why: last.why };
      } else feedback = null;
      h += feedbackHtml();
      h += '<div class="row"><button class="btn grow" type="button" data-act="start">' + esc(t('처음', 'Start')) + '</button><button class="btn grow" type="button" data-act="prev">' + esc(t('이전', 'Back')) + '</button><button class="btn grow" type="button" data-act="next">' + esc(t('다음', 'Next')) + '</button><button class="btn grow" type="button" data-act="end">' + esc(t('끝', 'End')) + '</button></div>';
      h += '<div class="played">';
      for (var i = 0; i < cur.moves.length; i++) {
        if (i % 2 === 0) h += '<b style="align-self:center">' + (i / 2 + 1) + '.</b>';
        h += '<button type="button" data-act="jump" data-n="' + (i + 1) + '"' + (ply === i + 1 ? ' class="on"' : '') + '>' + esc(cur.moves[i].san) + '</button>';
      }
      h += '</div>';
    } else {
      if (ply >= cur.moves.length) {
        h += '<div class="fb ok" aria-live="polite"><b>' + esc(t('기본 라인을 모두 뒀어요', 'You played the whole line')) + '</b><div>' + esc(t('이 국면 그대로 컴퓨터와 이어서 둘 수 있어요.', 'Continue from this exact position against the computer.')) + '</div></div>';
      } else if (busy) {
        h += '<div class="fb ok"><b>' + esc(t('상대가 두는 중이에요', 'Their move is coming')) + '</b></div>';
      } else if (userIs(cur, ply)) {
        h += '<div class="fb"><b>' + esc(t('내 차례예요. 기물을 누르고 칸을 누르세요.', 'Your turn. Tap a piece, then a square.')) + '</b></div>';
      }
      h += feedbackHtml();
      if (ply >= cur.moves.length) h += '<div class="row"><button class="btn grow" type="button" data-act="practice" data-id="' + cur.id + '">' + esc(t('다시 연습', 'Practice again')) + '</button></div>';
    }
    h += '<div class="row"><button class="btn mint grow" type="button" data-act="live" data-id="' + cur.id + '">' + esc(t('이 국면으로 실전 대국', 'Play this position vs computer')) + '</button></div></div>';
    app.innerHTML = h;
  }

  function renderQuiz() {
    var flip = cur.side === 'b';
    var interactive = quiz.kind === 'move' && !quiz.picked;
    var h = header(t('퀴즈', 'Quiz'), true);
    h += '<div class="panel"><div class="boardwrap">' + boardSVG(state, flip, interactive) + '</div>';
    if (quiz.kind === 'name') h += '<p class="q">' + esc(t('이 오프닝의 이름은?', 'What is this opening called?')) + '</p>';
    else h += '<p class="q">' + esc((quiz.ply % 2 === 0 ? t('백', 'White') : t('흑', 'Black')) + t('의 다음 수는?', ': what is the next book move?')) + '</p>';
    h += '<div class="opts">';
    quiz.options.forEach(function (opt, i) {
      var val = quiz.kind === 'name' ? opt.id : opt;
      var label = quiz.kind === 'name' ? tx(opt.name) : (opt + ' · ' + pieceName(opt));
      var cls = '';
      if (quiz.picked) {
        if (val === quiz.answer) cls = ' ok';
        else if (val === quiz.picked) cls = ' no';
      }
      h += '<button class="btn' + cls + '" type="button" data-act="opt" data-i="' + i + '">' + esc(label) + '</button>';
    });
    h += '</div>';
    if (quiz.picked) {
      var why = quiz.kind === 'name' ? tx(O.byId(quiz.answer).blurb) : tx(quiz.why);
      var head = quiz.right ? t('맞아요', 'Correct') : (quiz.kind === 'name' ? t('정답은 ', 'The answer is ') + tx(O.byId(quiz.answer).name) : t('정답은 ', 'The answer is ') + quiz.answer + ' · ' + pieceName(quiz.answer));
      h += '<div class="fb ' + (quiz.right ? 'ok' : 'bad') + '" aria-live="polite"><b>' + esc(head) + '</b><div>' + esc(why) + '</div></div>';
      h += '<div class="row"><button class="btn mint grow" type="button" data-act="nextq">' + esc(t('다음 문제', 'Next question')) + '</button></div>';
    }
    h += '</div>';
    app.innerHTML = h;
  }

  function render() {
    document.documentElement.lang = lang;
    if (view === 'list') renderList();
    else if (view === 'quiz') renderQuiz();
    else renderTrain();
  }

  function setPly(n) {
    ply = Math.max(0, Math.min(cur.moves.length, n));
    state = ply ? R.replay(O.sans(cur).slice(0, ply)) : R.init();
    sel = -1; hint = null;
    render();
  }
  function startReplay(op) { clearTimer(); cur = op; view = 'replay'; feedback = null; hint = null; busy = false; setPly(0); window.scrollTo(0, 0); }
  function startPractice(op) {
    clearTimer(); cur = op; view = 'practice'; ply = 0; state = R.init(); sel = -1; feedback = null; hint = null; busy = false;
    pump();
    window.scrollTo(0, 0);
  }
  function pump() {
    if (view !== 'practice') return;
    if (ply >= cur.moves.length || userIs(cur, ply)) { busy = false; render(); return; }
    busy = true; render();
    timer = setTimeout(function () {
      timer = null;
      if (view !== 'practice') return;
      var mv = R.parseSan(state, cur.moves[ply].san);
      feedback = { ok: true, opp: true, san: R.toSan(state, mv), why: cur.moves[ply].why };
      state = R.play(state, mv); ply++; sel = -1; hint = null; busy = false;
      render();
    }, window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 420);
  }
  function playBook() {
    if (view !== 'practice' || busy || ply >= cur.moves.length) return;
    var book = R.parseSan(state, cur.moves[ply].san);
    feedback = { ok: true, opp: false, san: R.toSan(state, book), why: cur.moves[ply].why };
    state = R.play(state, book); ply++; sel = -1; hint = null;
    render();
    timer = setTimeout(function () { timer = null; pump(); }, 520);
  }
  function commitPractice(mv) {
    if (busy || ply >= cur.moves.length || !userIs(cur, ply)) return;
    var book = R.parseSan(state, cur.moves[ply].san);
    if (mv.f === book.f && mv.t === book.t && (mv.p || 0) === (book.p || 0)) { clearTimer(); playBook(); return; }
    feedback = { ok: false, opp: false, san: R.toSan(state, book), why: cur.moves[ply].why };
    hint = { f: book.f, t: book.t }; sel = -1; render();
  }
  function startQuiz(onlyId) {
    clearTimer(); quizOnly = onlyId || ''; view = 'quiz'; nextQ();
  }
  function nextQ() {
    window.scrollTo(0, 0);
    quiz = O.makeQuiz(R, { onlyId: quizOnly || null });
    quiz.picked = null; quiz.right = false;
    cur = O.byId(quiz.opId);
    state = R.replay(O.sans(cur).slice(0, quiz.ply));
    sel = -1; hint = null; feedback = null; busy = false;
    render();
  }
  function grade(val, played) {
    if (quiz.picked) return;
    quiz.picked = val;
    quiz.right = val === quiz.answer;
    if (quiz.kind === 'move') {
      var book = R.parseSan(state, quiz.answer);
      if (quiz.right && played) state = R.play(state, played);
      else if (quiz.right) state = R.play(state, book);
      else hint = { f: book.f, t: book.t };
    }
    sel = -1; render();
  }
  function goLive(op) {
    var moves = O.sans(op);
    try { localStorage.setItem('nadoo_chess_opening_start', JSON.stringify({ moves: moves, side: op.side, name: op.name.ko, fen: R.fen(R.replay(moves)) })); } catch (e) {}
    location.href = O.liveHref(op);
  }
  function onSquare(sq) {
    if (busy) return;
    var me, legal, dests, opts, mv, pc;
    if (view === 'practice') {
      if (ply >= cur.moves.length || !userIs(cur, ply)) return;
      me = cur.side === 'w' ? 0 : 1;
    } else if (view === 'quiz' && quiz && quiz.kind === 'move' && !quiz.picked) me = state.turn;
    else return;
    legal = R.moves(state); dests = {};
    if (sel >= 0) legal.forEach(function (m) { if (m.f === sel) dests[m.t] = 1; });
    if (sel >= 0 && dests[sq]) {
      opts = legal.filter(function (m) { return m.f === sel && m.t === sq; });
      mv = opts.filter(function (m) { return (m.p || 0) === 5; })[0] || opts[0];
      sel = -1;
      if (view === 'practice') commitPractice(mv);
      else grade(R.toSan(state, mv), mv);
      return;
    }
    pc = state.b[sq];
    sel = pc && (pc >> 3) === me ? sq : -1;
    render();
  }
  function onBoard(svg, ev) {
    var rect = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    var x = (ev.clientX - rect.left) * vb.width / rect.width;
    var y = (ev.clientY - rect.top) * vb.height / rect.height;
    var c = Math.floor((x - PAD) / C), r = Math.floor((y - PAD) / C);
    if (r < 0 || r > 7 || c < 0 || c > 7) return;
    if (cur && cur.side === 'b') { r = 7 - r; c = 7 - c; }
    onSquare(r * 8 + c);
  }
  function onAct(el) {
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    var op = id ? O.byId(id) : cur;
    if (act === 'lang') { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} render(); return; }
    if (act === 'tab') { tab = el.getAttribute('data-side'); render(); return; }
    if (act === 'back') { clearTimer(); view = 'list'; cur = null; feedback = null; hint = null; render(); window.scrollTo(0, 0); return; }
    if (act === 'replay' && op) { startReplay(op); return; }
    if (act === 'practice' && op) { startPractice(op); return; }
    if (act === 'quiz') { startQuiz(id || ''); return; }
    if (act === 'live' && op) { goLive(op); return; }
    if (act === 'next') { setPly(ply + 1); return; }
    if (act === 'prev') { setPly(ply - 1); return; }
    if (act === 'start') { setPly(0); return; }
    if (act === 'end') { setPly(cur.moves.length); return; }
    if (act === 'jump') { setPly(+el.getAttribute('data-n')); return; }
    if (act === 'correct') { clearTimer(); playBook(); return; }
    if (act === 'opt' && quiz && !quiz.picked) {
      var opt = quiz.options[+el.getAttribute('data-i')];
      grade(quiz.kind === 'name' ? opt.id : opt, null);
      return;
    }
    if (act === 'nextq') nextQ();
  }

  app.addEventListener('click', function (ev) {
    var btn = closest(ev.target, '[data-act]');
    if (btn) { onAct(btn); return; }
    var svg = closest(ev.target, 'svg.board');
    if (svg) onBoard(svg, ev);
  });
  render();
})();
</script>
</body>
</html>
