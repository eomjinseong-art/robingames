  const order = seats.slice().sort((a, b) => scores[b] - scores[a]);
  const name = s => (mode === 'solo' ? (s === 0 ? PLAYER_EMOJIS[0] + ' ' + t('you') : `<span class="seat-role">CPU</span> ${RIVALS[s - 1].e} ${t(RIVALS[s - 1].k)}`) : `${PLAYER_EMOJIS[s]} P${s + 1}`);
  $('rankList').innerHTML = order.map((s, i) => `<div class="${mode === 'solo' && s === 0 ? 'me' : ''}"><span>${['🥇', '🥈', '🥉', '4️⃣'][i]} ${name(s)}</span><b>🃏 ${scores[s]}</b></div>`).join('');
  let info = '', newBest = false;
  if (mode === 'solo') {
    const rank = 1 + order.filter(s => scores[s] > scores[0]).length;
    const topRival = Math.max(scores[1], scores[2], scores[3]);
    if (rank === 1) { $('overEmoji').textContent = '👑🔔💨'; $('overMsg').textContent = t('rank1'); snd.fanfare(); snd.fart(0.9, 60, 0.6, 0.6); store.d.wins = (store.d.wins || 0) + 1; }
    else { $('overEmoji').textContent = '😭🔔'; $('overMsg').textContent = topRival - scores[0] <= 4 ? t('close', { n: topRival - scores[0] }) : t('rankN', { n: rank }); snd.sad(); }
    if (scores[0] > store.d.bestScore) { store.d.bestScore = scores[0]; newBest = true; }
    if (bestRxRound && (!store.d.bestRx || bestRxRound < store.d.bestRx)) { store.d.bestRx = bestRxRound; newBest = true; }
    info = t('overInfo', { r: bestRxRound ? bestRxRound + 'ms' : '-', w: hits, x: misses }) + (newBest ? '<br>' + t('newBest') : '');
    log('round_end', { rank, scores: scores.slice(), bestRx: bestRxRound, hits, misses, newBest });
  } else {
    const tie = order.length > 1 && scores[order[0]] === scores[order[1]];
    $('overEmoji').textContent = tie ? '🤝🔔' : '🏆🔔💨'; $('overMsg').textContent = tie ? t('tie') : t('mpWin', { p: PLAYER_EMOJIS[order[0]] + ' P' + (order[0] + 1) });
    snd.fanfare(); log('round_end', { scores: scores.slice(0, nPlayers) });
  }
  store.d.plays++; store.save(); firstEver = false;
  $('overInfo').innerHTML = info; renderBest();
  banner(t('timeUp'), 900);
  setTimeout(() => { if (state === 'over') show('overScr'); }, 1000);
}
function toTitle() { state = 'title'; paused = false; stage.classList.remove('playing', 'fever', 'mp'); snd.stopMusic(); renderBest(); show('titleScr'); }
function setPause(p) {
  if (state !== 'play' && state !== 'resolve' && state !== 'count') return;
  paused = p; show(p ? 'pauseScr' : null); if (p) snd.stopMusic(); else { snd.init(); snd.startMusic(); }
  $('pauseBtn').textContent = p ? '▶️' : '⏸️';
}

/* ================== 메인 루프 (게임 시계) ================== */
function loop(now) {
  const dt = Math.min(100, Math.max(0, now - (lastNow || now))); lastNow = now;
  if (!paused && (state === 'play' || state === 'resolve' || state === 'count')) gt += dt;
  if (!paused) step();
  drawHands();
  requestAnimationFrame(loop);
}
function step() {
  if (state === 'count') {
    const n = Math.ceil((countEnd - gt) / 800);
    if (n !== lastCount) { lastCount = n; if (n > 0) { banner(String(n), 700); snd.tick(); } }
    if (gt >= countEnd) { state = 'play'; banner(t('go') + ' 💨', 600); snd.go(); nextFlip = gt + 350; log('play'); }
    return;
  }
  if (state !== 'play' && state !== 'resolve') return;
  const tl = timeLeft();
  $('timeTxt').textContent = Math.ceil(tl / 1000); $('timeFill').style.width = (tl / ROUND_MS * 100) + '%';
  if (fever && gt >= feverEnd) endFever();
  if (!feverUsed && tl <= 20000 && state === 'play') startFever();
  if (state === 'resolve') {
    if (gt >= resolveEnd) { piles = [[], [], [], []]; for (let p = 0; p < 4; p++) renderPile(p); renderHint(); state = 'play'; nextFlip = gt + 450; trap = null; }
    return;
  }
  if (tl <= 0) return endRound();
  if (mode === 'solo') {
    let best = -1; plans.forEach((p, i) => { if (p !== null && p <= gt && (best < 0 || p < plans[best])) best = i; });
    if (best >= 0) {
      if (valid) { resolveWin(best + 1, true); return; }
      plans[best] = null; rivalFooled(best);
    }
  }
  if (valid && missTimer && gt >= missTimer) { valid = false; missTimer = 0; toast(t('missed')); log('missed'); nextFlip = gt + 300; snd.tone(300, 0.3, 'sine', 0.2, 150); }
  if (gt >= nextFlip) flip();
}
function drawHands() {
  if (mode !== 'solo') return;
  const s = stage.getBoundingClientRect(), b = $('bell0').getBoundingClientRect();
  const bx = b.left - s.left + b.width / 2, by = b.top - s.top + b.height * 0.45;
  RIVALS.forEach((rv, i) => {
    const h = $('hand' + i), av = $('rv' + i); if (!h || !av) return;
    let p = handP[i];
    if (state === 'play' && plans[i] !== null) p = Math.max(p, Math.min(1, 1 - (plans[i] - gt) / 320));
    else if (state === 'resolve' && resolveWho === i + 1) p = 1;
    else p = Math.max(0, p - 0.06);
    handP[i] = p;
    const a = av.getBoundingClientRect(), ax = a.left - s.left + a.width / 2, ay = a.top - s.top + a.height * 0.6;
    const e = 1 - Math.pow(1 - p, 3), x = ax + (bx - ax) * e, y = ay + (by - ay) * e;
    h.style.opacity = p > 0.02 ? 1 : 0;
    h.style.transform = `translate(${x - 23}px, ${y - 30}px) rotate(${(bx - ax) * 0.05 * (1 - e)}deg) scale(${1 + 0.3 * e})`;
  });
}

/* ================== 입력 ================== */
function bindBell(el, seat) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); press(seat); });
  el.addEventListener('contextmenu', e => e.preventDefault());
  ['touchstart', 'touchend'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation(), { passive: true }));
}
bindBell($('bell0'), 0);
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'm') { snd.setMute(!snd.muted); updateMuteBtn(); return; }
  if (k === 'escape' || k === 'p' && mode === 'solo') { setPause(!paused); return; }
  if (state !== 'play' && state !== 'resolve') return;
  if (mode === 'solo' && (k === ' ' || k === 'enter')) { e.preventDefault(); press(0); }
  else if (mode !== 'solo') { const i = ['a', 'l', 'q', 'p'].indexOf(k); if (i >= 0) press(i); }
});
function uiTap(el, fn) {
  let pid = null, fired = -1e9;
  const run = e => { fired = performance.now(); try { el.blur && el.blur(); } catch (err) {} fn(e); };
  el.addEventListener('pointerdown', e => { e.stopPropagation(); pid = e.pointerId; });
  el.addEventListener('pointerup', e => {
    e.stopPropagation(); if (pid !== e.pointerId) return; pid = null;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const r = el.getBoundingClientRect();
    if (e.clientX < r.left - 10 || e.clientX > r.right + 10 || e.clientY < r.top - 10 || e.clientY > r.bottom + 10) return;
    run(e);
  });
  el.addEventListener('pointercancel', () => { pid = null; });
  el.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); if (performance.now() - fired < 800) return; run(e); });
  ['touchstart', 'touchend'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation(), { passive: true }));
}
const homeBtn = $('homeBtn');
uiTap(homeBtn, () => { location.href = homeBtn.href; });
uiTap($('pauseBtn'), () => { snd.init(); if (state === 'title' || state === 'over') return; setPause(!paused); });
uiTap($('muteBtn'), () => { snd.init(); snd.setMute(!snd.muted); updateMuteBtn(); if (!snd.muted) snd.fart(0.2); });
function updateMuteBtn() { const m = $('muteBtn'); m.textContent = snd.muted ? '🔇' : '🔊'; m.setAttribute('aria-pressed', snd.muted ? 'true' : 'false'); }
function renderBest() {
  $('bestTxt').textContent = store.d.plays ? t('best', { s: store.d.bestScore, r: store.d.bestRx ? store.d.bestRx + 'ms' : '-' }) : '';
  $('hintLbl').textContent = hintOn ? t('hintOn') : t('hintOff'); $('hintTog').classList.toggle('on', hintOn);
}
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => (el.textContent = t(el.dataset.i18n)));
  document.querySelectorAll('[data-i18n-html]').forEach(el => (el.innerHTML = t(el.dataset.i18nHtml)));
  document.title = lang === 'ko' ? '뿡 벨 🔔💨 | 나두게임즈' : 'Toot Bell 🔔💨 | Nadoo Games';
  $('langBtn').textContent = lang === 'ko' ? '🌏 EN' : '🌏 한';
  renderBest(); renderOwners();
  if (state !== 'title') { RIVALS.forEach((r, i) => { const n = document.querySelector('#rv' + i + ' .nm'); if (n) n.textContent = t(r.k); }); for (let p = 0; p < 4; p++) renderPile(p); renderHint(); }
}
uiTap($('langBtn'), () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} applyLang(); snd.init(); snd.tick(); });
const ui = fn => () => { snd.init(); fn(); };
$('playBtn').addEventListener('click', ui(() => startRound('solo', 1)));
document.querySelectorAll('[data-mp]').forEach(b => b.addEventListener('click', ui(() => startRound('mp', +b.dataset.mp))));
$('hintTog').addEventListener('click', ui(() => { hintOn = !hintOn; store.d.hint = hintOn; store.save(); renderBest(); renderHint(); snd.tick(); }));
$('howBtn').addEventListener('click', ui(() => show('howScr')));
$('howClose').addEventListener('click', ui(() => show('titleScr')));
$('resumeBtn').addEventListener('click', ui(() => setPause(false)));
$('restartBtn').addEventListener('click', ui(() => { $('pauseBtn').textContent = '⏸️'; snd.stopMusic(); startRound(mode, nPlayers); }));
$('quitBtn').addEventListener('click', ui(() => { $('pauseBtn').textContent = '⏸️'; toTitle(); }));
$('againBtn').addEventListener('click', ui(() => startRound(mode, nPlayers)));
$('menuBtn').addEventListener('click', ui(() => toTitle()));
document.addEventListener('visibilitychange', () => { if (document.hidden) { snd.sleep(); if (state === 'play' || state === 'resolve' || state === 'count') setPause(true); } });
window.addEventListener('resize', layout);

/* ================== 자동화용 읽기 전용 상태 ================== */
const cardInfo = c => (c ? { animal: c.a, emoji: ANI[c.a].e, shown: shownN(c), real: realN(c), kind: c.kind } : null);
const snapshot = () => {
  const { r, s } = counts(tops());
  return {
    state, paused, mode, players: nPlayers, lang, timeLeftMs: Math.round(timeLeft()), gameMs: Math.round(gt),
    fever, feverLeftMs: fever ? Math.round(feverEnd - gt) : 0, firstEver, hint: hintOn,
    piles: piles.map((p, i) => ({ owner: mode === 'solo' ? (i === 0 ? 'you' : RIVALS[i - 1].k) : 'P' + (i + 1), size: p.length, top: cardInfo(p[p.length - 1]) })),
    counts: r, shownCounts: s, bellValid: state === 'play' && valid, validForMs: valid ? Math.round(gt - validSince) : 0,
    trap: trap ? trap.kind : null, rivalEtaMs: plans.some(p => p !== null) ? Math.round(Math.min(...plans.filter(p => p !== null)) - gt) : null,
    rivalBaseMs: Math.round(rivalBase), scores: scores.slice(0, mode === 'solo' ? 4 : nPlayers),
    you: { score: scores[0], streak, lastReactionMs: lastRx, bestReactionMs: bestRxRound, hits, misses, stunned: stun[0] > gt },
    best: { score: store.d.bestScore, reactionMs: store.d.bestRx }, plays: store.d.plays, lastEvent: lastResult, eventCount: events.length,
    audio: { state: snd.ac ? snd.ac.state : 'none', music: snd.musicOn, muted: snd.muted },
  };
};
window.__tootbell = Object.freeze({ snapshot, events: (from = 0) => events.slice(from).map(e => Object.assign({}, e)), get state() { return state; } });

applyLang(); updateMuteBtn(); renderBest(); show('titleScr'); requestAnimationFrame(loop);
})();
</script>
