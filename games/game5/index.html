<script>
(() => {

/* ================== 기본 설정 ================== */
const W = 360;                    // 논리 가로 해상도 (세로는 화면 비율에 맞춰 VH)
const COLS = 10, ROWS = 18, CELL = 28;
const BX = (W - COLS * CELL) / 2; // 보드 왼쪽
const ROUND_TIME = 150;           // 한 판 2분 30초
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const stage = document.getElementById('stage');
let scale = 1, dpr = 1, VH = 640, BY = 112;

function resize() {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cvs.width = Math.max(1, Math.round(r.width * dpr));
  cvs.height = Math.max(1, Math.round(r.height * dpr));
  scale = cvs.width / W;
  VH = Math.max(600, cvs.height / scale);
  BY = Math.round(VH - 22 - ROWS * CELL);
  for (const k in tileCache) delete tileCache[k];
}
window.addEventListener('resize', resize);

/* ================== 저장 (localStorage) ================== */
const SKEY = 'fartBlock_v1';
const store = (() => {
  let d = { best: 0, total: 0, pack: 0, plays: 0, lines: 0, mDate: '' };

})();

/* ================== 언어 (KO/EN) ================== */

const T = {

  sub: ['동물 블록으로 한 줄을 꽉 채우면<br>다 같이 <b>뿡!</b> 하고 사라져요 🤭', 'Fill a whole line with animal blocks<br>and they all go <b>PFFT!</b> 🤭'],
  dDrag: ['끌기 = 이동', 'Drag = move'], dTap: ['톡 = 회전', 'Tap = spin'], dSwipe: ['휙 = 뚝!', 'Swipe = drop!'],

  hIntroT: ['소개', 'About'], hCtrlT: ['조작법', 'Controls'], hFunT: ['웃긴 포인트', 'Funny bits'], gotIt: ['알겠어!', 'Got it!'],
  hIntro: ['돼지, 닭, 유니콘… 동물 친구들이 블록이 되어 떨어져요! 가로 한 줄을 꽉 채우면 다 같이 <b>"뿡!"</b> 하고 사라져요. <b>2분 30초</b> 동안 최고 점수에 도전! 시간이 갈수록 점점 빨라져요 🚀',

          '📱 <b>Drag left/right</b> and the block follows, one column at a time<br>👆 <b>Tap</b> to spin (works against walls too)<br>👇 <b>Swipe down fast</b> to slam it down<br>⌨️ PC: ←→ move · ↑/X spin · Z spin back · ↓ soft drop · Space slam · P pause · M sound'],

         'Clear more lines at once for a <b>LOUDER</b> toot and a screen shake! Clear 5 times in a row for a <b>MEGA TOOT!!</b> that blasts away the top 3 rows 💥 Beat the <b>daily silly mission</b> and collect points to unlock new animal packs!'],
  pauseT: ['잠깐 쉬는 중...', 'Taking a break...'], pauseS: ['블록들도 방귀 참는 중!', 'The blocks are holding in a toot!'],
  resume: ['계속하기', 'Resume'], quit: ['처음으로', 'Menu'], newrec: ['신기록!', 'NEW BEST!'], retry: ['한 판 더 뿡!', 'Toot again!'],
  share: ['자랑하기', 'Brag'], skinsB: ['동물 팩', 'Animal packs'],
  best: ['🏆 최고 {b}점 · 모은 점수 {t}', '🏆 Best {b} · Total points {t}'],

  lineFx: [['뿡!', '뿡뿡!!', '뿌부붕!!!', '뿌와아앙!!!!'], ['PFFT!', 'DOUBLE TOOT!!', 'TRIPLE TOOT!!!', 'MEGA-BLAST!!!!']],
  toot: [['뿡!', '뽕!', '뿌웅~', '뿡뿡'], ['PFFT!', 'toot!', 'poot~', 'pfft']],
  mTitle: ['📅 오늘의 병맛 미션', '📅 Daily silly mission'], mDone: ['✅ 오늘 미션 성공! (+{r}점)', '✅ Mission done today! (+{r} pts)'],
  mClear: ['🎉 미션 성공! +{r}점', '🎉 Mission complete! +{r}'],
  go: ['GO! 뿡!', 'GO! TOOT!'],
  shareText: ['🧱💨 뿡뿡 블록 탑에서 {b}점! 너도 뿡 해봐!', '🧱💨 I scored {b} in Fart Block Tower! Your turn to toot!'],

};
const t = (k, v = {}) => { const e = T[k][lang === 'ko' ? 0 : 1]; return typeof e === 'string' ? e.replace(/\{(\w)\}/g, (_, x) => v[x]) : e; };
const pick = a => a[lang === 'ko' ? 0 : 1];

/* ================== 동물 팩 (블록 스킨) ================== */
// 조각 순서: I O T S Z J L
const PACKS = [
  { n: ['뿡뿡 친구들', 'Toot Crew'], need: 0, e: ['🐷', '🐸', '🦄', '🐔', '🐙', '👽', '💩'], c: ['#ffb3c7', '#b5f2a6', '#e2c6ff', '#fff0a0', '#ffbfa8', '#b8f3e6', '#e6cbb0'] },
  { n: ['농장 뿡뿡', 'Farm Toots'], need: 1500, e: ['🐮', '🐶', '🐱', '🐰', '🐑', '🐴', '🐤'], c: ['#f2f2f2', '#ffd9a8', '#ffe3b3', '#ffd6e8', '#e8e8ff', '#e8cfb5', '#fff3a0'] },
  { n: ['바다 뿡뿡', 'Sea Toots'], need: 5000, e: ['🐳', '🐠', '🦀', '🐡', '🦑', '🐬', '🐢'], c: ['#a8dcff', '#ffe08a', '#ffb3a8', '#fff0b3', '#ffc6e0', '#b3e6ff', '#bff0b3'] },
  { n: ['정글 뿡뿡', 'Jungle Toots'], need: 12000, e: ['🐵', '🦁', '🐯', '🐼', '🐨', '🦒', '🐘'], c: ['#f0d2b0', '#ffe08a', '#ffc98a', '#f0f0f0', '#dcdce6', '#fff0a8', '#d6e0f0'] },

  { n: ['황금똥', 'Golden Poop'], need: 50000, e: ['💩', '💩', '💩', '💩', '💩', '💩', '💩'], c: ['#ffe066', '#ffd23f', '#ffe999', '#ffcf40', '#ffe066', '#ffd966', '#ffeb80'] },
];

/* ================== 테트로미노 (SRS) ================== */
const SHAPES = [
  [[0, 1], [1, 1], [2, 1], [3, 1]],          // I (4x4)
  [[1, 0], [2, 0], [1, 1], [2, 1]],          // O
  [[1, 0], [0, 1], [1, 1], [2, 1]],          // T
  [[1, 0], [2, 0], [0, 1], [1, 1]],          // S
  [[0, 0], [1, 0], [1, 1], [2, 1]],          // Z

const KICK = {
  '01': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]], '10': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],

  '23': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]], '32': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  '30': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]], '03': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],

const KICK_I = {
  '01': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]], '10': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
  '12': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]], '21': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],

function fits(type, rot, x, y) {

let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (state !== 'pause') { acc += dt; let n = 0; while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; } }
  render();
  requestAnimationFrame(loop);
}

/* ================== 터치 / 마우스 입력 ================== */
// 좌우로 끌면 칸 단위로 따라옴 · 톡 = 회전 · 아래로 휙 = 하드 드롭
let g = null;
function toLogical(e) { const r = cvs.getBoundingClientRect(); const k = W / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k }; }
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state !== 'play') return;
  snd.init();
  if (g) return; // 멀티터치 무시 (첫 손가락만)
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  const p = toLogical(e), now = performance.now();
  g = { pid: e.pointerId, sx: p.x, sy: p.y, t0: now, col: piece ? piece.x : 0, pidn: piece ? piece.id : 0, moved: false, done: false, maxD: 0, hist: [{ t: now, y: p.y }] };
}, { passive: false });
cvs.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.pid) return;
  e.preventDefault();
  const p = toLogical(e), now = performance.now();
  g.hist.push({ t: now, y: p.y }); while (g.hist.length > 2 && now - g.hist[0].t > 90) g.hist.shift();
  const dx = p.x - g.sx, dy = p.y - g.sy;
  g.maxD = Math.max(g.maxD, Math.hypot(dx, dy));
  if (g.done || state !== 'play') return;
  const h0 = g.hist[0], vy = (p.y - h0.y) / Math.max(1, now - h0.t);
  if (dy > 36 && vy > 0.5 && dy > Math.abs(dx) * 1.2) { g.done = true; hardDrop(); return; } // 휙!
  if (!piece || phase !== 'fall') return;
  if (piece.id !== g.pidn) { g.pidn = piece.id; g.col = piece.x; g.sx = p.x; return; } // 새 조각: 기준점 리셋
  if (Math.abs(dx) > 8) g.moved = true;
  if (Math.abs(dy) > Math.abs(dx) * 1.6 && Math.abs(dx) < CELL * 0.6) return; // 세로 위주면 좌우 이동 안 함
  const target = Math.max(-3, Math.min(COLS, g.col + Math.round(dx / CELL)));
  let guard = 12;
  while (piece.x !== target && guard--) { if (!tryMove(Math.sign(target - piece.x))) break; g.moved = true; }
}, { passive: false });

  if (!g || e.pointerId !== g.pid) return;
  e.preventDefault();
  const p = toLogical(e), now = performance.now();
  const dx = p.x - g.sx, dy = p.y - g.sy, dur = now - g.t0;

    if (dy > 30 && vy > 0.4 && dy > Math.abs(dx) * 1.2) hardDrop();

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// 키보드
window.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (state === 'play') {
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') tryMove(-1);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') tryMove(1);
    else if (k === 'ArrowUp' || k === 'x' || k === 'X' || k === 'w' || k === 'W') { if (!e.repeat) tryRotate(1); }
    else if (k === 'z' || k === 'Z') { if (!e.repeat) tryRotate(-1); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') softDrop = true;
    else if (k === ' ' || k === 'Enter') { if (!e.repeat) hardDrop(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') pause();
    else if (k === 'm' || k === 'M') { snd.init(); snd.setMute(!snd.muted); updateMuteBtn(); }
    return;
  }
  if (k === ' ' || k === 'Enter') {
    if (e.repeat) return;
    if (state === 'title' && document.getElementById('titleScr').classList.contains('show')) startGame();
    else if (state === 'over' && overT > 1.2) startGame();
    else if (state === 'pause') resume();
  } else if ((k === 'p' || k === 'P' || k === 'Escape') && state === 'pause') resume();
  else if (k === 'm' || k === 'M') { snd.init(); snd.setMute(!snd.muted); updateMuteBtn(); }
});
window.addEventListener('keyup', e => { if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') softDrop = false; });

  get mission() { return { id: mission.id, n: mission.n, k: mission.k, text: missionText(), done: missionDone(), progress: missionProgress() }; },
  layout() { const r = cvs.getBoundingClientRect(); const k = r.width / W; return { left: r.left + BX * k, top: r.top + BY * k, cell: CELL * k, width: COLS * CELL * k, height: ROWS * CELL * k }; },
};
window.__fartblock = api; window.__bbung = api;

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.title = lang === 'ko' ? '뿡뿡 블록 탑 🐷🧱 | 나두게임즈' : 'Fart Block Tower 🐷🧱 | Nadoo Games';
  document.getElementById('langBtn').textContent = lang === 'ko' ? '🌏 EN' : '🌏 한';
  renderSkins();
}
document.getElementById('langBtn').addEventListener('click', e => { e.stopPropagation(); lang = lang === 'ko' ? 'en' : 'ko'; localStorage.setItem(LANG_KEY, lang); applyLang(); snd.init(); snd.boing(); });
reset(); resize(); applyLang(); updateMuteBtn(); show('titleScr');
requestAnimationFrame(loop);
})();
</script>
