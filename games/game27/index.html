const DRAWS=[drawLion,drawHydra,drawHind,drawBoar,drawStables,drawBirds,drawBull,drawMares,drawBelt,drawGeryon,drawAtlas,drawDog];
function bg(){
  const p=PAL[Math.max(0,Math.min(11,labor))];
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,p[0]);g.addColorStop(.55,p[1]);g.addColorStop(1,p[2]);
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=p[3];x.fillRect(0,H*.74,W,H);
  x.globalAlpha=.15;x.fillStyle='#fff';
  for(let i=0;i<6;i++){x.beginPath();x.arc((i*97+now*12)%W,H*.2+(i*37)%(H*.4),18+i*4,0,7);x.fill()}
  x.globalAlpha=1;
}
function bar(px,py,w,h,t,col){x.fillStyle='#0006';x.fillRect(px,py,w,h);x.fillStyle=col;x.fillRect(px,py,w*Math.max(0,Math.min(1,t)),h);x.strokeStyle='#fff6';x.strokeRect(px,py,w,h)}
function hud(){
  const top=58,lb=LABOR[labor];
  x.textAlign='left';x.textBaseline='middle';x.font='bold 18px sans-serif';x.lineWidth=4;x.strokeStyle='#0008';
  const name=(labor+1)+'. '+(lang=='ko'?lb.ko:lb.en);
  x.strokeText(name,12,top);x.fillStyle='#fff';x.fillText(name,12,top);
  x.font='13px sans-serif';x.fillStyle='#fff';x.fillText(L().labor+' '+score+L().of+' · '+L().best+' '+best,12,top+22);
  const pw=Math.min(18,(W-24)/12);
  for(let i=0;i<12;i++){x.beginPath();x.arc(14+i*(pw+4),top+40,pw*.38,0,7);x.fillStyle=i<score?Y:i===labor?'#fff':'#0006';x.fill()}
  const my=top+52,mw=W-24;
  if(labor==4){bar(12,my,mw*.48,8,1-muck/100,'#c9a06a');bar(12+mw*.52,my,mw*.48,8,flood/100,flood>68?R:'#7fd0ff')}
  else if(labor==10){bar(12,my,mw,8,skyM/100,Y)}
  else if(labor==11){bar(12,my,mw,8,hgt/100,'#c9a0ff')}
  else if(labor==9&&phase=='herd'){bar(12,my,mw,8,drive/100,G)}
  else if(labor==2){bar(12,my,mw*.7,8,n/4,G);x.font='14px sans-serif';x.fillStyle='#fff';x.fillText('❤'.repeat(Math.max(0,lives)),12+mw*.74,my+4)}
  else{const t=labor==0||labor==6?prog/100:labor==1?n/Math.max(1,need):labor==3?pins/2:labor==5?n/5:labor==7?n/4:labor==8?n/3:labor==9?bodies/3:0;bar(12,my,mw,8,t,G)}
}
function drawBtn(){
  const by=H*.84,bx=W*.72,r=Math.min(42,W*.1);
  x.save();x.translate(bx,by+(held?5:0));
  x.fillStyle='#0004';x.beginPath();x.ellipse(0,r*.55,r*.7,8,0,0,7);x.fill();
  x.fillStyle=held?'#ffe9a0':cue.c||Y;x.strokeStyle='#2d1b00';x.lineWidth=4;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.stroke();
  const ring=phase=='warn'||phase=='red'||phase=='club'||phase=='burn'||phase=='rattle'||phase=='shoot'||phase=='buck'||phase=='bite'||phase=='strike'||phase=='light'||phase=='trade'||phase=='pin'||phase=='wind'||phase=='yank';
  if(ring&&wmax>0&&pt>0&&st=='play'&&grace<=0){x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.arc(0,0,r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,pt/wmax));x.stroke()}
  x.fillStyle='#2d1b00';x.font='bold 18px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(held?'뿡':'●',0,1);
  x.restore();
}
function txt(s,px,py,sz,col){x.font='bold '+sz+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=Math.max(3,sz/7);x.strokeStyle='#000a';x.strokeText(s,px,py);x.fillStyle=col;x.fillText(s,px,py)}
function wrap(t,cx,cy,mw,lh){
  lh=lh||18;x.textAlign='center';x.textBaseline='middle';
  const words=String(t).split(/\s+/);const lines=[];let cur='';
  const dump=w=>{let chunk='';for(const ch of w){if(x.measureText(chunk+ch).width>mw&&chunk){lines.push(chunk);chunk=''}chunk+=ch}if(chunk)lines.push(chunk)};
  for(const w of words){if(!w)continue;if(x.measureText(w).width>mw){if(cur){lines.push(cur);cur=''}dump(w);continue}const trial=cur?cur+' '+w:w;if(x.measureText(trial).width>mw&&cur){lines.push(cur);cur=w}else cur=trial}
  if(cur)lines.push(cur);lines.forEach((ln,i)=>x.fillText(ln,cx,cy+i*lh));return cy+lines.length*lh;
}
function panel(y,h){x.fillStyle='#140c08d8';x.fillRect(0,y,W,h)}
function cardLine(){const names=cards.map(i=>Myth.card(i,lang)).filter(Boolean).map(c=>c.name);const shown=names.slice(0,3).join(', ');const more=names.length>3?(lang=='ko'?' 외 '+(names.length-3):' +'+(names.length-3)):'';return '🃏 '+L().card+' '+shown+more}
function draw(){
  x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  bg();
  if(st!='title')DRAWS[labor]();
  else drawLion();
  const danger=phase=='red'||phase=='buck'||(labor==11&&phase=='bite')||(labor==8&&phase=='strike');
  if(st=='play'&&danger){x.strokeStyle='rgba(255,70,70,.85)';x.lineWidth=10;x.strokeRect(5,5,W-10,H-10)}
  drawHero(hx,hy,.9);
  for(const p of parts){x.globalAlpha=Math.max(0,p.l*2);x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5)}x.globalAlpha=1;
  for(const p of pops){x.globalAlpha=Math.min(1,p.l);txt(p.t,p.x,p.y,16,p.c)}x.globalAlpha=1;
  if(st=='play'||st=='fanfare'){
    hud();
    const pulse=1+Math.sin(now*8)*.04;
    x.save();x.translate(W/2,H*.56);x.scale(pulse,pulse);txt(cue.b||'',0,0,Math.min(32,W*.07),cue.c||'#fff');x.restore();
    x.font='14px sans-serif';x.fillStyle='#fff';x.textAlign='center';
    wrap(lang=='ko'?LABOR[labor].hk:LABOR[labor].he,W/2,H*.63,W*.86,16);
    drawBtn();
  }
  if(st=='fanfare'){panel(H*.4,78);txt('✨ '+(lang=='ko'?LABOR[labor].ko:LABOR[labor].en),W/2,H*.4+26,20,Y);txt((fanCard?('🃏 '+fanCard+' · '):'')+score+'/12',W/2,H*.4+54,15,'#fff')}
  if(st=='title'){
    panel(H*.1,H*.42);txt(L().sub,W/2,H*.16,15,Y);txt(L().t,W/2,H*.16+36,Math.min(30,W*.075),'#fff');
    x.font='15px sans-serif';x.fillStyle='#fff';let yy=wrap(L().h,W/2,H*.16+72,W*.88,18);x.font='13px sans-serif';x.fillStyle='#ffe9c0';yy=wrap(L().w,W/2,yy+8,W*.86,16);
    x.textAlign='center';x.font='22px serif';x.fillStyle='#fff';
    const row=LABOR.map(l=>l.em).join(' ');x.fillText(row,W/2,yy+28);
    txt(L().go,W/2,H*.66,Math.min(22,W*.055),Math.sin(now*5)>0?G:'#fff');
    x.font='14px sans-serif';x.fillStyle='#fff';x.textAlign='center';x.fillText(L().best+' '+best+' · 🏛️ '+Myth.get().length+'/'+Object.keys(Myth.C).length,W/2,H*.66+28);
  }
  if(st=='win'){
    panel(H*.14,H*.46);txt('🏆 '+L().win,W/2,H*.14+34,26,Y);txt(L().win2,W/2,H*.14+68,16,'#fff');
    txt(String(score),W/2,H*.14+108,40,'#fff');x.font='15px sans-serif';x.fillStyle='#fff';x.textAlign='center';x.fillText(L().best+' '+best,W/2,H*.14+142);
    if(nb)txt(L().nb,W/2,H*.14+166,16,Y);
    if(cards.length){x.font='14px sans-serif';x.fillStyle='#9ff';wrap(cardLine(),W/2,H*.14+192,W*.9,16)}
    txt(L().retry,W/2,H*.14+248,18,Math.sin(now*6)>0?G:'#fff');
  }
  if(st=='over'||st=='quiz'||st=='over2'){
    panel(H*.14,H*.5);txt('💨 '+L().over,W/2,H*.14+32,24,R);
    x.font='15px sans-serif';x.fillStyle='#ffe9c0';x.textAlign='center';wrap(lang=='ko'?whyK:whyE,W/2,H*.14+62,W*.88,16);
    txt(String(score),W/2,H*.14+108,40,'#fff');x.font='14px sans-serif';x.fillStyle='#fff';x.textAlign='center';x.fillText(L().labor+' '+score+L().of+' · '+L().best+' '+best,W/2,H*.14+140);
    if(nb)txt(L().nb,W/2,H*.14+162,15,Y);
    if(cards.length){x.font='13px sans-serif';x.fillStyle='#9ff';wrap(cardLine(),W/2,H*.14+186,W*.9,15)}
    if(st=='over2'){x.font='15px sans-serif';x.fillStyle=bonus>0?G:'#fbb';x.textAlign='center';x.fillText(bonus>0?'✅ '+L().bonus:'❌ '+L().miss,W/2,H*.14+230);txt(L().retry,W/2,H*.14+262,18,Math.sin(now*6)>0?G:'#fff')}
  }
  x.restore();
  if(flash>0){x.fillStyle=`rgba(255,255,255,${Math.min(.6,flash)})`;x.fillRect(0,0,W,H)}
}
function loop(t){if(!paused){const dt=Math.min(.033,(t-lt)/1000);lt=t;upd(dt);draw()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__g27={
  pause(v){paused=!!v;lt=performance.now()},
  tick(dt){upd(dt)},
  hold(v){held=!!v},
  tap(){pressed=true;held=true},
  up(){held=false},
  get st(){return st},get labor(){return labor},get score(){return score},get phase(){return phase},
  get prog(){return prog},get sky(){return sky},get skyM(){return skyM},get muck(){return muck},get flood(){return flood},
  get cattle(){return cattle},get drive(){return drive},get hgt(){return hgt},get mark(){return mark},get lives(){return lives},
  get n(){return n},get need(){return need},get grace(){return grace},get time(){return time},get pins(){return pins},
  get why(){return whyK},get bodies(){return bodies},get aux(){return aux},get pt(){return pt},get cool(){return cool},
  get cards(){return cards.slice()},get best(){return best},
  boot(){st='title';return start()},
  render(){draw()}
};
})();
</script>
