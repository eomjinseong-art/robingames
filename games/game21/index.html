<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>뿡뿡 탈것 길들이기 / Toot Sky Tamer | 나두게임즈</title>
<meta name="description" content="뿡뿡 탈것 길들이기 / Toot Sky Tamer — tap to jump onto wild flying creatures and collect them all. By 나두Ai.">
<meta name="theme-color" content="#0a1430">
<script src="/counter.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a1430;overflow:hidden;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#fff;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.bar a,.bar button{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:2px solid #ffd76f88;background:#1b1d4acc;color:#fff;font-size:18px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin-left:6px}
.brand{position:fixed;bottom:max(6px,env(safe-area-inset-bottom));width:100%;text-align:center;font-size:11px;opacity:.5;z-index:3;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><a href="/" aria-label="home">🏠</a><span><button id="lang">EN</button><button id="mute">🔊</button></span></div>
<div class="brand">나두Ai · 나두게임즈</div>
<script>
(()=>{
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H;function rs(){const D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
let lang=localStorage.g21lang||'ko';
const T={ko:{t:'뿡뿡 탈것 길들이기',s:'탭해서 점프! 날아가는 동물에 올라타요',over:'풍덩!',sc:'점수',best:'최고',retry:'탭해서 한 판 더!',nb:'🎉 새 기록!',dex:'도감',new:'NEW 길들임!',perfect:'퍼펙트!'},
en:{t:'Toot Sky Tamer',s:'Tap to jump onto flying creatures!',over:'Splash!',sc:'Score',best:'Best',retry:'Tap for one more!',nb:'🎉 New best!',dex:'Dex',new:'NEW tamed!',perfect:'Perfect!'}};
const L=()=>T[lang];const lb=document.getElementById('lang');lb.textContent=lang=='ko'?'EN':'KO';
lb.onclick=e=>{e.stopPropagation();lang=lang=='ko'?'en':'ko';localStorage.g21lang=lang;lb.textContent=lang=='ko'?'EN':'KO'};
// creatures: emoji-free drawn blobs with colors
const SP=[{k:'솜털 새',e:'Fluff Bird',c:'#7fe3ff',w:1},{k:'반짝 가오리',e:'Glow Ray',c:'#b48cff',w:1},{k:'풍선 고래',e:'Balloon Whale',c:'#6fa8ff',w:.8},{k:'불꽃 도마뱀',e:'Ember Lizard',c:'#ff8a5c',w:.7},{k:'이끼 거북',e:'Moss Turtle',c:'#7bdc7b',w:.6},{k:'구름 여우',e:'Cloud Fox',c:'#f4f4ff',w:.45},{k:'번개 나방',e:'Bolt Moth',c:'#ffe45c',w:.3},{k:'황금 용',e:'Golden Dragon',c:'#ffc400',w:.12}];
let dex=JSON.parse(localStorage.g21dex||'[]');
function pick(){let s=SP.reduce((a,b)=>a+b.w,0),r=Math.random()*s;for(let i=0;i<SP.length;i++){r-=SP[i].w;if(r<=0)return i}return 0}
// audio
let ac,mg,muted=localStorage.g21mute=='1',step=0,nt=0;const mb=document.getElementById('mute');mb.textContent=muted?'🔇':'🔊';
mb.onclick=e=>{e.stopPropagation();muted=!muted;localStorage.g21mute=muted?'1':'0';mb.textContent=muted?'🔇':'🔊';if(mg)mg.gain.value=muted?0:.5};
function tone(f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
const MEL=[72,76,79,76,74,77,81,77,72,76,79,84,83,79,76,74],BAS=[48,48,53,53,45,45,55,55];const mf=n=>440*Math.pow(2,(n-69)/12);
function sched(){if(!ac)return;while(nt<ac.currentTime+.15){const b=.15;if(step%2==0)tone(mf(BAS[(step>>2)%8]),nt,.25,'triangle',.3);tone(mf(MEL[step%16]),nt,.12,'square',.07);if(step%4==0){tone(60,nt,.12,'sine',.5)}if(step%4==2)tone(2000,nt,.03,'square',.03);nt+=b;step++}}
setInterval(sched,40);
function sfx(f,d,ty){if(ac)tone(f,ac.currentTime,d,ty||'sine',.25)}
function au(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=muted?0:.5;mg.connect(ac.destination);nt=ac.currentTime}ac.resume&&ac.resume()}
// game
let st='title',score=0,best=+localStorage.g21best||0,cam=0,me,tg,parts=[],msg=null,nb=false,t0=0;
const GAP=()=>Math.min(170,H*.22);
function mk(y,i){const sp=i==null?pick():i;const dir=Math.random()<.5?1:-1;const v=(1.6+Math.min(score,40)*.09)*(0.8+Math.random()*.5)*dir;const w=Math.max(52,95-score*1.2)*(SP[sp].k=='풍선 고래'?1.3:1);return{sp,y,x:dir>0?-w:W+w,v,w,ph:Math.random()*6}}
function reset(){score=0;cam=0;nb=false;me={sp:0,x:W/2,y:H*.75,jy:0,jt:-1,ride:null};me.ride={sp:0,y:H*.75,x:W/2,v:0,w:100,ph:0};tg=mk(me.y-GAP())}
reset();
function tap(){au();if(st=='title'||st=='over'){if(st=='over'&&performance.now()-t0<500)return;st='play';reset();return}
if(me.jt<0){me.jt=0;sfx(520,.12,'square')}}
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.bar'))return;tap()});
addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='Enter'){e.preventDefault();tap()}});
const JD=32;
function upd(){if(st!='play')return;const r=me.ride;r.ph+=.08;
tg.x+=tg.v;tg.ph+=.1;if(tg.v>0&&tg.x>W+tg.w)tg.x=-tg.w;if(tg.v<0&&tg.x<-tg.w)tg.x=W+tg.w;
if(me.jt>=0){me.jt++;const p=me.jt/JD;me.jy=-GAP()*Math.sin(Math.min(p,1)*Math.PI/2)*(p<=1?1:1)-(p>1?-(p-1)*GAP()*3:0);
if(me.jt==JD){const d=Math.abs(tg.x-me.x);if(d<tg.w*.55){score+=d<tg.w*.15?2:1;const isNew=!dex.includes(tg.sp);if(isNew){dex.push(tg.sp);localStorage.g21dex=JSON.stringify(dex)}
msg={s:isNew?L().new+' '+(lang=='ko'?SP[tg.sp].k:SP[tg.sp].e):(d<tg.w*.15?L().perfect:'+1'),t:60,c:SP[tg.sp].c};sfx(isNew?1046:784,.25,'triangle');
for(let i=0;i<14;i++)parts.push({x:me.x,y:tg.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:30,c:SP[tg.sp].c});
me.ride=tg;me.sp=tg.sp;me.y=tg.y;me.jy=0;me.jt=-1;tg.v*=.0;me.ride.v=0;tg=mk(me.y-GAP())}}
if(me.jt>JD&&me.y+me.jy>cam+H+60){st='over';t0=performance.now();sfx(150,.5,'sawtooth');if(score>best){best=score;localStorage.g21best=best;nb=true}}}
// ride creature drifts back to center
r.x+=(W/2-r.x)*.1;if(me.jt<0)me.x=r.x;
const want=me.y-H*.72;cam+=(want-cam)*.08;
parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l--});parts=parts.filter(p=>p.l>0);if(msg&&--msg.t<=0)msg=null}
function crit(c,cx,cy,w,ph){const fl=Math.sin(ph)*w*.35;x.fillStyle=c;x.globalAlpha=.75;
x.beginPath();x.ellipse(cx-w*.35,cy-fl*.3,w*.4,w*.16,-.5+Math.sin(ph)*.6,0,7);x.fill();x.beginPath();x.ellipse(cx+w*.35,cy-fl*.3,w*.4,w*.16,.5-Math.sin(ph)*.6,0,7);x.fill();
x.globalAlpha=1;x.shadowColor=c;x.shadowBlur=18;x.beginPath();x.ellipse(cx,cy,w*.42,w*.24,0,0,7);x.fill();x.shadowBlur=0;
x.fillStyle='#fff';x.beginPath();x.arc(cx+w*.2,cy-w*.06,w*.08,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(cx+w*.22,cy-w*.06,w*.04,0,7);x.fill()}
function hero(cx,cy){x.fillStyle='#ffb86b';x.beginPath();x.arc(cx,cy-22,12,0,7);x.fill();x.fillStyle='#4a6cff';x.fillRect(cx-9,cy-12,18,14);x.fillStyle='#000';x.fillRect(cx-5,cy-25,3,3);x.fillRect(cx+3,cy-25,3,3)}
function draw(){const g=x.createLinearGradient(0,0,0,H);const hue=(220+cam*-.02)%360;g.addColorStop(0,`hsl(${hue},55%,12%)`);g.addColorStop(1,`hsl(${hue+40},60%,28%)`);x.fillStyle=g;x.fillRect(0,0,W,H);
for(let i=0;i<40;i++){const sy=((i*97-cam*.3)%H+H)%H;x.fillStyle='#ffffff'+(i%3?'44':'99');x.fillRect((i*137)%W,sy,2,2)}
// floating islands deco
x.save();x.translate(0,-cam);
crit(SP[tg.sp].c,tg.x,tg.y,tg.w,tg.ph);
if(st!='title'||true){const r=me.ride;crit(SP[r.sp].c,r.x,r.y,r.w,r.ph);hero(me.x,me.y+me.jy-r.w*.12)}
parts.forEach(p=>{x.fillStyle=p.c;x.globalAlpha=p.l/30;x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;x.restore();
x.textAlign='center';x.fillStyle='#fff';
if(st=='play'){x.font='bold 44px sans-serif';x.fillText(score,W/2,H*.13);x.font='14px sans-serif';x.fillText(L().dex+' '+dex.length+'/'+SP.length,W/2,H*.13+22);
if(msg){x.font='bold 22px sans-serif';x.fillStyle=msg.c;x.fillText(msg.s,W/2,H*.3)}}
else{x.fillStyle='#0008';x.fillRect(0,H*.2,W,H*.42);x.fillStyle='#ffd76f';x.font='bold 30px sans-serif';
if(st=='title'){x.fillText(L().t,W/2,H*.3);x.fillStyle='#fff';x.font='17px sans-serif';x.fillText(L().s,W/2,H*.37);x.fillText(L().best+' '+best+' · '+L().dex+' '+dex.length+'/'+SP.length,W/2,H*.44);x.font='bold 22px sans-serif';x.fillText(lang=='ko'?'👆 탭해서 시작':'👆 Tap to start',W/2,H*.54)}
else{x.fillText(L().over,W/2,H*.29);x.fillStyle='#fff';x.font='bold 40px sans-serif';x.fillText(score,W/2,H*.37);x.font='17px sans-serif';x.fillText(nb?L().nb:L().best+' '+best,W/2,H*.43);
x.fillText(L().dex+' '+dex.length+'/'+SP.length+(dex.length<SP.length?(lang=='ko'?' · 황금 용을 찾아라!':' · Find the Golden Dragon!'):''),W/2,H*.48);x.font='bold 22px sans-serif';x.fillStyle='#ffd76f';x.fillText(L().retry,W/2,H*.56)}}}
function loop(){upd();draw();requestAnimationFrame(loop)}loop();
window.__g21={get st(){return st},get score(){return score}};
})();
</script>
</body>
</html>
