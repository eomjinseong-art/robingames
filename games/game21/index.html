<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>뿡뿡 탈것 길들이기 / Toot Sky Tamer | 나두게임즈</title>
<meta name="description" content="뿡뿡 탈것 길들이기 / Toot Sky Tamer — tap to jump onto wild flying creatures and collect them all. By 나두Ai.">
<meta name="theme-color" content="#0a1430">
<script src="/counter.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a1430;overflow:hidden;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#fff;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.bar a,.bar button{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:2px solid #ffd76f88;background:#1b1d4acc;color:#fff;font-size:18px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin-left:6px}
.brand{position:fixed;bottom:max(6px,env(safe-area-inset-bottom));width:100%;text-align:center;font-size:11px;opacity:.5;z-index:3;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><a href="/" aria-label="home">🏠</a><span><button id="lang">EN</button><button id="mute">🔊</button></span></div>
<div class="brand">나두Ai · 나두게임즈</div>
<script>
(()=>{
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H;function rs(){const D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
let lang=localStorage.g21lang||'ko';
const T={ko:{t:'뿡뿡 탈것 길들이기',s:'탭! 연속 점프로 콤보를 이어가요',over:'풍덩!',sc:'점수',best:'최고',retry:'탭해서 한 판 더!',nb:'🎉 새 기록!',dex:'도감',new:'NEW 길들임!',perfect:'퍼펙트!'},
en:{t:'Toot Sky Tamer',s:'Tap! Chain jumps for combos!',over:'Splash!',sc:'Score',best:'Best',retry:'Tap for one more!',nb:'🎉 New best!',dex:'Dex',new:'NEW tamed!',perfect:'Perfect!'}};
const L=()=>T[lang];const lb=document.getElementById('lang');lb.textContent=lang=='ko'?'EN':'KO';
lb.onclick=e=>{e.stopPropagation();lang=lang=='ko'?'en':'ko';localStorage.g21lang=lang;lb.textContent=lang=='ko'?'EN':'KO'};
// creatures: emoji-free drawn blobs with colors
const SP=[{k:'솜털 새',e:'Fluff Bird',c:'#7fe3ff',w:1},{k:'반짝 가오리',e:'Glow Ray',c:'#b48cff',w:1},{k:'풍선 고래',e:'Balloon Whale',c:'#6fa8ff',w:.8},{k:'불꽃 도마뱀',e:'Ember Lizard',c:'#ff8a5c',w:.7},{k:'이끼 거북',e:'Moss Turtle',c:'#7bdc7b',w:.6},{k:'구름 여우',e:'Cloud Fox',c:'#f4f4ff',w:.45},{k:'번개 나방',e:'Bolt Moth',c:'#ffe45c',w:.3},{k:'황금 용',e:'Golden Dragon',c:'#ffc400',w:.12}];
let dex=JSON.parse(localStorage.g21dex||'[]');
function pick(){let s=SP.reduce((a,b)=>a+b.w,0),r=Math.random()*s;for(let i=0;i<SP.length;i++){r-=SP[i].w;if(r<=0)return i}return 0}
// audio
let ac,mg,muted=localStorage.g21mute=='1',step=0,nt=0;const mb=document.getElementById('mute');mb.textContent=muted?'🔇':'🔊';
mb.onclick=e=>{e.stopPropagation();muted=!muted;localStorage.g21mute=muted?'1':'0';mb.textContent=muted?'🔇':'🔊';if(mg)mg.gain.value=muted?0:.5};
function tone(f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
const MEL=[72,76,79,76,74,77,81,77,72,76,79,84,83,79,76,74],BAS=[48,48,53,53,45,45,55,55];const mf=n=>440*Math.pow(2,(n-69)/12);
function sched(){if(!ac)return;while(nt<ac.currentTime+.15){const b=st=='play'?.11:.15;if(step%2==0)tone(mf(BAS[(step>>2)%8]),nt,.25,'triangle',.3);tone(mf(MEL[step%16]),nt,.12,'square',.07);if(step%4==0){tone(60,nt,.12,'sine',.5)}if(step%4==2)tone(2000,nt,.03,'square',.03);nt+=b;step++}}
setInterval(sched,40);
function sfx(f,d,ty){if(ac)tone(f,ac.currentTime,d,ty||'sine',.25)}
function au(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=muted?0:.5;mg.connect(ac.destination);nt=ac.currentTime}ac.resume&&ac.resume()}
// game — speedy chain loop
let st='title',score=0,best=+localStorage.g21best||0,cam=0,me,tgs=[],parts=[],pops=[],nb=false,t0=0,combo=0,maxc=0,lastLand=0,tleft=30,shake=0,flash=0,now=0,lt=performance.now();
const GAP=()=>Math.min(150,H*.19),JD=.2,ROUND=30;
const spd=()=>1+Math.min(combo,30)*.05+Math.min(score,300)*.002;
function mk(y,side,off){const sp=pick(),dir=side||(Math.random()<.5?1:-1);const w=Math.max(56,92-score*.15)*(sp==2?1.25:1);
return{sp,y,x:dir>0?-w*.3-(off||0):W+w*.3+(off||0),v:(170+Math.random()*90)*dir,w,ph:Math.random()*6}}
function row(){tgs=[];const y=me.y-GAP();const d=Math.random()<.5?1:-1;tgs.push(mk(y,d,0));tgs.push(mk(y,-d,W*.35))}
function reset(){score=0;cam=0;nb=false;combo=0;maxc=0;tleft=ROUND;lastLand=now;parts=[];pops=[];me={x:W/2,y:H*.75,jy:0,jt:-1,fall:0,ride:{sp:0,y:H*.75,x:W/2,v:0,w:100,ph:0}};cam=me.y-H*.72;row()}
reset();
function over(){st='over';t0=now;shake=14;flash=.4;sfx(150,.4,'sawtooth');sfx(90,.5,'square');if(navigator.vibrate)navigator.vibrate(80);if(score>best){best=score;localStorage.g21best=best;nb=true}}
function tap(){au();if(st=='title'||st=='over'){if(st=='over'&&now-t0<250)return;st='play';reset();return}
if(me.jt<0&&!me.fall){me.jt=0;sfx(440+combo*30,.08,'square')}}
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.bar'))return;e.preventDefault();tap()},{passive:false});
addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='Enter'){e.preventDefault();tap()}});
function burst(px,py,c,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=60+Math.random()*260;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.3,c})}}
function upd(dt){now+=dt;shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt);
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);pops.forEach(p=>{p.t-=dt;p.y-=40*dt});pops=pops.filter(p=>p.t>0);
const r=me.ride;r.ph+=dt*6;r.x+=(W/2-r.x)*Math.min(1,dt*10);
for(const t of tgs){t.x+=t.v*spd()*dt;t.ph+=dt*8*spd();if(t.v>0&&t.x>W+t.w*.6)t.x=-t.w*.4;if(t.v<0&&t.x<-t.w*.6)t.x=W+t.w*.4}
if(st!='play')return;
tleft-=dt;if(tleft<=0){tleft=0;over();return}
if(combo&&now-lastLand>1.6){combo=0}
if(me.fall){me.fall+=dt;me.jy+=900*dt*me.fall*4;if(me.fall>.35)over();return}
if(me.jt>=0){me.jt+=dt*spd();const p=Math.min(me.jt/JD,1);me.jy=-GAP()*Math.sin(p*Math.PI/2);
if(p>=1){let hit=null,bd=1e9;for(const t of tgs){const d=Math.abs(t.x-me.x);if(d<t.w*.7&&d<bd){bd=d;hit=t}}
if(!hit){me.fall=.001;sfx(220,.2,'sawtooth');shake=6;return}
const perf=bd<hit.w*.18;combo=now-lastLand<1.6?combo+1:1;maxc=Math.max(maxc,combo);lastLand=now;
const mult=1+Math.floor(combo/4);const pts=(perf?2:1)*mult;score+=pts;tleft=Math.min(ROUND,tleft+(perf?1:.5));
const isNew=!dex.includes(hit.sp);if(isNew){dex.push(hit.sp);localStorage.g21dex=JSON.stringify(dex)}
pops.push({s:isNew?L().new+' '+(lang=='ko'?SP[hit.sp].k:SP[hit.sp].e):(perf?L().perfect+' ':'')+'+'+pts,t:.8,y:H*.3,c:SP[hit.sp].c,big:isNew||perf});
if(combo>=3)pops.push({s:combo+' COMBO x'+mult,t:.6,y:H*.36,c:'#ffd76f',big:combo%5==0});
sfx(600+Math.min(combo,20)*45,.1,'triangle');if(perf)sfx(1318,.12,'sine');if(isNew)sfx(1046,.3,'triangle');
shake=perf?7:4;if(isNew)flash=.25;burst(me.x,hit.y,SP[hit.sp].c,perf?26:14);
me.ride=hit;hit.v=0;me.x=hit.x;me.y=hit.y;me.jy=0;me.jt=-1;row()}}
else me.x=r.x;
cam+=((me.y-H*.72)-cam)*Math.min(1,dt*12)}
function crit(c,cx,cy,w,ph){const fl=Math.sin(ph)*w*.35;x.fillStyle=c;x.globalAlpha=.75;
x.beginPath();x.ellipse(cx-w*.35,cy-fl*.3,w*.4,w*.16,-.5+Math.sin(ph)*.6,0,7);x.fill();x.beginPath();x.ellipse(cx+w*.35,cy-fl*.3,w*.4,w*.16,.5-Math.sin(ph)*.6,0,7);x.fill();
x.globalAlpha=1;x.shadowColor=c;x.shadowBlur=18;x.beginPath();x.ellipse(cx,cy,w*.42,w*.24,0,0,7);x.fill();x.shadowBlur=0;
x.fillStyle='#fff';x.beginPath();x.arc(cx+w*.2,cy-w*.06,w*.08,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(cx+w*.22,cy-w*.06,w*.04,0,7);x.fill()}
function hero(cx,cy){x.fillStyle='#ffb86b';x.beginPath();x.arc(cx,cy-22,12,0,7);x.fill();x.fillStyle='#4a6cff';x.fillRect(cx-9,cy-12,18,14);x.fillStyle='#000';x.fillRect(cx-5,cy-25,3,3);x.fillRect(cx+3,cy-25,3,3)}
function draw(){const g=x.createLinearGradient(0,0,0,H);const hue=(220+cam*-.02)%360;g.addColorStop(0,`hsl(${hue},55%,12%)`);g.addColorStop(1,`hsl(${hue+40},60%,28%)`);x.fillStyle=g;x.fillRect(0,0,W,H);
for(let i=0;i<40;i++){const sy=((i*97-cam*.3)%H+H)%H;x.fillStyle='#ffffff'+(i%3?'44':'99');x.fillRect((i*137)%W,sy,2,2)}
// floating islands deco
x.save();x.translate((Math.random()-.5)*shake,-cam+(Math.random()-.5)*shake);
for(const t of tgs)crit(SP[t.sp].c,t.x,t.y,t.w,t.ph);
if(st!='title'||true){const r=me.ride;crit(SP[r.sp].c,r.x,r.y,r.w,r.ph);hero(me.x,me.y+me.jy-r.w*.12)}
parts.forEach(p=>{x.fillStyle=p.c;x.globalAlpha=p.l/30;x.fillRect(p.x,p.y,5,5)});x.globalAlpha=1;x.restore();if(flash){x.fillStyle='rgba(255,255,255,'+flash+')';x.fillRect(0,0,W,H)}
x.textAlign='center';x.fillStyle='#fff';
if(st=='play'){x.font='bold 44px sans-serif';x.fillText(score,W/2,H*.13);x.font='14px sans-serif';x.fillText(L().dex+' '+dex.length+'/'+SP.length,W/2,H*.13+22);
x.fillStyle=tleft<6?'#ff5c5c':'#ffd76f';x.fillRect(W*.15,H*.13+32,W*.7*tleft/ROUND,6);if(combo>=2){x.fillStyle='#ffd76f';x.font='bold 16px sans-serif';x.fillText('x'+(1+Math.floor(combo/4))+' · '+combo+' combo',W/2,H*.13+56)}
pops.forEach(p=>{const k=p.big?1+Math.max(0,p.t-.5)*1.5:1;x.globalAlpha=Math.min(1,p.t*3);x.font='bold '+Math.round((p.big?28:22)*k)+'px sans-serif';x.fillStyle=p.c;x.fillText(p.s,W/2,p.y)});x.globalAlpha=1}
else{x.fillStyle='#0008';x.fillRect(0,H*.2,W,H*.42);x.fillStyle='#ffd76f';x.font='bold 30px sans-serif';
if(st=='title'){x.fillText(L().t,W/2,H*.3);x.fillStyle='#fff';x.font='17px sans-serif';x.fillText(L().s,W/2,H*.37);x.fillText(L().best+' '+best+' · '+L().dex+' '+dex.length+'/'+SP.length,W/2,H*.44);x.font='bold 22px sans-serif';x.fillText(lang=='ko'?'👆 탭해서 시작':'👆 Tap to start',W/2,H*.54)}
else{x.fillText(L().over,W/2,H*.29);x.fillStyle='#fff';x.font='bold 40px sans-serif';x.fillText(score,W/2,H*.37);x.font='17px sans-serif';x.fillText((nb?L().nb:L().best+' '+best)+' · MAX '+maxc+' COMBO',W/2,H*.43);
x.fillText(L().dex+' '+dex.length+'/'+SP.length+(dex.length<SP.length?(lang=='ko'?' · 황금 용을 찾아라!':' · Find the Golden Dragon!'):''),W/2,H*.48);x.font='bold 22px sans-serif';x.fillStyle='#ffd76f';x.fillText(L().retry,W/2,H*.56)}}}
function loop(t){const dt=Math.min(.05,Math.max(0,(t-lt)/1000))||.016;lt=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.__g21={get st(){return st},get score(){return score},get combo(){return combo},get aligned(){return me.jt<0&&tgs.some(t=>Math.abs(t.x+t.v*spd()*(JD/spd()+.05)-me.x)<t.w*.3)}};
})();
</script>
</body>
</html>
