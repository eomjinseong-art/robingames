function renderHome(){if(FAST)$('fastBox').classList.add('show');$('dailyText').textContent=data.eggs+' '+(lang==='ko'?'알 · 젤리 '+data.jelly+'개':'eggs · jelly '+data.jelly);$('checkBtn').disabled=!FAST&&data.lastCheck===today();$('checkBtn').textContent=(!FAST&&data.lastCheck===today())?(lang==='ko'?'받음':'Done'):t('check');$('slots').innerHTML='';data.slots.forEach((s,i)=>{let e=document.createElement('div');e.className='slot'+(s?'':' empty');if(!s){e.innerHTML='<button>＋</button>';e.onclick=()=>adopt(i)}else{let b=bugs[s.species];e.innerHTML=`<span class="rarity">${rarity(b)}</span><img src="${img(s)}"><div class="stage">${ST[s.stage][lang==='ko'?0:1]}</div><div class="who">${s.stage===0?'???':b[lang]}</div>`;e.onclick=()=>openCare(i)}$('slots').append(e)})}
function adopt(i){if(data.slots[i])return openCare(i);if(data.eggs<1)return toast(lang==='ko'?'알이 없어요. 출석 선물을 받아요!':'No egg. Claim the daily gift!');let r=Math.random(),pool=r<.14?bugs.filter(b=>b.tier==='전설'):r<.38?bugs.filter(b=>b.tier==='희귀'):bugs.filter(b=>b.tier==='일반'),b=pool[Math.floor(Math.random()*pool.length)];data.eggs--;data.slots[i]={species:bugs.indexOf(b),stage:0,quality:.48,flags:{sawdust:false,moisture:false},last:'',touched:false,size:null,days:0};active=i;save();renderHome();$('revealImg').src=I+'egg-beetle.webp?v=2';$('revealName').textContent=(lang==='ko'?'랜덤 알: ':'Random egg: ')+b[lang];$('revealRarity').textContent=rarity(b)+' ✨';$('revealDesc').textContent=lang==='ko'?'이름은 부화 전까지 비밀! 매일 한 번 돌봐요.':'The species is secret until it hatches! Care once each day.';modal('revealModal')}
function openCare(i){active=i;show('careView');renderCare()}function renderCare(){let s=data.slots[active];if(!s)return show('homeView');let b=bugs[s.species],k=lang==='ko'?0:1;$('careTitle').textContent=b[lang]+' · '+rarity(b);$('stageImg').src=img(s);$('stageLabel').textContent=ST[s.stage][k];$('stageName').textContent=s.stage===0?'???':b[lang];$('progress').querySelectorAll('i').forEach((x,i)=>x.classList.toggle('off',i>s.stage));$('fact').innerHTML=(s.stage===0?(lang==='ko'?'알은 흙 속에서 조용히 자라요.':'An egg grows quietly under soil.'):s.stage===1?(lang==='ko'?'애벌레는 1년 가까이 흙 속에서 살아.':'The larva can live in soil for almost a year.'):s.stage===2?(lang==='ko'?'번데기 때 몸이 성충으로 바뀌어요.':'Inside the pupa, the body changes into an adult.'):b[lang==='ko'?'factKo':'factEn'])+'<small>'+(s.stage===0?'An egg grows quietly under soil.':s.stage===1?'애벌레는 흙 속에서 통통해져요.':s.stage===2?'Touching a pupa can make it smaller.':'Same species, different size: your care makes the brag stat!')+'</small>';$('habitat').textContent='📍 '+(lang==='ko'?b.habKo:b.habEn)+' · 🍽️ '+(lang==='ko'?b.foodKo:b.foodEn);let p=$('carePanel');if(s.stage===0)p.innerHTML=`<h3>${lang==='ko'?'알을 따뜻하게 지켜봐요':'Keep the egg safe'}</h3><button class="btn green" id="advanceBtn">${lang==='ko'?'부화 준비하기':'Prepare to hatch'} 🥚</button><div class="hint">${lang==='ko'?'오늘의 돌봄 한 번으로 애벌레가 돼요.':'One daily care turns it into a larva.'}</div>`;else if(s.stage===1)p.innerHTML=`<h3>${lang==='ko'?'애벌레 돌봄':'Larva care'}</h3><div class="care-buttons"><button class="btn ${s.flags.sawdust?'green':''}" id="sawdustBtn">🪵 ${lang==='ko'?'발효 톱밥 교체':'Change sawdust'}</button><button class="btn ${s.flags.moisture?'green':''}" id="moistBtn">💧 ${lang==='ko'?'수분 맞추기':'Set moisture'}</button></div><button class="btn green" id="advanceBtn" style="width:100%;margin-top:8px" ${s.flags.sawdust&&s.flags.moisture?'':'disabled'}>${lang==='ko'?'통통해진 애벌레 확인':'See the fatter larva'} 🐛</button><div class="hint">${lang==='ko'?'톱밥은 촉촉하지만 질척하지 않게!':'Sawdust should be moist, never soggy.'}</div>`;else if(s.stage===2)p.innerHTML=`<h3>${lang==='ko'?'번데기는 건드리지 않기':'Do not touch the pupa'}</h3><div class="care-buttons"><button class="btn green" id="waitBtn">🫣 ${lang==='ko'?'조용히 관찰':'Watch quietly'}</button><button class="btn" id="touchBtn">☝️ ${lang==='ko'?'살짝 만져 보기':'Touch it'}</button></div><button class="btn green" id="advanceBtn" style="width:100%;margin-top:8px">${lang==='ko'?'성충으로 우화':'Emerge as adult'} 🪲</button><div class="hint">${lang==='ko'?'번데기를 만지면 크기가 조금 줄어들어요.':'Touching the pupa causes a small size penalty.'}</div>`;else p.innerHTML=`<h3>${lang==='ko'?'성충 돌봄':'Adult care'}</h3><div class="care-buttons"><button class="btn green" id="feedBtn">🍮 ${lang==='ko'?'곤충 젤리 먹이기':'Feed beetle jelly'}</button><button class="btn" id="playBtn">🪵 ${lang==='ko'?'나무에서 놀기':'Play on a log'}</button></div><button class="btn green" id="bragBtn" style="width:100%;margin-top:8px">📸 ${lang==='ko'?'자랑 카드 만들기':'Make brag card'}</button><div class="hint">${lang==='ko'?'성충은 죽지 않아요. 매일 먹고 놀아요!':'Adults never die here. Feed and play each day!'}</div>`;bindCare(s)}
function bindCare(s){$('advanceBtn')?.addEventListener('click',advance);$('sawdustBtn')?.addEventListener('click',()=>{s.flags.sawdust=true;s.quality=Math.min(1,s.quality+.07);save();renderCare()});$('moistBtn')?.addEventListener('click',()=>{s.flags.moisture=true;s.quality=Math.min(1,s.quality+.07);save();renderCare()});$('waitBtn')?.addEventListener('click',()=>toast(lang==='ko'?'쉿! 잘 참았어요.':'Shh! Good patience.'));$('touchBtn')?.addEventListener('click',()=>{if(!s.touched){s.touched=true;s.quality=Math.max(0,s.quality-.06);save();toast(lang==='ko'?'앗, 살짝 작아졌어요!':'Oops, a little size was lost!')}renderCare()});$('feedBtn')?.addEventListener('click',()=>{if(data.jelly){data.jelly--;s.quality=Math.min(1,s.quality+.025);save();toast(lang==='ko'?'냠냠! 젤리 냄새가 뿡!':'Yum! The jelly smells tooty!')}else toast(lang==='ko'?'젤리가 없어요.':'No jelly!')});$('playBtn')?.addEventListener('click',()=>toast(lang==='ko'?'통나무 위 산책 완료!':'Log walk complete!'));$('bragBtn')?.addEventListener('click',()=>brag(s,bugs[s.species]))}
function advance(){let s=data.slots[active];if(!FAST&&s.last===today())return toast(lang==='ko'?'내일 다시 돌봐요!':'Come back tomorrow!');if(s.stage===1&&!(s.flags.sawdust&&s.flags.moisture))return; s.last=today();s.days=(s.days||0)+1;const need=FAST?1:[2,3,2][s.stage]||1;if(s.days<need){save();renderCare();toast(lang==='ko'?`잘 돌봤어요! ${need-s.days}일 더 자라요.`:`Good care! ${need-s.days} more day(s).`);return}s.days=0;s.stage++;s.flags={sawdust:false,moisture:false};if(s.stage===2)s.quality=Math.min(1,s.quality+.04);if(s.stage===3){s.size=+(bugs[s.species].min+(bugs[s.species].max-bugs[s.species].min)*Math.min(1,s.quality)).toFixed(1);data.book=[...new Set([...data.book,bugs[s.species].id])];save();renderCare();quiz(active);return}save();renderCare();toast(lang==='ko'?'한 단계 자랐어요!':'One stage grown!')}
function quiz(i){let s=data.slots[i],b=bugs[s.species],opts=[b];while(opts.length<3){let x=bugs[Math.floor(Math.random()*bugs.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);$('quizPrompt').textContent=lang==='ko'?'이 성충의 이름은 무엇일까요?':'What is this adult called?';$('quizImg').src=I+'adult-'+b.id+'.webp?v=2';$('quizChoices').innerHTML='';opts.forEach(x=>{let q=document.createElement('button');q.className='quiz-choice';q.textContent=x[lang];q.onclick=()=>{if(x===b){s.quality=Math.min(1,s.quality+.08);s.size=+(b.min+(b.max-b.min)*Math.min(1,s.quality)).toFixed(1);toast(lang==='ko'?'정답! 크기 보너스 +':'Correct! Size bonus +')}save();modal('quizModal',false);renderCare()};$('quizChoices').append(q)});modal('quizModal')}
function checkin(){if(!FAST&&data.lastCheck===today())return;if(Math.random()<.55){data.eggs++;toast(lang==='ko'?'출석 선물: 랜덤 알!':'Check-in gift: a random egg!')}else{data.jelly+=2;toast(lang==='ko'?'출석 선물: 젤리 2개!':'Check-in gift: two jellies!')}data.lastCheck=today();save();renderHome()}
function brag(s,b){let c=$('bragCanvas'),x=c.getContext('2d');x.fillStyle='#f4e5c8';x.fillRect(0,0,700,900);x.fillStyle='#2f6947';x.font='900 42px sans-serif';x.textAlign='center';x.fillText('뿡뿡 곤충 농장',350,70);let im=new Image();im.onload=()=>{x.drawImage(im,70,105,560,560);x.fillStyle='#25382a';x.font='900 34px sans-serif';x.fillText(b.ko,350,735);x.font='700 28px sans-serif';x.fillText(b.en,350,775);x.fillStyle='#a56b3e';x.font='900 40px sans-serif';x.fillText(s.size+' cm',350,840);$('downloadBtn').href=c.toDataURL('image/png')};im.src=I+'adult-'+b.id+'.webp?v=2';modal('bragModal')}
function book(){let g=$('bookGrid');g.innerHTML='';bugs.forEach(b=>{let on=data.book.includes(b.id),d=document.createElement('div');d.className='book'+(on?'':' locked');d.innerHTML=`<img src="${I+'adult-'+b.id+'.webp?v=2'}"><b>${on?b[lang]:'???'}</b>${on?`<small>${b.min}–${b.max} cm<br>📍 ${lang==='ko'?b.habKo:b.habEn}<br>🍽️ ${lang==='ko'?b.foodKo:b.foodEn}</small>`:'<small>LOCKED</small>'}`;g.append(d)})}
function language(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>{if(tx[e.dataset.i18n])e.textContent=t(e.dataset.i18n)});renderHome();if(active>=0)renderCare()}
$('checkBtn').onclick=checkin;$('bookBtn').onclick=()=>{book();modal('bookModal')};$('helpBtn').onclick=()=>alert(lang==='ko'?'알은 하루 한 번, 애벌레는 톱밥과 수분, 번데기는 쉿! 성충은 젤리와 통나무예요.':'Egg once a day. Larva needs sawdust and moisture. Pupa: shh! Adult: jelly and a log.');$('backBtn').onclick=()=>{show('homeView');renderHome()};$('langBtn').onclick=()=>{lang=lang==='ko'?'en':'ko';try{localStorage.setItem(LANG,lang)}catch(e){}language()};document.querySelectorAll('.closeModal').forEach(x=>x.onclick=()=>{let id=x.closest('.modal').id;modal(id,false);if(id==='revealModal')openCare(active)});$('fastStart').onclick=()=>{if(!data.slots[0]){if(!data.eggs)data.eggs=1;adopt(0)}else openCare(0)};renderHome();window.__tootBugFarm=Object.freeze({snapshot:()=>({active,stage:active>=0&&data.slots[active]?data.slots[active].stage:null,slots:data.slots.map(s=>s?{species:bugs[s.species].id,stage:s.stage,size:s.size}:null),imagesLoaded:loaded,totalImages:assets.length,fast:FAST})});
})();</script></body></html>
