    const onStairs = z > L + 6;

      const ra = P(-1.12, 0, z1), rb = P(-1, 0, z1), rc = P(-1, 0, z0), rd = P(-1.12, 0, z0); quad(ra, rb, rc, rd, k ? '#ff5fa2' : '#fff');

  for (const o of objs) if (!o.done || o.t === 'gate' || o.t === 'math') { if (o.z > cam.z + 0.3 && o.z < cam.z + 80) list.push(o); }
  if (phase !== 'run' || pl.z > L - 80) { list.push({ t: 'boss', z: L + 3 }); for (let i = 9; i >= 0; i--) list.push({ t: 'step', i, z: L + 7 + i * 2 }); }

      const a = P(x0 + 0.04, 1.3, o.z), b = P(x1 - 0.04, 1.3, o.z), c = P(x1 - 0.04, 0, o.z), d = P(x0 + 0.04, 0, o.z); if (!a || !c) return;

  } else if (o.t === 'wall') {
    const a = P(o.x - o.w / 2, 0.7, o.z), b = P(o.x + o.w / 2, 0.7, o.z), c = P(o.x + o.w / 2, 0, o.z); if (!a || !c) return;
    cx.fillStyle = '#9bb46a'; const w = b.x - a.x, h = c.y - a.y;
    cx.beginPath(); for (let i = 0; i < 4; i++) cx.arc(a.x + w * (0.15 + i * 0.23), a.y + h * 0.45, h * 0.42, 0, 7); cx.fill();
    cx.fillRect(a.x, a.y + h * 0.45, w, h * 0.55);
    cx.font = (h * 0.6) + 'px sans-serif'; cx.textAlign = 'center'; cx.fillText('😤', a.x + w / 2, a.y + h * 0.75);
  } else if (o.t === 'boss') {
    let y = 0, rot = 0, sc = 1; if (bossOut) { y = bossOut.t * bossOut.t * 9 + bossOut.t * 5; rot = bossOut.t * 9; sc = 1 + bossOut.t; }
    if (phase === 'lose' && loseWhy === 'boss') sc = 1.1 + Math.sin(tm * 20) * 0.05;
    const p = P(0, 1.1 + y, o.z); if (!p) return; const fs = 2.0 * p.s * sc;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(rot); cx.font = fs + 'px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('👨‍🌾', 0, 0); cx.restore(); cx.textBaseline = 'alphabetic';
    if (!bossOut) { const q = P(0, 2.4, o.z); if (q) badge(q.x, q.y, String(bossNeed), '#ff3b3b', Math.max(16, 0.45 * q.s)); }
  } else if (o.t === 'step') {
    const z0 = o.z, z1 = o.z + 2, y = (o.i + 1) * 0.28, col = stepCol(o.i);
    const a = P(-1, y, z1), b = P(1, y, z1), c = P(1, y, z0), d = P(-1, y, z0), e = P(1, y - 0.28, z0), f = P(-1, y - 0.28, z0); if (!a || !c) return;

function shade(hex) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) * 0.7 | 0, g = ((n >> 8) & 255) * 0.7 | 0, b = (n & 255) * 0.7 | 0; return 'rgb(' + r + ',' + g + ',' + b + ')'; }

/* ===== 루프 / UI ===== */
function loop(now) { const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now; if (state !== 'pause') update(dt); draw(); requestAnimationFrame(loop); }
function pause() { if (state !== 'play') return; state = 'pause'; snd.stopMusic(); show('pauseScr'); $('pauseBtn').textContent = '▶️'; ptr = null; }

document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', () => pause());
function applyLang() { applyLangBase(); $('startBtn').textContent = t('start', { n: store.level }); $('bestTxt').textContent = bestLine(); }

/* ===== 읽기 전용 상태 (쇼츠 자동화용) ===== */
const snapshot = () => {
