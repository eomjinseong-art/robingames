function tone(f,t,d,ty,v){if(!ac||!f)return;const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
const MEL=[62,66,69,74,73,69,66,62, 69,73,74,77,74,69,66,0, 64,67,71,74,73,71,67,64, 62,66,69,66,62,0,69,0];
const BAS=[38,38,45,45,43,43,38,38];const mf=n=>440*Math.pow(2,(n-69)/12);

function sfx(f,d,ty,v){if(ac)tone(f,ac.currentTime,d,ty||'sine',v||.2)}
function toot(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(55,t+.18);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.24)}

function au(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=muted?0:.4;mg.connect(ac.destination);nt=ac.currentTime}if(ac.resume)ac.resume();bgmOn=true}catch(e){}}
// state
let st='title',labor=0,best=0,hearts=3,hits=0,need=2,clk=0,P=1.8,tol=.2,zc=.5,zw=.4,glowI=-1,glowT=0,nextGlow=.6,lock=0,guard=0;
let now=0,lt=performance.now(),shake=0,flash=0,parts=[],pops=[],cards=[],nb=false,fails=0,pendTap=null,heroJ=0,monHit=0,tries=0;
try{best=+localStorage.g26best||0}catch(e){}
const STORY=['zeus'];
function cfg(i){const d=i/(NS-1);return{P:1.9-.8*d,tol:.22-.11*d,zw:.46-.24*d,gw:1.5-.7*d,need:2+Math.round(3*d),eo:1.1-.5*d,ec:1.3-.6*d}}
function setupLabor(){const c=cfg(labor);hearts=3;hits=0;need=c.need;P=c.P;tol=c.tol;zw=c.zw;clk=0;glowI=-1;glowT=0;nextGlow=.35;lock=0;newZone()}
function newZone(){zc=.3+Math.random()*.4}
function burst(px,py,c,nn){for(let i=0;i<nn;i++){const a=Math.random()*6.3,v=60+Math.random()*220;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,l:.45+Math.random()*.35,c})}}
function popAt(t,c,px,py){pops.push({t,c,x:px,y:py,l:1})}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
// geometry
const MX=()=>W*.5,MY=()=>H*.4,RT=()=>Math.min(W,H)*.15;
function glowPos(i){return{x:W*(.22+i*.28),y:H*.4}}
function ringR(){const c=clk/P;return RT()*(2.4-1.9*c)}  // equals RT at c=.737
const RC=1.4/1.9;
function inZone(){const L0=LABOR[labor];if(L0.ty=='ring')return Math.abs(clk/P-RC)<tol;if(L0.ty=='bar'){return Math.abs(barPos()-zc)<zw/2}if(L0.ty=='gaze')return eyesClosed();return glowI>=0}
function eyesClosed(){const c=cfg(labor);return (clk%(c.ec+c.eo))<c.ec}
function barPos(){const c=(clk/P)%2;return .05+.9*(c<1?c:2-c)}
function hit(){hits++;const p=LABOR[labor].ty=='glow'?glowPos(glowI):{x:MX(),y:MY()};toot();sfx(660+hits*120,.09,'square',.16);burst(p.x,p.y,Y,22);burst(p.x,p.y,G,10);flash=.25;shake=8;monHit=.35;heroJ=.3;vib(25);popAt(hits>=need?L().perfect:L().good,G,p.x,p.y-60);
  if(LABOR[labor].ty!='gaze')clk=0;glowI=-1;nextGlow=.3;newZone();if(hits>=need)clearLabor()}
function miss(){hearts--;sfx(140,.25,'sawtooth',.22);shake=12;flash=.15;vib(60);popAt(L().miss,R,MX(),MY()-70);if(LABOR[labor].ty=='gaze'){const c=cfg(labor);clk=0}else clk=0;glowI=-1;nextGlow=.4;newZone();
  if(hearts<=0){fails++;if(labor<2){popAt(L().again,Y,W/2,H*.55);setupLabor();lock=.35}else{st='quiz';Myth.quiz(lang,ok=>{st='play';setupLabor();if(ok){hearts=4;popAt('❤ +1',G,W/2,H*.55)}else popAt(L().again,Y,W/2,H*.55);lock=.35;guard=performance.now()})}}}
function clearLabor(){fanSfx();for(const id of LABOR[labor].cards)if(Myth.unlock(id))cards.push(id);
  if(labor+1>best){best=labor+1;nb=true;try{localStorage.g26best=best}catch(e){}}
  burst(W/2,H*.4,'#ffe58a',40);st='clear';guard=performance.now()}
function onTap(px,py){
  au();const t=performance.now();if(Myth.quizOpen&&Myth.quizOpen())return;if(document.querySelector('.myo'))return;
  if(t-guard<280)return;
  if(st=='title'){labor=0;cards=[];nb=false;fails=0;for(const id of STORY)if(Myth.unlock(id))cards.push(id);st='goal';guard=t;sfx(880,.08,'square',.15);return}
  if(st=='goal'){setupLabor();st='play';guard=t;sfx(988,.08,'square',.15);return}
  if(st=='clear'){if(labor>=NS-1){st='win';guard=t;return}labor++;setupLabor();st='goal';guard=t;return}
  if(st=='win'){st='title';guard=t;onTap(px,py);return}
  if(st=='play'){pendTap={x:px,y:py}}
}
const ui=e=>e.target.closest&&(e.target.closest('.bar')||e.target.closest('.myo')||e.target.closest('.myq'));
addEventListener('pointerdown',e=>{if(ui(e))return;e.preventDefault();onTap(e.clientX,e.clientY)},{passive:false});
addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='Enter'){e.preventDefault();if(!e.repeat)onTap(null,null)}});
addEventListener('contextmenu',e=>e.preventDefault());
function upd(dt){
  shake=Math.max(0,shake-dt*50);flash=Math.max(0,flash-dt*1.6);monHit=Math.max(0,monHit-dt);heroJ=Math.max(0,heroJ-dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
  for(const p of pops){p.y-=40*dt;p.l-=dt}pops=pops.filter(p=>p.l>0);
  if(st=='title')return; // frozen until first tap
  now+=dt;
  if(st!='play'){pendTap=null;return}
  if(document.querySelector('.myo')){pendTap=null;return}
  if(lock>0){lock-=dt;pendTap=null;return}
  const ty=LABOR[labor].ty;
  if(ty=='ring'){clk+=dt;if(clk>P)clk=0}
  else if(ty=='bar'||ty=='gaze'){clk+=dt}
  else{if(glowI>=0){glowT-=dt;if(glowT<=0){glowI=-1;nextGlow=.35}}else{nextGlow-=dt;if(nextGlow<=0){glowI=Math.random()*3|0;glowT=cfg(labor).gw;sfx(1200,.05,'triangle',.1)}}}
  if(pendTap){const p=pendTap;pendTap=null;
    if(ty=='glow'){if(glowI<0)return miss();if(p.x!=null){const g=glowPos(glowI);let k=0,bd=1e9;for(let i=0;i<3;i++){const q=glowPos(i),dd=Math.hypot(q.x-p.x,q.y-p.y);if(dd<bd){bd=dd;k=i}}if(k!==glowI&&bd<RT()*1.2)return miss()}return hit()}
    if(inZone())hit();else miss()}
}
function txt(s,px,py,sz,col){x.font='bold '+sz+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=Math.max(3,sz/7);x.strokeStyle='#000a';x.strokeText(s,px,py);x.fillStyle=col;x.fillText(s,px,py)}
function wrap(t,cx,cy,mw,lh){lh=lh||18;x.textAlign='center';x.textBaseline='middle';const lines=[];let cur='';for(const w of String(t).split(/\s+/)){const tr=cur?cur+' '+w:w;if(x.measureText(tr).width>mw&&cur){lines.push(cur);cur=w}else cur=tr}if(cur)lines.push(cur);lines.forEach((ln,i)=>x.fillText(ln,cx,cy+i*lh));return cy+lines.length*lh}
function emo(e,px,py,sz){x.font=sz+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,px,py)}
function bg(){const p=PAL[labor];const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,p[0]);g.addColorStop(.55,p[1]);g.addColorStop(1,p[2]);x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle=p[3];x.fillRect(0,H*.74,W,H)}
function hero(){const px=W*.5,py=H*.78-Math.sin(Math.min(1,heroJ/.3)*Math.PI)*24;x.save();x.translate(px,py);
  x.fillStyle='#d24b3a';x.beginPath();x.ellipse(0,16,18,16,0,0,7);x.fill();x.fillStyle='#c8ccd8';x.beginPath();x.arc(0,-14,16,Math.PI,0);x.fill();
  x.fillStyle='#f0c090';x.strokeStyle='#5a3414';x.lineWidth=3;x.beginPath();x.arc(0,-8,13,0,7);x.fill();x.stroke();
  x.fillStyle='#2a140c';x.beginPath();x.arc(-5,-9,2.5,0,7);x.arc(5,-9,2.5,0,7);x.fill();
  x.strokeStyle='#8a4e1c';x.lineWidth=7;x.beginPath();x.moveTo(16,10);x.lineTo(30,heroJ>0?-30:-14);x.stroke();x.restore();
  if(heroJ>0){x.globalAlpha=heroJ*2;x.fillStyle='#d8f8b0';x.beginPath();x.arc(px-26,py+18,10,0,7);x.fill();x.globalAlpha=1}}
function stage(){const L0=LABOR[labor],ty=L0.ty,mx=MX(),my=MY(),rt=RT(),z=st=='play'&&inZone();
  if(ty=='ring'){
    x.lineWidth=rt*2*tol*1.9*.5+6;x.strokeStyle='rgba(123,237,159,.45)';x.beginPath();x.arc(mx,my,rt,0,7);x.stroke();
    const s=1+monHit*.6;x.save();x.translate(mx,my);x.scale(s,s);emo(L0.em,0,0,rt*1.2);x.restore();
    if(st=='play'){x.lineWidth=8;x.strokeStyle=z?G:'#fff';x.beginPath();x.arc(mx,my,Math.max(4,ringR()),0,7);x.stroke()}
  }else if(ty=='bar'){
    const bx=W*.08,bw=W*.84,by=my+rt*.9,bh=34;x.fillStyle='#0007';x.fillRect(bx,by,bw,bh);
    x.fillStyle=z?'#7bed9f':'rgba(123,237,159,.6)';x.fillRect(bx+bw*(zc-zw/2),by,bw*zw,bh);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(bx,by,bw,bh);
    const m=st=='play'?barPos():.05;const mxp=bx+bw*m;x.fillStyle=z?G:'#fff';x.fillRect(mxp-4,by-10,8,bh+20);
    const s=1+monHit*.6;x.save();x.translate(mxp,by-rt*.7);x.scale(s,s);emo(L0.em,0,0,rt*1.0);x.restore();
  }else if(ty=='gaze'){
    const cl=st!='play'||eyesClosed(),s=1+monHit*.6;
