<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>뿡뿡 숫자 찾기 / Toot Number Hunt | 나두게임즈</title>
<meta name="description" content="뿡뿡 숫자 찾기 / Toot Number Hunt — tap numbers in order before time runs out.">
<meta name="theme-color" content="#0b1a2e">
<script src="/counter.js" defer></script>
<style>
:root{--ink:#eaf2ff;--bg:#071222;--panel:#12233a;--line:#2a4a72;--good:#3dff9a;--bad:#ff4d6d;--amber:#ffd56a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(circle at 50% -10%,#1a3a66,transparent 50%),#071222}
#stage{width:100%;max-width:calc(100dvh*.56);height:100%;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));position:relative}
.top{display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:6px}
.icon{width:44px;height:44px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font:900 18px inherit;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 3px 0 #0006}
.icon:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0006}
.hud{text-align:center;margin:6px 0}.hud h1{font-size:clamp(24px,6.5vw,32px)}.hud .sub{opacity:.75;font-size:13px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pill{min-width:78px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:#0e1c30;font-size:12px;font-weight:900}.pill b{display:block;font-size:18px;color:#fff}
#status{min-height:26px;text-align:center;font-weight:900;margin:4px 0;color:#9ec4ff}
#field{flex:1;min-height:0;position:relative;border:2px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#10243d,#0a1830);overflow:hidden;box-shadow:inset 0 0 40px #0006}
.num{position:absolute;border:0;border-radius:50%;font:900 18px inherit;color:#071222;cursor:pointer;box-shadow:0 4px 0 #0005,0 0 16px currentColor;touch-action:none;transform:translate(-50%,-50%)}
.num:active{transform:translate(-50%,-50%) scale(.92)}.num.ok{opacity:.2;pointer-events:none;filter:grayscale(.4)}.num.bad{animation:shake .25s}
@keyframes shake{25%{transform:translate(calc(-50% - 4px),-50%)}75%{transform:translate(calc(-50% + 4px),-50%)}}
.btn{min-height:50px;border:2px solid #3d6aa3;border-radius:16px;background:linear-gradient(180deg,#2f6db8,#1d4478);color:#fff;font:900 16px inherit;box-shadow:0 4px 0 #0c1a30;cursor:pointer;width:100%;margin-top:8px}
.overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:#040b14dd}
.overlay.show{display:flex}.panel{width:min(100%,380px);background:linear-gradient(180deg,#173254,#0e2038);border:2px solid #3a6496;border-radius:22px;padding:16px;text-align:center;box-shadow:0 12px 40px #000a}
.panel h2{font-size:28px;margin-bottom:6px}.panel p{opacity:.9;line-height:1.4;margin:8px 0 12px}.scoreline{font-size:22px;font-weight:900;color:var(--amber)}
.credit{text-align:center;font-size:10px;color:#8aa4c099;margin-top:6px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div class="top"><a class="icon" href="../../index.html" aria-label="Home">⌂</a><div class="actions"><button class="icon" id="langBtn">🌐</button><button class="icon" id="muteBtn">🔊</button></div></div>
  <div class="hud"><h1 data-i18n="title">뿡뿡 숫자 찾기</h1><div class="sub" data-i18n="titleEn">TOOT NUMBER HUNT</div>
    <div class="stats"><div class="pill"><span data-i18n="next">다음</span><b id="nextVal">1</b></div><div class="pill"><span data-i18n="time">시간</span><b id="timeVal">30</b></div><div class="pill"><span data-i18n="best">최고</span><b id="bestVal">0</b></div></div>
  </div>
  <div id="status" data-i18n="ready">1부터 순서대로 톡!</div>
  <div id="field"></div>
  <button class="btn" id="startBtn" data-i18n="start">▶ 시작</button>
  <div class="credit">© 나두게임즈 Nadoo Games | Developed by 나두Ai</div>
  <div class="overlay show" id="titleScr"><div class="panel"><h2 data-i18n="title">뿡뿡 숫자 찾기</h2><p data-i18n="tag">흩어진 숫자를 1부터 순서대로 눌러요. 틀리면 끝!</p><button class="btn" id="goBtn" data-i18n="start">▶ 시작</button></div></div>
  <div class="overlay" id="overScr"><div class="panel"><h2 data-i18n="over">게임 오버</h2><div class="scoreline" id="near"></div><p id="overSub"></p><button class="btn" id="againBtn" data-i18n="again">한 판 더</button></div></div>
</div></div>
<script>
(()=>{'use strict';
/* Standing BGM rule: always make BGM highly addictive; MUSIC quieter than SFX. */
const $=id=>document.getElementById(id), LANG_KEY='nadoo_lang', MUTE_KEY='tootNumberHunt_mute', SAVE_KEY='tootNumberHunt_v1', FAST=new URLSearchParams(location.search).get('fast')==='1';
const T={title:['뿡뿡 숫자 찾기','Toot Number Hunt'],titleEn:['TOOT NUMBER HUNT','뿡뿡 숫자 찾기'],tag:['흩어진 숫자를 1부터 순서대로 눌러요. 틀리면 끝!','Tap scattered numbers in order from 1. Wrong tap = game over!'],start:['▶ 시작','▶ Start'],next:['다음','Next'],time:['시간','Time'],best:['최고','Best'],ready:['1부터 순서대로 톡!','Tap from 1 in order!'],go:['좋아요!','Nice!'],over:['게임 오버','Game Over'],near:['아깝다! {n}까지','So close! Got to {n}'],again:['한 판 더','Again'],level:['레벨 {n}','Level {n}']};
let lang='ko';try{lang=localStorage.getItem(LANG_KEY)||((navigator.language||'en').toLowerCase().startsWith('ko')?'ko':'en')}catch(e){}
const t=(k,v={})=>String(T[k][lang==='ko'?0:1]).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
let save={best:0};try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}};
const MUSIC_PROG=[[0,4,7],[5,9,12],[-3,0,4],[7,11,14],[0,5,9],[2,7,11]];
const MUSIC_MEL=[12,null,14,12,null,16,14,null,19,null,16,12,9,null,7,null,5,5,null,7,null,9,12,null,14,null,12,9,7,null,5,null];
const snd={ac:null,muted:false,master:null,musicBus:null,noiseBuf:null,unlocked:false,el:null,musicOn:false,mTimer:null,mNext:0,mStep:0,bpm:150,key:0,MASTER:.9,MUSIC:.12,
 init(){try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch(e){}
  if(!this.ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{this.ac=new AC({latencyHint:'interactive'})}catch(e){this.ac=new AC()}
   const ac=this.ac;this.master=ac.createGain();this.master.gain.value=this.muted?0:this.MASTER;const c=ac.createDynamicsCompressor();c.threshold.value=-22;c.ratio.value=3.5;const m=ac.createGain();m.gain.value=1.2;this.master.connect(c);c.connect(m);m.connect(ac.destination);
   this.musicBus=ac.createGain();this.musicBus.gain.value=.0001;this.musicBus.connect(this.master);const len=ac.sampleRate;this.noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const ch=this.noiseBuf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1}
  const ac=this.ac;if(ac.state!=='running'){try{const p=ac.resume();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
  if(!this.unlocked){try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);this.unlocked=true}catch(e){}}
  if(!navigator.audioSession&&/iP(hone|ad|od)|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document){if(!this.el){const sr=8000,n=800,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);this.el=document.createElement('audio');this.el.src=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));this.el.loop=true;this.el.setAttribute('playsinline','');this.el.preload='auto'}if(this.el.paused&&!document.hidden){const p=this.el.play();if(p&&p.catch)p.catch(()=>{})}}
  this.startMusic()},
 setMute(m){this.muted=m;try{localStorage.setItem(MUTE_KEY,m?'1':'0')}catch(e){}if(this.master&&this.ac)this.master.gain.setTargetAtTime(m?0:this.MASTER,this.ac.currentTime,.02)},
 sleep(){if(this.el&&!this.el.paused)this.el.pause();if(this.ac&&this.ac.state==='running'&&this.ac.suspend)this.ac.suspend().catch(()=>{})},
 startMusic(){if(!this.ac||this.musicOn)return;this.musicOn=true;this.mStep=0;this.mNext=this.ac.currentTime+.08;this.musicBus.gain.setTargetAtTime(this.MUSIC,this.ac.currentTime,.18);clearInterval(this.mTimer);this.mTimer=setInterval(()=>this.tickMusic(),50);this.tickMusic()},
 tickMusic(){const ac=this.ac;if(!ac||!this.musicOn||ac.state!=='running')return;if(this.mNext<ac.currentTime-.05)this.mNext=ac.currentTime+.05;while(this.mNext<ac.currentTime+.28){const e8=60/this.bpm/2;this.note(this.mStep,this.mNext,e8);this.mNext+=e8;this.mStep++}},
 note(step,t,e8){const ac=this.ac,bus=this.musicBus,bar=Math.floor(step/8)%MUSIC_PROG.length,s8=step%8,ch=MUSIC_PROG[bar],hz=st=>261.63*Math.pow(2,(st+this.key)/12);
  const blip=(f,dur,type,vol,slide)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.02)};
  if(s8===0||s8===3||s8===5)blip(hz(ch[0]-24),e8*1.2,'triangle',.42);if(s8===0||s8===4)blip(110,e8*.45,'sine',.48,.3);if(s8%2===1){const n=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();n.buffer=this.noiseBuf;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+.03);n.connect(f);f.connect(g);g.connect(bus);n.start(t,Math.random()*.4);n.stop(t+.035)}
  const m=MUSIC_MEL[step%MUSIC_MEL.length];if(m!==null)blip(hz(m+12),e8*.75,'square',.1);if(step%32===24)blip(hz(19),e8*1.8,'triangle',.13,.55)},
 tap(){if(!this.ac||this.muted)return;const t=this.ac.currentTime,o=this.ac.createOscillator(),g=this.ac.createGain();o.type='square';o.frequency.value=880;g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.1)},
 ok(){if(!this.ac||this.muted)return;[523,784].forEach((f,i)=>{const t=this.ac.currentTime+i*.05,o=this.ac.createOscillator(),g=this.ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.12)})},
 bad(){if(!this.ac||this.muted)return;const t=this.ac.currentTime,o=this.ac.createOscillator(),g=this.ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(70,t+.25);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.3)}
};
try{snd.muted=localStorage.getItem(MUTE_KEY)==='1'}catch(e){}
['pointerdown','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,()=>snd.init(),{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)snd.sleep();else if(snd.ac&&snd.ac.state!=='running')snd.ac.resume().catch(()=>{})});

let state='title', level=1, next=1, N=8, left=30, timer=null, score=0, jig=null;
const COLORS=['#7ec8ff','#ffd56a','#9dffb0','#ff9ec8','#c9a6ff','#ffb07a'];
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>{if(T[e.dataset.i18n])e.textContent=t(e.dataset.i18n)});$('langBtn').textContent=lang==='ko'?'🌐 EN':'🌐 한';$('bestVal').textContent=String(save.best);$('muteBtn').textContent=snd.muted?'🔇':'🔊'}
function show(id){document.querySelectorAll('.overlay').forEach(o=>o.classList.toggle('show',o.id===id))}
function setStatus(s){$('status').textContent=s}
function clearField(){$('field').innerHTML='';if(jig){clearInterval(jig);jig=null}}
function spawn(){
  clearField();const box=$('field'),R=box.getBoundingClientRect(),size=Math.max(34,56-level*2),pad=size/2+6,placed=[];
  for(let n=1;n<=N;n++){
    let x,y,ok=false;for(let t=0;t<80&&!ok;t++){x=pad+Math.random()*(R.width-pad*2);y=pad+Math.random()*(R.height-pad*2);ok=placed.every(p=>Math.hypot(p.x-x,p.y-y)>size*.95)}
    if(!ok){x=pad+((n*47)%(R.width-pad*2));y=pad+((n*73)%(R.height-pad*2))}
    placed.push({x,y});
    const b=document.createElement('button');b.className='num';b.textContent=String(n);b.style.width=b.style.height=size+'px';b.style.left=x+'px';b.style.top=y+'px';b.style.background=COLORS[(n-1)%COLORS.length];b.style.fontSize=Math.max(14,size*.42)+'px';b.dataset.n=String(n);
    b.addEventListener('pointerdown',e=>{e.preventDefault();onTap(+b.dataset.n,b)});
    box.appendChild(b);
  }
  if(level>=3){jig=setInterval(()=>{[...box.children].forEach(el=>{if(el.classList.contains('ok'))return;const dx=(Math.random()-.5)*2.2,dy=(Math.random()-.5)*2.2;const l=parseFloat(el.style.left)+dx,t=parseFloat(el.style.top)+dy;const w=box.clientWidth,h=box.clientHeight,s=el.offsetWidth/2;el.style.left=Math.min(w-s,Math.max(s,l))+'px';el.style.top=Math.min(h-s,Math.max(s,t))+'px'})},220)}
}
function onTap(n,el){if(state!=='play')return;snd.init();
  if(n===next){snd.ok();el.classList.add('ok');next++;score=Math.max(score,next-1);$('nextVal').textContent=String(Math.min(next,N));setStatus(t('go'));
    if(next>N){clearInterval(timer);level++;startLevel()}
  }else{snd.bad();el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),260);fail()}}
function fail(){state='over';clearInterval(timer);if(jig)clearInterval(jig);snd.bad();const reached=Math.max(0,next-1);if(reached>save.best){save.best=reached;persist()}
  $('near').textContent=t('near',{n:reached});$('overSub').textContent=t('best')+': '+save.best;$('bestVal').textContent=String(save.best);show('overScr')}
function tick(){left--;$('timeVal').textContent=String(Math.max(0,left));if(left<=0)fail()}
function startLevel(){state='play';next=1;N=Math.min(20,6+level*2);left=FAST?8:Math.max(12,34-level*2);$('nextVal').textContent='1';$('timeVal').textContent=String(left);setStatus(t('level',{n:level}));show(null);spawn();clearInterval(timer);timer=setInterval(tick,1000)}
function start(){snd.init();level=1;score=0;startLevel()}
$('startBtn').onclick=start;$('goBtn').onclick=start;$('againBtn').onclick=start;
$('langBtn').onclick=()=>{lang=lang==='ko'?'en':'ko';try{localStorage.setItem(LANG_KEY,lang)}catch(e){}applyLang()};
$('muteBtn').onclick=()=>{snd.init();snd.setMute(!snd.muted);applyLang();if(!snd.muted)snd.tap()};
applyLang();
window.__tootNumberHunt=Object.freeze({snapshot:()=>({state,level,next,N,left,best:save.best,audio:{state:snd.ac?snd.ac.state:'none',music:snd.musicOn,muted:snd.muted}}),forceFail:()=>fail()});
})();
</script>
</body>
</html>
