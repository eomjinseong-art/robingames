function newSim(B,dep,strat,duel,ji){const S={t:0,B,dep,strat:strat||[],ji:ji||3,duel:duel||0,units:[],flags:{},ev:[],over:false,win:null};S.key=B.key(dep,S.strat);
 for(let s=0;s<6;s++){const id=dep[s];if(!id)continue;const c=B.P.find(c=>c.id==id);S.units.push(mkU('P',c,s%3,s>=3))}
 B.E.forEach((e,i)=>{if(e)S.units.push(mkU('E',e,i<3?i:(e.lane??1),i==3))});
 S.P0=S.units.filter(u=>u.side=='P').reduce((a,u)=>a+u.max,0);S.E0=S.units.filter(u=>u.side=='E').reduce((a,u)=>a+u.max,0);
 if(S.duel>0)for(const u of S.units)if(u.side=='E')u.hp*=.85;if(S.duel<0)for(const u of S.units)if(u.side=='P')u.hp*=.9;return S}
function act(u){return u.st=='fight'||u.st=='wait'||u.st=='free'}
function frac(S,side){return S.units.filter(u=>u.side==side&&act(u)).reduce((a,u)=>a+u.hp,0)/(side=='P'?S.P0:S.E0)}

 if(has(S,'bluff')){const d=B.bluffOK?4.5:1.5;for(const u of S.units)if(u.side=='E')u.fx=S.t<d?.15:1;if(!f.bl){f.bl=1;emit(S,'strat',{s:'bluff'})}}

 if(has(S,'wall')&&!f.wall&&S.t>=6){f.wall=1;hitE(S,(B.wallOK||.05)*bo);emit(S,'strat',{s:'wall'})}}
function smod(S,a){let m=1;if(has(S,'drums')&&a.side=='P')m*=1.15;if(has(S,'wall')&&a.side=='E'&&S.t<5)m*=.55;return m}
function step(S,dt){if(S.over)return;S.t+=dt;const B=S.B;
 stratFx(S);if(B.event)B.event(S);
 for(const u of S.units){if(u.st!='wait')continue;
  if(u.side=='P'){const f=fighters(S,'P',u.lane);const fr=f.length?f.reduce((a,v)=>a+v.hp/v.max,0)/f.length:0;
   if(S.t>=3.5||(S.t>1.2&&(fr<.6||!fighters(S,'E',u.lane).length)))enter(S,u,u.lane)}
  else if(S.t>=(B.eResT||3.5)){let l=B.eResLane;if(l==null){let best=1e9;for(let i=0;i<3;i++){const e=fighters(S,'E',i).reduce((a,v)=>a+v.hp,0),p=fighters(S,'P',i).reduce((a,v)=>a+v.hp,0);if(!p)continue;const r=e/p;if(r<best){best=r;l=i}}if(l==null)l=1}enter(S,u,l)}}

  if(Ps.length&&Es.length){for(const [A,D] of [[Ps,Es],[Es,Ps]]){const tot=D.reduce((a,v)=>a+v.hp,0);for(const a of A){const tg=D.reduce((m,v)=>v.hp>m.hp?v:m);let k=a.p*mult(a,tg)*(a.flank?1.5:1)*(B.kmod?B.kmod(S,a,tg):1)*smod(S,a)*(.45+.55*a.hp/a.max)*a.fx*RATE*dt;for(const d of D)dmg.set(d,(dmg.get(d)||0)+k*d.hp/tot)}}}

 for(const u of S.units)if(act(u)&&u.hp<.15*u.max&&u.st!='rout'){u.st='rout';emit(S,'rout',{u})}
 const pf=frac(S,'P'),ef=frac(S,'E');
 const pa=S.units.some(u=>u.side=='P'&&act(u)),ea=S.units.some(u=>u.side=='E'&&act(u));
 let w=null;if(!ea)w=true;else if(!pa)w=false;else if(B.survive){if(pf<.2)w=false;else if(S.t>=TMAX)w=true}else if(ef<.28&&pf>ef)w=true;else if(pf<.28&&ef>pf)w=false;else if(S.t>=TMAX)w=pf>ef;
 if(w!=null){S.over=true;S.win=w;S.pf=pf;S.ef=ef;for(const u of S.units)if(act(u)&&(u.side=='P')!=w){u.st='rout';emit(S,'rout',{u,mass:1})}emit(S,'end',{w})}}

 else if(k=='fire'){noise(t,1.2,.18,600,'lowpass');noise(t+.2,.8,.08,2500,'highpass')}

 else{h=`<div class="panel"><h2>${L('lose')}</h2><h2 style="font-size:17px">${L('whyT')}</h2>${r.why.map(t=>`<div class="why">${t}</div>`).join('')}<div class="hist"><b>${L('hintT')}</b><p>${tx(B.hint)}</p></div><div class="row"><button class="btn" id="smB">${L('seeMatch')}</button><button class="btn red" id="rdB">${L('retry').split('→').pop().trim()}</button></div></div>`;ov(h,()=>toDeploy(),450,1);$('smB').onclick=e=>{e.stopPropagation();sfx('click');showMatch()};$('rdB').onclick=e=>{e.stopPropagation();sfx('click');toDeploy()}}}
function showReal(){scr='real';curRender=rReal;rReal()}
function rReal(){ov(`<div class="panel"><h2>${L('realT')}</h2><div class="pic" style="font-size:36px">${B.real.p}</div><div class="stx">${tx(B.real.t)}</div><div class="novel"><b>${L('novelT')}</b><br>${tx(B.novel)}</div><div class="row"><button class="btn red" id="qzB">${L('toQuiz').split('→').pop().trim()}</button></div></div>`,startQuiz,400,1);$('qzB').onclick=e=>{e.stopPropagation();sfx('click');startQuiz()}}
function startQuiz(){scr='quiz';const n=bi==0?2:3;QZ=shuffle(B.quiz.slice()).slice(0,n).map(q=>({q:q.q,opts:shuffle(q.a.map((o,i)=>({o,ok:i==0})))}));qi=0;qok=0;renderQ()}
function renderQ(){curRender=renderQ;qAns=-1;const q=QZ[qi];ov(`<div class="panel nocont"><div class="sub">${L('quiz')} ${qi+1} / ${QZ.length}</div><h2 style="font-size:18px">${tx(q.q)}</h2><div class="qopts">${q.opts.map((o,i)=>`<button class="btn" data-q="${i}">${tx(o.o)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`,null,0,1);
 $('ov').querySelectorAll('[data-q]').forEach(b=>b.onclick=e=>{e.stopPropagation();answer(+b.dataset.q)})}
function answer(i){if(qAns>=0)return;qAns=i;const q=QZ[qi],ok=q.opts[i].ok,bs=$('ov').querySelectorAll('[data-q]');q.opts.forEach((o,j)=>{if(o.ok)bs[j].classList.add('ok');else if(j==i)bs[j].classList.add('no');bs[j].disabled=true;bs[j].style.opacity=1});
 const cor=q.opts.find(o=>o.ok);$('fb').innerHTML=ok?`<span style="color:#2e7d22">${L('right')}</span>`:`<span style="color:#a32">${L('wrong')}</span> <span style="font-size:16px">${tx(cor.o)}</span>`;
 sfx(ok?'right':'wrong');if(ok)qok++;setTimeout(()=>{qi++;if(qi<QZ.length)renderQ();else quizDone()},ok?1100:2200)}
function quizDone(){scr='done';curRender=rDone;sfx('win');rDone()}
function rDone(){const last=bi>=4;let h=`<div class="panel"><h2>${last?L('allDone'):L('qDone')}</h2><p style="text-align:center;font-size:17px">${L('score')}: <b>${qok} / ${QZ.length}</b></p>`+(last?`<p class="sub">${L('dex')} ${dex.length}/${GORDER.length}</p>`:'')+
 `<div class="row">${last?'':`<button class="btn red" id="dnN">${L('next')}</button>`}<button class="btn" id="dnA">${L('again')}</button><button class="btn" id="dnM">${L('map')}</button></div><div class="cont">${L('contN')}</div></div>`;
 ov(h,()=>last?showMenu():startBattle(bi+1),500,1);if(!last)$('dnN').onclick=()=>{sfx('click');startBattle(bi+1)};$('dnA').onclick=()=>{sfx('click');startBattle(bi)};$('dnM').onclick=()=>{sfx('click');showMenu()}}

 x.fillStyle='rgba(178,34,24,.05)';x.fillRect(0,MID,W,FH-MID);x.fillStyle='rgba(30,30,30,.05)';x.fillRect(0,0,W,MID);
 x.setLineDash([6,5]);x.strokeStyle='rgba(90,50,20,.45)';x.lineWidth=1.5;x.beginPath();x.moveTo(GX+6,MID);x.lineTo(GX+GW-6,MID);x.stroke();
 for(let s=0;s<6;s++){const p=slotPos(s,'P');x.fillStyle=dep[s]?'rgba(255,248,225,.25)':'rgba(255,248,225,.45)';rr(p.x-w/2,p.y-h/2,w,h,9);x.fill();x.strokeStyle=hl?'#e0a800':'rgba(30,30,30,.6)';x.lineWidth=hl?2.5:1.5;x.stroke();
  x.fillStyle='rgba(30,30,30,.8)';x.font='bold 10px system-ui';x.textAlign='left';x.fillText(s<3?L('lanes')[s]:L('res'),p.x-w/2+6,p.y-h/2+12);
  if(!dep[s]){x.fillStyle='rgba(30,30,30,.35)';x.font='bold 22px system-ui';x.textAlign='center';x.fillText('+',p.x,p.y+8)}}
 x.setLineDash([])}
function drawLabels(){const c=sel?B.P.find(c=>c.id==sel):drag&&drag.moved?B.P.find(c=>c.id==drag.id):null;
 for(const v of VU){const nm=`${TI[v.card.t]} ${tx(v.card.name)} ⚔${v.card.p}`;if(v.side=='E'){pill(v.x,v.y-v.fh/2-12*SC-(NAV[v.card.t]?0:6),(v.slot==3?(lang=='ko'?'예비 · ':'Rsv · '):'')+nm,'rgba(30,30,30,.85)','#fff')}else pill(v.x,v.y+slotH()/2-9,nm,'rgba(160,30,20,.9)','#fff',9.5)}
 if(c)for(let i=0;i<3;i++){const e=B.E[i];if(!e)continue;const m=mult(c,e);if(m==1)continue;const p=slotPos(i,'E'),v=VU.find(v=>v.side=='E'&&v.slot==i);pill(p.x,p.y+(v?v.fh/2:20)+14,m>1?L('good'):L('bad'),m>1?'rgba(40,130,40,.92)':'rgba(170,40,30,.92)','#fff',11)}}
function waves(){x.strokeStyle='rgba(40,60,70,.25)';x.lineWidth=1.2;for(let i=0;i<40;i++){const px=((i*97)%W+TM*12)%W,py=(i*53)%FH;x.beginPath();x.arc(px,py,6,Math.PI*1.1,Math.PI*1.9);x.stroke()}}
function drawIntro(){const k=Math.min(1,introT/1.6),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,m=menuView(),d0=W/m.s,lerp=(a,b)=>a+(b-a)*e;const v=mview(lerp(m.lon,B.lon),lerp(m.lat,B.lat),lerp(d0,7),CH*.3);drawMap(v);
 const p=pj(v,B.lon,B.lat);if(introT>1.5){const t=introT-1.5,c=Math.min(1,t/.6),s=SC;
  for(const [side,dir] of [['P',-1],['E',1]]){const px=p[0]+dir*(70-50*c),py=p[1]+dir*-(30-20*c);for(let i=0;i<6;i++)drawSoldier(px+(i%3-1)*9*s,py+((i/3|0)-.5)*9*s,'inf',side,i,0);drawStd(px,py+12*s,side,side=='P'?B.pc:B.ec)}
  x.font='26px system-ui';x.textAlign='center';x.globalAlpha=c;x.fillText('⚔️',p[0],p[1]-14);x.globalAlpha=1;marker(p[0],p[1]+16,B.num,1,introT,0)}
 else marker(p[0],p[1]-(1-k)*30,B.num,1,0,0);
 x.fillStyle='rgba(251,247,234,.94)';rr(W/2-140,10,280,30,10);x.fill();x.strokeStyle='#2b2b2b';x.lineWidth=1.5;x.stroke();x.fillStyle='#1f1f1f';x.font='bold 15px serif';x.textAlign='center';x.fillText(`${tx(B.name)} · ${tx(B.year)}`,W/2,30)}
function draw(){x.setTransform(D,0,0,D,0,0);
 if(scr=='boot'||scr=='menu'||scr=='dex'||!B){drawMenuMap();return}
 if(scr=='intro'){drawIntro();return}
 x.save();if(shake>0)x.translate(rnd(-shake,shake),rnd(-shake,shake));x.drawImage(fieldBG(),0,0,W,FH);
 if(B.naval)waves();if(scr=='deploy')drawSlots();
 drawChains();for(const v of VU.slice().sort((a,b)=>a.y-b.y))drawV(v);drawParts();if(scr=='duel')drawDuel();if(scr=='fight'&&ph=='sim')tugBars();if(scr=='deploy')drawLabels();x.restore()}
function upd(dt){shake=Math.max(0,shake-dt*22);updParts(dt);if(scr=='intro')introT+=dt;if(scr=='duel'&&DU&&DU.anim)DU.at=(DU.at||0)+dt;if(scr=='fight')updFight(dt)}
function startLoop(){if(loopOn)return;loopOn=true;lastF=now();requestAnimationFrame(loop)}
function loop(t){const dt=Math.min(.05,Math.max(0,(t-lastF)/1000));lastF=t;TM+=dt;try{upd(dt);draw();tutPos()}catch(e){console.error(e)}requestAnimationFrame(loop)}
rs();setMute();setLang();curRender=rBoot;rBoot();draw();
