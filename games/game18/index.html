  A.classList.add('swap');Bc.classList.add('swap');A.disabled=Bc.disabled=true;snd.flip();$('status').textContent=t('swapMsg');
  A.style.transform=`translate(${rb.left-ra.left}px,${rb.top-ra.top}px)`;Bc.style.transform=`translate(${ra.left-rb.left}px,${ra.top-rb.top}px)`;
  setTimeout(()=>{A.style.transition=Bc.style.transition='none';A.style.transform=Bc.style.transform='';const x=A.dataset.icon;A.dataset.icon=Bc.dataset.icon;Bc.dataset.icon=x;[deck[a],deck[b]]=[deck[b],deck[a]];
    void A.offsetWidth;A.style.transition=Bc.style.transition='';A.classList.remove('swap');Bc.classList.remove('swap');A.disabled=Bc.disabled=false;schedSwap()},stage>6?520:700)}
function flip(i){if(state!=='play'||busy)return;const el=B().children[i];if(!el||!el.classList.contains('back')||el.disabled)return;
  snd.flip();setFace(el,true);el.classList.add('open','pop');setTimeout(()=>el.classList.remove('pop'),350);open.push(i);
  if(open.length<2)return;const [a,b]=open,A=B().children[a],Bc=B().children[b];
  if(A.dataset.icon===Bc.dataset.icon){combo++;const pts=100*combo+stage*20;score+=pts;left=Math.min(maxT,left+2);snd.match();
    [A,Bc].forEach(c=>{c.classList.remove('open');c.classList.add('match','pop')});fx(Bc,'+'+pts+(combo>1?' x'+combo:''));if(combo>2){fx(A,'COMBO x'+combo,'#7dffb2');}
    $('status').textContent=combo>1?('🔥 COMBO x'+combo):'👍 +2s';matched++;open=[];hud();if(matched>=pairs)clearStage()}
  else{busy=true;combo=0;lives--;left=Math.max(0,left-3);snd.miss();[A,Bc].forEach(c=>c.classList.add('bad'));B().classList.add('shake');fx(Bc,'-3s ❤️-1','#ff5d7a');$('status').textContent='💥 -1 ❤️';hud();
    setTimeout(()=>{B().classList.remove('shake');[A,Bc].forEach(c=>{c.classList.remove('bad','open');setFace(c,false)});open=[];busy=false;if(lives<=0)gameOver()},520)}}
function clearStage(){state='clear';clearTimeout(swapT);const bonus=Math.ceil(left)*10;score+=bonus;hud();banner(t('stageClear',{s:stage+1}));$('status').textContent='⏱ +'+bonus;snd.match();setTimeout(()=>snd.match(),150);stage++;if(lives<3&&stage%2===0)lives++;setTimeout(startStage,FAST?100:450)}
function tick(){if(state!=='play'){lastT=performance.now();return}const now=performance.now();left-=(now-lastT)/1000;lastT=now;if(left<=0){left=0;lives--;combo=0;snd.miss();banner(t('timeout'));hud();if(lives<=0)gameOver();else{state='wait';setTimeout(startStage,900)}}else hud()}
function gameOver(){if(state==='over')return;state='over';clearTimeout(swapT);newRec=false;if(score>save.best){save.best=score;newRec=true}if(stage+1>save.bestStage){save.bestStage=stage+1;newRec=true}persist();
  $('overTitle').textContent=t('over');$('near').textContent=t('overSub',{s:stage+1,p:score});$('overSub').textContent=(newRec?t('newBest')+' ':'')+t('bestLine',{s:save.bestStage,p:save.best});$('bestVal').textContent=String(save.best);show('overScr')}
function start(){snd.init();stage=0;score=0;lives=3;combo=0;show(null);clearInterval(timer);timer=setInterval(tick,100);startStage()}
$('goBtn').onclick=start;$('againBtn').onclick=start;
window.addEventListener('resize',()=>requestAnimationFrame(sizeFaces));
$('langBtn').onclick=()=>{lang=lang==='ko'?'en':'ko';try{localStorage.setItem(LANG_KEY,lang)}catch(e){}applyLang()};
$('muteBtn').onclick=()=>{snd.init();snd.setMute(!snd.muted);applyLang();if(!snd.muted)snd.flip()};
applyLang();
window.__tootPairMatch=Object.freeze({snapshot:()=>({state,stage:stage+1,cards:deck.length,score,lives,combo,left,deck:deck.slice(),best:save.best,bestStage:save.bestStage,audio:{state:snd.ac?snd.ac.state:'none',music:snd.musicOn,muted:snd.muted}}),forceOver:()=>gameOver(),flip:(i)=>flip(i)});
})();
</script>
