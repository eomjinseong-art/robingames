 ['사마귀 / Chinese mantis','Luc Viatour','CC BY-SA 3.0','https://commons.wikimedia.org/wiki/File:Tenodera_sinensis_5_Luc_Viatour.jpg'],
 ['물방개 / Great diving beetle','David Perez (DPC)','CC BY 3.0','https://commons.wikimedia.org/wiki/File:Dytiscus_marginalis_01_by-dpc.jpg'],
 ['무당벌레 / Seven-spot ladybird','André Karwath (Aka)','CC BY-SA 2.5','https://commons.wikimedia.org/wiki/File:Coccinella_septempunctata_couple_(aka).jpg'],
 ['쇠똥구리 / Sacred scarab','Sarefo','CC BY-SA 3.0','https://commons.wikimedia.org/wiki/File:Scarabaeus.sacer.jpg']
];

let lang='ko';try{lang=localStorage.getItem(LANG_KEY)||((navigator.language||'en').toLowerCase().startsWith('ko')?'ko':'en')}catch(e){}
const L=()=>lang==='ko'?0:1, t=(k,v={})=>String(T[k][L()]).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
let save={unlocked:[0],wins:0,losses:0,doctor:false};try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){};save.unlocked=[...new Set([0,...(save.unlocked||[])])];
let state='title', mode='solo', round=0, roundWins=0, roundLosses=0, playerBug=bugs[0], rivalBug=bugs[1], targetBug=bugs[1], quizTimer=0, quizBonus=1, roundEnd=0, gauge=.5, gaugeDir=1, perfect=0, playerForce=0, rivalForce=0, lastFrame=0, feedbackTimer=0, audioOn=true, nextAiPush=0;
const stage=$('stage'), canvas=$('art'), ctx=canvas.getContext('2d'), titleArt=$('titleArt').getContext('2d'), quizArt=$('quizArt').getContext('2d'), resultArt=$('resultArt').getContext('2d');
bugs.forEach(b=>{b.img=new Image();b.img.decoding='async';b.img.onload=()=>{draw();drawTitle();renderBook()};b.img.src=b.photo});
const TUNE=[{zone:1,speed:1,ai:.28,push:.52,interval:4300},{zone:.78,speed:1.16,ai:.54,push:.94,interval:2900},{zone:.58,speed:1.34,ai:.68,push:1.14,interval:2250},{zone:.42,speed:1.55,ai:.84,push:1.38,interval:1750}];
const leagueIndex=()=>Math.min(3,Math.floor(save.wins/3)), tune=()=>TUNE[leagueIndex()];
const show=id=>document.querySelectorAll('.overlay').forEach(e=>e.classList.toggle('show',e.id===id));
function saveData(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>{if(T[e.dataset.i18n])e.textContent=t(e.dataset.i18n)});$('langBtn').textContent=lang==='ko'?'🌐 EN':'🌐 한';$('roundTxt').textContent=round?t('round',{n:round}):'';renderBook();}
function resize(){const d=Math.min(2,devicePixelRatio||1),r=stage.getBoundingClientRect();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);for(const c of [titleArt,quizArt]){const el=c.canvas,rr=el.parentElement.getBoundingClientRect();el.width=Math.round(rr.width*d);el.height=Math.round(rr.height*d);c.setTransform(d,0,0,d,0,0)}draw();drawTitle();}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):(c.rect(x,y,w,h));}
function ellipse(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2)}
function line(c,pts,color,w=2){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.strokeStyle=color;c.lineWidth=w;c.lineCap='round';c.stroke()}
function drawBug(c,b,x,y,s,flip=1,sil=false){const w=94*s,h=78*s;c.save();c.translate(x,y);c.scale(flip,1);c.beginPath();c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);c.clip();if(b.img&&b.img.complete&&b.img.naturalWidth){c.filter=sil?'brightness(0) grayscale(1)':'none';const ar=b.img.naturalWidth/b.img.naturalHeight,box=w/h;let dw=w,dh=h;if(ar>box)dw=h*ar;else dh=w/ar;c.drawImage(b.img,-dw/2,-dh/2,dw,dh)}else{c.fillStyle=sil?'#17352a':b.color;c.fill()}c.restore();c.save();c.translate(x,y);c.scale(flip,1);c.strokeStyle='#18352a';c.lineWidth=4;c.beginPath();c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);c.stroke();c.restore();}
function drawStump(c,w,h){const cx=w/2,cy=h*.45,r=Math.min(w*.37,h*.27);c.save();c.translate(cx,cy);c.fillStyle='#8c552f';c.strokeStyle='#18352a';c.lineWidth=5;ellipse(c,0,0,r,r*.58);c.fill();c.stroke();c.fillStyle='#b87943';ellipse(c,0,-3,r*.9,r*.48);c.fill();c.strokeStyle='#6b3e27';c.lineWidth=2;for(let i=0;i<5;i++){c.beginPath();c.ellipse(0,0,r*(.2+i*.14),r*(.12+i*.07),i*.5,0,Math.PI*2);c.stroke()}c.restore();return {cx,cy,r}}
function draw(){const r=stage.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);const stump=drawStump(ctx,w,h);if(state==='title')return;const gap=stump.r*.42, pp=stump.cx-gap+playerForce*stump.r*.7, op=stump.cx+gap-rivalForce*stump.r*.7;drawBug(ctx,playerBug,pp,stump.cy,Math.min(1.7,stump.r/75),1,false);drawBug(ctx,rivalBug,op,stump.cy,Math.min(1.7,stump.r/75),-1,false);if(state==='play'){ctx.fillStyle='#fff';ctx.font='900 15px Jua, sans-serif';ctx.textAlign='center';ctx.fillText(lang==='ko'?'나':'ME',pp,stump.cy+stump.r*.55);ctx.fillText(lang==='ko'?'상대':'RIVAL',op,stump.cy+stump.r*.55)}}
function drawTitle(){const c=titleArt,w=c.canvas.width/(devicePixelRatio||1),h=c.canvas.height/(devicePixelRatio||1);c.clearRect(0,0,w,h);c.fillStyle='#bdf0b1';c.fillRect(0,0,w,h);drawBug(c,bugs[0],w*.37,h*.58,1.15);drawBug(c,bugs[8],w*.68,h*.58,.9,-1);}
function drawQuiz(b){const c=quizArt,w=c.canvas.width/(devicePixelRatio||1),h=c.canvas.height/(devicePixelRatio||1);c.clearRect(0,0,w,h);quizArt.canvas.style.filter='brightness(0) grayscale(1)';drawBug(c,b,w/2,h*.58,1.55)}
function leagueFor(){if(save.wins>=9)return t('boss');if(save.wins>=6)return t('league3');if(save.wins>=3)return t('league2');return t('league')}
function updateHud(){ $('leagueTxt').textContent=leagueFor();$('roundTxt').textContent=round?t('round',{n:round}):''; }
function feedback(msg,ms=1300){const e=$('feedbackMsg');e.textContent=msg;e.classList.add('show');clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>e.classList.remove('show'),ms)}
function chooseRival(){const base=Math.min(10,save.wins+round-1),idx=base>=9?3:base%Math.min(3,bugs.length-1)+1;return bugs[idx]}
function startGame(m){mode=m;round=0;roundWins=0;roundLosses=0;playerForce=0;rivalForce=0;state='quiz';showQuiz();}
function showQuiz(){round++;targetBug=chooseRival();quizBonus=1;updateHud();$('quizChoices').innerHTML='';const picks=[targetBug];while(picks.length<3){const b=bugs[Math.floor(Math.random()*bugs.length)];if(!picks.includes(b))picks.push(b)}picks.sort(()=>Math.random()-.5);drawQuiz(targetBug);picks.forEach(b=>{const btn=document.createElement('button');btn.className='quiz-choice';btn.textContent=lang==='ko'?b.ko:b.en;btn.addEventListener('click',()=>answerQuiz(b===targetBug));$('quizChoices').appendChild(btn)});show('quizScr');clearTimeout(quizTimer);quizTimer=setTimeout(()=>answerQuiz(false),2800)}
function answerQuiz(correct){clearTimeout(quizTimer);quizBonus=correct?1.2:1;if(correct)feedback(t('good'),900);else feedback(t('behind'),900);startRound()}
function startRound(){rivalBug=targetBug;playerForce=0;rivalForce=0;perfect=0;gauge=.5;gaugeDir=1;nextAiPush=performance.now()+tune().interval;quizArt.canvas.style.filter='none';roundEnd=performance.now()+ROUND_MS;state='play';stage.classList.add('playing');$('quizHint').style.display='block';$('quizHint').textContent=t('go');$('powerBtn').disabled=false;$('powerBtn2').disabled=false;show(null);updateHud();setTimeout(()=>{$('quizHint').style.display='none'},900);}
function hitPower(seat=0){if(state!=='play')return;const b=seat===0?playerBug:rivalBug,zone=seat===0?getZone(playerBug):getZone(rivalBug),p=gauge,good=p>=zone[0]&&p<=zone[1],center=(zone[0]+zone[1])/2,perfectHit=good&&Math.abs(p-center)<(zone[1]-zone[0])*.18;if(seat===0){if(good){playerForce+=b.push*quizBonus*(perfectHit?1.18:1);feedback(perfectHit?t('good'):t('push'),700);perfect=perfectHit?perfect+1:0;if(perfect>=3){playerForce+=.78;perfect=0;feedback(t('mega'),1100)}}else{playerForce=Math.max(-.25,playerForce-.22);perfect=0;feedback(t('miss'),700)}}else if(good)rivalForce+=b.push*(perfectHit?1.12:1);const btn=seat===0?$('powerBtn'):$('powerBtn2');btn.classList.add('pressed');setTimeout(()=>btn.classList.remove('pressed'),150);if(playerForce>=1.35||rivalForce>=1.35)endRound(playerForce>rivalForce?0:1)}
function getZone(b){const width=Math.max(.035,Math.min(.28,b.zone*tune().zone));return[.5-width/2,.5+width/2]}
function aiPush(){if(mode==='mp'||state!=='play')return;const z=tune(),chance=Math.min(.94,z.ai+(rivalBug.speed-1)*.08),success=Math.random()<chance;rivalForce+=rivalBug.push*z.push*(success?1:.16);feedback(t('counter'),500);if(rivalForce>=1.35)endRound(1)}
function endRound(winner){if(state!=='play')return;state='result';$('powerBtn').disabled=true;$('powerBtn2').disabled=true;if(winner===0)roundWins++;else if(winner===1)roundLosses++;else{if(playerForce>=rivalForce)roundWins++;else roundLosses++}save.wins+=winner===0?1:0;save.losses+=winner===1?1:0;if(winner===0&&!save.unlocked.includes(rivalBug===bugs[0]?0:bugs.indexOf(rivalBug))){save.unlocked.push(bugs.indexOf(rivalBug));saveData()}else saveData();const win=winner===0;feedback(win?t('win'):t('lose'),1500);showResult(win);}
function showResult(win){$('resultIcon').textContent=win?'💨':'↩';$('resultTitle').textContent=win?t('win'):t('lose');$('resultScore').textContent=t('score',{w:roundWins,l:roundLosses});const b=rivalBug;resultArt.canvas.width=140;resultArt.canvas.height=96;resultArt.setTransform(1,0,0,1,0,0);resultArt.clearRect(0,0,140,96);drawBug(resultArt,b,70,48,1.05);$('resultCard').innerHTML=`<b>${lang==='ko'?b.ko:b.en}</b><br>${lang==='ko'?b.size+' · '+b.habKo:b.size+' · '+b.habEn}<br>${lang==='ko'?b.factKo:b.factEn}`;show('resultScr');const done=roundWins>=2||roundLosses>=2||round>=MAX_ROUNDS;if(done){$('nextBtn').textContent=lang==='ko'?'결과 보기':'See result';$('nextBtn').onclick=finishMatch}else{$('nextBtn').textContent=t('next');$('nextBtn').onclick=()=>showQuiz()}clearTimeout(quizTimer);quizTimer=setTimeout(()=>{if(state==='result'){if(done)finishMatch();else showQuiz()}},1200)}
function finishMatch(){state='over';$('overIcon').textContent=roundWins>roundLosses?'🏆':'🪵';$('overTitle').textContent=roundWins>roundLosses?t('win'):t('lose');$('overScore').textContent=t('score',{w:roundWins,l:roundLosses});$('overSub').textContent=roundWins>roundLosses?t('found'):t('behind');show('overScr');renderBook()}
function renderBook(){const g=$('bookGrid');if(!g)return;const cg=$('creditList');if(cg)cg.innerHTML=PHOTO_CREDITS.map(c=>`<div><a href="${c[3]}" target="_blank" rel="noreferrer">${c[0]}</a> — ${c[1]}, ${c[2]}.</div>`).join('');g.innerHTML='';bugs.forEach((b,i)=>{const on=save.unlocked.includes(i),slot=document.createElement('div');slot.className='book-slot'+(on?' unlocked':'');slot.innerHTML=`<canvas width="140" height="106"></canvas><b>${on?(lang==='ko'?b.ko:b.en):'???'}</b>${on?`<span>${b.size}<br>${lang==='ko'?b.habKo:b.habEn}<br>${lang==='ko'?b.factKo:b.factEn}</span>`:'<span>LOCKED</span>'}`;g.appendChild(slot);if(on){const cc=slot.querySelector('canvas').getContext('2d');cc.setTransform(1,0,0,1,0,0);cc.clearRect(0,0,140,106);drawBug(cc,b,70,55,1.7)}});$('doctorTitle').style.display=save.unlocked.length===bugs.length?'block':'none';}
function openBook(){renderBook();show('bookScr')}
function tick(now){const dt=Math.min(80,now-(lastFrame||now));lastFrame=now;if(state==='play'){gauge+=gaugeDir*dt*.00075*(playerBug.speed||1)*tune().speed;if(now>=nextAiPush) { aiPush(); nextAiPush=now+tune().interval*(.82+Math.random()*.36); }if(gauge>1){gauge=1;gaugeDir=-1}if(gauge<0){gauge=0;gaugeDir=1}const z=getZone(playerBug);$('powerZone').style.left=(z[0]*100)+'%';$('powerZone').style.width=((z[1]-z[0])*100)+'%';$('powerCursor').style.left=(gauge*100)+'%';if(now>=roundEnd)endRound(playerForce>rivalForce?0:1);draw()}requestAnimationFrame(tick)}
function bindButton(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn()});el.addEventListener('contextmenu',e=>e.preventDefault())}
bindButton($('powerBtn'),()=>hitPower(0));bindButton($('powerBtn2'),()=>hitPower(1));$('startBtn').addEventListener('click',()=>startGame('solo'));$('mpBtn').addEventListener('click',()=>{startGame('mp');stage.classList.add('mp')});$('bookBtn').addEventListener('click',openBook);$('overBookBtn').addEventListener('click',openBook);$('bookClose').addEventListener('click',()=>show(state==='over'?'overScr':'titleScr'));$('againBtn').addEventListener('click',()=>{stage.classList.remove('mp');startGame(mode)});$('quizSkip').addEventListener('click',()=>answerQuiz(false));$('langBtn').addEventListener('click',()=>{lang=lang==='ko'?'en':'ko';try{localStorage.setItem(LANG_KEY,lang)}catch(e){}applyLang();draw()});$('soundBtn').addEventListener('click',()=>{$('soundBtn').textContent=audioOn?'×':'♪';audioOn=!audioOn});
window.addEventListener('resize',resize);applyLang();resize();requestAnimationFrame(tick);
window.__tootBugSumo=Object.freeze({get state(){return state},snapshot:()=>({state,mode,round,roundWins,roundLosses,player:playerBug.id,rival:rivalBug.id,unlocked:save.unlocked.slice(),imagesLoaded:bugs.filter(b=>b.img&&b.img.complete&&b.img.naturalWidth).length,timeLeftMs:state==='play'?Math.max(0,roundEnd-performance.now()):0})});
})();
</script>
