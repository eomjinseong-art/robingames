function cpuThink(c){const sk=cpuSk();c.think=sk.think*rnd(.8,1.2);const home=G.nests[c.i];let T=null;

 const hh=G.hatch.length?`<div class="hatch">${G.hatch.map((h,k)=>`<div class="hx" style="--d:${k*.15}s"><div class="eg"></div><div class="cr" style="filter:drop-shadow(0 0 ${h.cr.r>=2?10:0}px ${RAR[h.cr.r][2]})">${h.cr.e}</div><div class="nm"><span style="color:${RAR[h.cr.r][2]}">${tx(RAR[h.cr.r])}${h.isNew?' NEW':''}</span><br>${tx(h.cr.n)}</div></div>`).join('')}</div>`:`<p class="sub">🥚 ${Z('둥지에 달걀을 넣으면 부화 알을 받아요!','Bank eggs to get eggs to hatch!')}</p>`;
 return `<h2>${ttl}</h2><div class="sc">${sc}</div>${hh}<div class="row">${BTN('next','▶ '+Z('다음 라운드','Next round'),'big')}${BTN('title',Z('메뉴','Menu'))}</div>${TAPC(Z('탭 한 번이면 바로 다음 라운드!','One tap: next round!'))}`}
function dexPanel(){const ec=eqCr();show(()=>`<h2>📚 ${Z('부화 도감','Hatch Dex')} ${Object.keys(SV.dex).length}/${CR.length}</h2><p class="sub">${Z('특별한 친구를 눌러 장착하면 능력이 생겨요','Tap a special friend to equip its perk')}</p>
 <div class="dex">${CR.map(c=>{const has=SV.dex[c.id]>0;return `<button class="cell ${has?'':'no'} ${ec&&ec.id==c.id?'on':''}" ${has&&c.p?`data-a="eq" data-v="${c.id}"`:''}><div class="e">${has?c.e:'❓'}</div><div>${has?tx(c.n):'???'}</div><div style="color:${RAR[c.r][2]}">${tx(RAR[c.r])}${has?' ×'+SV.dex[c.id]:''}</div>${c.p?`<div>${c.p.map(p=>tx(PERK[p])).join(' · ')}</div>`:''}</button>`}).join('')}</div>
 <div class="row">${BTN('title','◀ '+Z('돌아가기','Back'),'big')}</div>`,null)}
let HT=0;function hud(){const h=$('hud');if(G.mode=='title'||!G.chars.length){h.innerHTML=`<span>🥚 ${Z('달걀 도둑','Egg Snatch')}</span>`;return}
 h.innerHTML=`<span class="tm" style="color:${G.time<=5?'#ff8a8a':'#fff'}">⏱ ${Math.ceil(G.time)}</span><span class="rd">R${G.round}${G.map.e}</span>`+G.chars.map(c=>`<span class="ch"><span class="dt" style="background:${CH[c.i].c}"></span>${c.score}</span>`).join('')}
// ---------- input ----------
function ptrSlot(e){if(!G.p2)return 0;const r=cv.getBoundingClientRect();return e.clientX-r.left<r.width/2?0:1}
function setPtr(slot,e){const r=cv.getBoundingClientRect();const w=s2w(e.clientX-r.left,e.clientY-r.top);const p=G.ptr[slot];p.x=w.x;p.y=w.y}
cv.addEventListener('pointerdown',e=>{initAudio();const s=ptrSlot(e);G.pmap[e.pointerId]=s;G.ptr[s].on=true;setPtr(s,e);e.preventDefault()});
cv.addEventListener('pointermove',e=>{let s=G.pmap[e.pointerId];if(s==null&&e.pointerType=='mouse'&&!G.p2){s=0;G.ptr[0].on=true}if(s==null)return;setPtr(s,e)});
const up=e=>{const s=G.pmap[e.pointerId];if(s==null)return;delete G.pmap[e.pointerId];if(e.pointerType!='mouse'||G.p2)G.ptr[s].on=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code=='Space'||e.code=='Enter'){if(OVC&&!$('ov').classList.contains('hide')&&performance.now()-OVT>OVG){initAudio();OVC()}return}G.keys[e.code]=true;if(G.mode=='play')G.ptr[0].on=G.p2?G.ptr[0].on:false});
addEventListener('keyup',e=>{G.keys[e.code]=false});
$('mute').onclick=()=>{initAudio();setMute(!MUTE)};
$('lang').onclick=()=>{LANG=LANG=='ko'?'en':'ko';localStorage.eggLang=LANG;applyLang();if(RENDER){$('ov').innerHTML='<div class="panel">'+RENDER()+'</div>'}hud()};
function applyLang(){$('lang').textContent=LANG=='ko'?'EN':'한국어';$('home').textContent='🏠 '+Z('홈','Home');$('ttl').textContent='🥚 '+Z('나두 달걀 도둑','Nadoo Egg Snatch');document.documentElement.lang=LANG}
// ---------- loop ----------
let LT=0;function loop(ts){const dt=Math.min(.05,(ts-(LT||ts))/1000);LT=ts;if(G.mode=='play'){update(dt);updFx(dt)}else if(G.mode=='end')updFx(dt);
 if(ts-HT>100&&G.mode!='title'){HT=ts;hud()}draw();requestAnimationFrame(loop)}
resize();applyLang();setMute(MUTE);title();requestAnimationFrame(loop);
window.__egg={get G(){return G},w2s,newRound,endRound};
</script></body></html>
