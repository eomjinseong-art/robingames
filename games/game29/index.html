 if(B.event)B.event(S);
 for(const u of S.units){if(u.st!='wait')continue;

  else if(S.t>=(B.eResT||3.5)){let l=B.eResLane;if(l==null){let best=1e9;for(let i=0;i<3;i++){const e=fighters(S,'E',i).reduce((a,v)=>a+v.hp,0),p=fighters(S,'P',i).reduce((a,v)=>a+v.hp,0);if(!p)continue;const r=e/p;if(r<best){best=r;l=i}}if(l==null)l=1}enter(S,u,l)}}

 const dmg=new Map();
 for(let l=0;l<3;l++){const Ps=fighters(S,'P',l),Es=fighters(S,'E',l);
  if(Ps.length&&Es.length){for(const [A,D] of [[Ps,Es],[Es,Ps]]){const tot=D.reduce((a,v)=>a+v.hp,0);for(const a of A){const tg=D.reduce((m,v)=>v.hp>m.hp?v:m);let k=a.p*mult(a,tg)*(a.flank?1.5:1)*(B.kmod?B.kmod(S,a,tg):1)*(.45+.55*a.hp/a.max)*a.fx*RATE*dt;for(const d of D)dmg.set(d,(dmg.get(d)||0)+k*d.hp/tot)}}}
  else for(const u of Ps.concat(Es)){u.st='free';u.free=0}}
 for(const [u,d] of dmg){u.hp=Math.max(0,u.hp-d);if(u.hp<.15*u.max){u.st='rout';emit(S,'rout',{u})}}
 const pf=frac(S,'P'),ef=frac(S,'E');
 const pa=S.units.some(u=>u.side=='P'&&act(u)),ea=S.units.some(u=>u.side=='E'&&act(u)&&u.st!='wait')||S.units.some(u=>u.side=='E'&&u.st=='wait');
 let w=null;if(!ea)w=true;else if(!pa)w=false;else if(ef<.28&&pf>ef)w=true;else if(pf<.28&&ef>pf)w=false;else if(S.t>=TMAX)w=pf>ef;

  if(ph!='march'){const want=u.hp<=0?0:Math.max(1,Math.ceil(v.n*u.hp/u.max));while(v.shown>want){v.shown--;fallen(v)}}
  if(u.st=='fight'&&ph=='sim'){const opp=VU.filter(o=>o.side!=v.side&&!o.routed&&o.u&&o.u.st=='fight'&&o.u.lane==u.lane);if(opp.length){const fx=v.x+rnd(-slotW()/3,slotW()/3),fy=v.y-s*v.fh/2;
   if(Math.random()<dt*6)P({k:'spark',x:fx,y:fy,vx:rnd(-90,90),vy:rnd(-90,90),l:0,L:.25});if(Math.random()<dt*3)dust(fx,fy,1,B.naval?'rgba(255,255,255,':null);
   if(TM-clangT>.14){clangT=TM;sfx('clang')}
   if(v.card.t=='arc'||v.card.t=='fire'||v.card.t=='heavy'&&B.naval){v.at-=dt;if(v.at<0){v.at=v.card.t=='heavy'?.6:.28;const o=opp[Math.random()*opp.length|0];P({k:'arrow',x0:v.x+rnd(-15,15),y0:v.y,x1:o.x+rnd(-20,20),y1:o.y+rnd(-8,8),x:v.x,y:v.y,h:rnd(18,34),l:0,L:.55,fire:v.card.t=='fire'})}}}}}}
function tugBars(){for(let l=0;l<3;l++){let p=0,e=0;for(const u of S.units){if(u.st!='fight'||u.lane!=l)continue;if(u.side=='P')p+=u.hp;else e+=u.hp}if(!p||!e)continue;const w=Math.min(64,slotW()*.6),bx=laneX(l)-w/2,by=MID-3;x.fillStyle='rgba(0,0,0,.45)';rr(bx-2,by-2,w+4,9,4);x.fill();x.fillStyle=TEAM.E.m;x.fillRect(bx,by,w,5);x.fillStyle=TEAM.P.m;x.fillRect(bx,by,w*p/(p+e),5)}}
// --- result & quiz
function showResult(){scr='result';intense=0;const w=S.win,st=w?stars(S):0;RES={w,st,show:[],nw:[]};
 if(w){if(st>prog[bi])prog[bi]=st;const gs=[B.gen[0]];if(st==3)gs.push(B.gen[1]);for(const g of gs){RES.show.push(g);if(!dex.includes(g)){dex.push(g);RES.nw.push(g)}}save();for(let i=0;i<st;i++)setTimeout(()=>sfx('star'),350+i*300)}
 RES.why=w?[]:whyLost();curRender=rResult;rResult()}
function whyLost(){const r=[];for(let i=0;i<3;i++){const c=B.P.find(c=>c.id==dep[i]),e=B.E[i];if(c&&e&&mult(c,e)<1)r.push(`<b>${L('lanes')[i]}</b>: ${tx(WEAK[cls(c.t)])}`)}
 if(S.ev.some(e=>e.k=='flank'&&e.u.side=='E'))r.push(L('whyFlank'));if(!r.length)r.push(L('whyStrong'));return r.slice(0,3)}
function rResult(){const r=RES;let h;
 if(r.w){h=`<div class="panel"><h2>${L('win')}</h2><div class="stars">${[0,1,2].map(i=>`<span class="${i<r.st?'':'off'}" style="animation-delay:${.3+i*.3}s">★</span>`).join('')}</div>`+
  (r.st==3?`<div class="hist"><b>${L('keyT')}</b><p>${tx(B.keyMsg)}</p></div>`:`<div class="hist"><b>${L('keyMiss')}</b><p>${tx(B.hint)}</p></div>`)+
  `<div class="sub" style="margin-top:6px">${L('newGen')}</div>`+r.show.map(g=>gcard(g,r.nw.includes(g))).join('')+`<div class="cont">${L('contN')}</div></div>`;ov(h,showReal,500,1)}
 else{h=`<div class="panel"><h2>${L('lose')}</h2><h2 style="font-size:17px">${L('whyT')}</h2>${r.why.map(t=>`<div class="why">${t}</div>`).join('')}<div class="hist"><b>${L('hintT')}</b><p>${tx(B.hint)}</p></div><div class="row"><button class="btn" id="smB">${L('seeMatch')}</button><button class="btn red" id="rdB">${L('retry').split('→').pop().trim()}</button></div></div>`;ov(h,()=>toDeploy(),450,1);$('smB').onclick=e=>{e.stopPropagation();sfx('click');showMatch()};$('rdB').onclick=e=>{e.stopPropagation();sfx('click');toDeploy()}}}
function showReal(){scr='real';curRender=rReal;rReal()}
function rReal(){ov(`<div class="panel"><h2>${L('realT')}</h2><div class="pic" style="font-size:36px">${B.real.p}</div><div class="stx">${tx(B.real.t)}</div><div class="row"><button class="btn red" id="qzB">${L('toQuiz').split('→').pop().trim()}</button></div></div>`,startQuiz,400,1);$('qzB').onclick=e=>{e.stopPropagation();sfx('click');startQuiz()}}
function startQuiz(){scr='quiz';const n=bi==0?2:3;QZ=shuffle(B.quiz.slice()).slice(0,n).map(q=>({q:q.q,opts:shuffle(q.a.map((o,i)=>({o,ok:i==0})))}));qi=0;qok=0;renderQ()}
function renderQ(){curRender=renderQ;qAns=-1;const q=QZ[qi];ov(`<div class="panel nocont"><div class="sub">${L('quiz')} ${qi+1} / ${QZ.length}</div><p class="qq">${tx(q.q)}</p><div class="qopts">${q.opts.map((o,i)=>`<button class="btn" data-q="${i}">${tx(o.o)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`,null,0,1);
 $('ov').querySelectorAll('[data-q]').forEach(b=>b.onclick=e=>{e.stopPropagation();answer(+b.dataset.q)})}
function answer(i){if(qAns>=0)return;qAns=i;const q=QZ[qi],ok=q.opts[i].ok,bs=$('ov').querySelectorAll('[data-q]');q.opts.forEach((o,j)=>{if(o.ok)bs[j].classList.add('ok');else if(j==i)bs[j].classList.add('no');bs[j].disabled=true;bs[j].style.opacity=1});
 const cor=q.opts.find(o=>o.ok);$('fb').innerHTML=ok?`<span style="color:#2e7d22">${L('right')}</span>`:`<span style="color:#a32">${L('wrong')}</span> <span style="font-size:16px">${tx(cor.o)}</span>`;
 sfx(ok?'right':'wrong');if(ok)qok++;setTimeout(()=>{qi++;if(qi<QZ.length)renderQ();else quizDone()},ok?1100:2200)}
function quizDone(){scr='done';curRender=rDone;sfx('win');rDone()}
function rDone(){const last=bi>=4;let h=`<div class="panel"><h2>${last?L('allDone'):L('qDone')}</h2><p style="text-align:center;font-size:17px">${L('score')}: <b>${qok} / ${QZ.length}</b></p>`+(last?`<p class="sub">${L('dex')} ${dex.length}/10</p>`:'')+
 `<div class="row">${last?'':`<button class="btn" id="dnN" style="background:linear-gradient(#d9483b,#9b1d12);color:#fff">${L('next')}</button>`}<button class="btn" id="dnA">${L('again')}</button><button class="btn" id="dnM">${L('map')}</button></div><div class="cont">${L('contN')}</div></div>`;
 ov(h,()=>last?showMenu():startBattle(bi+1),500,1);if(!last)$('dnN').onclick=()=>{sfx('click');startBattle(bi+1)};$('dnA').onclick=()=>{sfx('click');const d=dep.slice();startBattle(bi);dep=d;scr='intro'};$('dnM').onclick=()=>{sfx('click');showMenu()}}
// --- draw
function drawSlots(){const w=slotW(),h=slotH(),hl=sel||(drag&&drag.moved);
 x.fillStyle='rgba(179,38,30,.06)';x.fillRect(0,MID,W,FH-MID);x.fillStyle='rgba(61,58,160,.06)';x.fillRect(0,0,W,MID);
 x.setLineDash([6,5]);x.strokeStyle='rgba(90,50,20,.45)';x.lineWidth=1.5;x.beginPath();x.moveTo(GX+6,MID);x.lineTo(GX+GW-6,MID);x.stroke();
 for(let s=0;s<6;s++){const p=slotPos(s,'P');x.fillStyle=dep[s]?'rgba(255,248,225,.25)':'rgba(255,248,225,.45)';rr(p.x-w/2,p.y-h/2,w,h,9);x.fill();x.strokeStyle=hl?'#e0a800':'rgba(110,60,20,.65)';x.lineWidth=hl?2.5:1.5;x.stroke();
  x.fillStyle='rgba(80,40,15,.75)';x.font='600 12.5px system-ui';x.textAlign='left';x.fillText(s<3?L('lanes')[s]:L('res'),p.x-w/2+6,p.y-h/2+12);
  if(!dep[s]){x.fillStyle='rgba(110,60,20,.4)';x.font='bold 22px system-ui';x.textAlign='center';x.fillText('+',p.x,p.y+8)}}
 x.setLineDash([])}
function drawLabels(){const c=sel?B.P.find(c=>c.id==sel):drag&&drag.moved?B.P.find(c=>c.id==drag.id):null;
 for(const v of VU){const nm=`${TI[v.card.t]} ${tx(v.card.name)} ⚔${v.card.p}`;if(v.side=='E'){pill(v.x,v.y-v.fh/2-12*SC-(NAV[v.card.t]?0:6),(v.slot==3?(lang=='ko'?'예비 · ':'Rsv · '):'')+nm,'rgba(45,40,120,.88)','#fff')}else pill(v.x,v.y+slotH()/2-9,nm,'rgba(140,25,15,.92)','#fff',11.5)}
 if(c)for(let i=0;i<3;i++){const e=B.E[i];if(!e)continue;const m=mult(c,e);if(m==1)continue;const p=slotPos(i,'E'),v=VU.find(v=>v.side=='E'&&v.slot==i);pill(p.x,p.y+(v?v.fh/2:20)+14,m>1?L('good'):L('bad'),m>1?'rgba(40,130,40,.94)':'rgba(170,40,30,.94)','#fff',13)}}
function waves(){x.strokeStyle='rgba(255,255,255,.22)';x.lineWidth=1.2;for(let i=0;i<40;i++){const px=((i*97)%W+TM*12)%W,py=(i*53)%FH;x.beginPath();x.arc(px,py,6,Math.PI*1.1,Math.PI*1.9);x.stroke()}}
function drawIntro(){const k=Math.min(1,introT/1.6),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,m=menuView(),d0=W/m.s,lerp=(a,b)=>a+(b-a)*e;const v=mview(lerp(m.lon,B.lon),lerp(m.lat,B.lat),lerp(d0,7),CH*.3);drawMap(v);
 const p=pj(v,B.lon,B.lat);if(introT>1.5){const t=introT-1.5,c=Math.min(1,t/.6),s=SC;
  for(const [side,dir] of [['P',-1],['E',1]]){const px=p[0]+dir*(70-50*c),py=p[1]+dir*-(30-20*c);for(let i=0;i<6;i++)drawSoldier(px+(i%3-1)*9*s,py+((i/3|0)-.5)*9*s,'inf',side,i,0);drawStd(px,py+12*s,side,'SPQR')}
  x.font='26px system-ui';x.textAlign='center';x.globalAlpha=c;x.fillText('⚔️',p[0],p[1]-14);x.globalAlpha=1;marker(p[0],p[1]+16,B.num,1,introT,0)}
 else marker(p[0],p[1]-(1-k)*30,B.num,1,0,0);
 x.fillStyle='rgba(251,243,221,.92)';rr(W/2-130,10,260,30,10);x.fill();x.strokeStyle='#8b1e14';x.lineWidth=1.5;x.stroke();x.fillStyle='#7a1810';x.font='bold 15px Georgia,serif';x.textAlign='center';x.fillText(`${tx(B.name)} · ${tx(B.year)}`,W/2,30)}
function draw(){x.setTransform(D,0,0,D,0,0);
 if(scr=='boot'||scr=='menu'||scr=='dex'||!B){drawMenuMap();return}
 if(scr=='intro'){drawIntro();return}
 x.save();if(shake>0)x.translate(rnd(-shake,shake),rnd(-shake,shake));x.drawImage(fieldBG(),0,0,W,FH);
 if(B.terrain=='sea')waves();if(B.terrain=='tiber')drawBridges();if(scr=='deploy')drawSlots();
 for(const v of VU.slice().sort((a,b)=>a.y-b.y))drawV(v);drawParts();if(scr=='fight'&&ph=='sim')tugBars();if(scr=='deploy')drawLabels();x.restore()}
function upd(dt){shake=Math.max(0,shake-dt*22);updParts(dt);if(scr=='intro')introT+=dt;if(scr=='fight')updFight(dt)}
function startLoop(){if(loopOn)return;loopOn=true;lastF=now();requestAnimationFrame(loop)}
function loop(t){const dt=Math.min(.05,Math.max(0,(t-lastF)/1000));lastF=t;TM+=dt;try{upd(dt);draw();tutPos()}catch(e){console.error(e)}requestAnimationFrame(loop)}
rs();setMute();setLang();curRender=rBoot;rBoot();draw();
</script></body></html>
