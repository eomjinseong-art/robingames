function drawEnc(t){const L0=dlayout();drawDragon(E.d,E.P,L0.x,L0.y,L0.s,t,E.P2,'a');
 if(E.d.twin&&G.mode=='enc'&&!E.lock){const an=ANCH['a'+E.active];if(an){cx.strokeStyle=`rgba(255,240,120,${.6+.4*Math.sin(t*6)})`;cx.lineWidth=4;ell(an.head[0],an.head[1],an.r*1.2,an.r*1.05);cx.stroke()}}
 drawHand(W*.04,L0.gy+14,E.handT,t,E.palm);
 const bw=Math.min(W-40,320),bx=(W-bw)/2,by=40;cx.fillStyle='rgba(255,255,255,.92)';rrect(bx,by,bw,22,11);cx.fill();cx.strokeStyle='#5a6aa8';cx.lineWidth=2;cx.stroke();
 const pr=clamp(E.trust/E.d.need,0,1);cx.fillStyle='#ff6a9a';rrect(bx+2,by+2,Math.max(0,(bw-4)*pr),18,9);if(pr>0)cx.fill();txt(`💗 ${T('trust')} ${Math.round(pr*100)}%`,bx+bw/2,by+11,16,'#2a1a3a');
 if(G.mode=='enc'&&!E.lock&&E.tmax<50){const tp=clamp(E.t/E.tmax,0,1);cx.fillStyle='rgba(0,0,0,.25)';rrect(bx,by+26,bw,7,4);cx.fill();cx.fillStyle=tp>.4?'#4ac06a':tp>.2?'#f0b020':'#e04a2a';rrect(bx,by+26,Math.max(1,bw*tp),7,4);cx.fill()}
 hud(`${tx(E.d.n)}${E.d.phases?' · '+T('phase')+' '+E.phase:''}`,'❤️'.repeat(Math.max(0,E.hearts))+'🤍'.repeat(3-Math.max(0,E.hearts)))}
function pressMoment(){G.mode='press';tray(null);fingerOff();E.lock=true;sfx('win');msg('💞 '+T('press'),112);
 for(let i=0;i<12;i++)later(()=>{const an=ANCH.a0;if(an)fx({k:'heart',x:an.head[0]+rnd(-40,40),y:an.head[1]+rnd(-20,20),vy:-60,vx:rnd(-20,20),sz:26})},i*120);
 later(()=>{msg('');show(`<h2>💞 ${T('press')}</h2><p>${T('pressT')}</p><div class="row">${B(T('flyGo'),flyIntro,'big')}</div>`,{low:1,cont:flyIntro,guard:700})},2200)}
// --- flight
function flyIntro(){hideOv();G.mode='flyI';msg('');hud(null);show(`<h2>${T('flyT')}</h2><div class="pic">🐉✨⭐</div><p>${T('flyH')}</p><div class="row">${B(T('flyGo'),flyStart,'big')}${B(T('skip'),()=>{hideOv();learn(0)})}</div>`,{cont:flyStart})}
function flyStart(){hideOv();G.mode='fly';F={t:0,dur:10,y:H*.45,vy:0,hold:false,st:[],got:0,sp:0,cl:[]};for(let i=0;i<6;i++)F.cl.push({x:rnd(0,W),y:rnd(40,H-80),s:rnd(.6,1.4)})}
function flyUpdate(dt){F.t+=dt;F.vy+=(F.hold?-950:720)*dt;F.vy=clamp(F.vy,-360,380);F.y+=F.vy*dt;if(F.y<70){F.y=70;F.vy=0}if(F.y>H-60){F.y=H-60;F.vy=0}
 F.sp-=dt;if(F.sp<=0&&F.t<F.dur-1){F.sp=.32;const base=H*.5+Math.sin(F.t*1.3)*H*.3;F.st.push({x:W+20,y:clamp(base,90,H-80),big:Math.random()<.12})}
 for(const s of F.st){s.x-=230*dt;if(!s.got&&Math.hypot(s.x-W*.3,s.y-F.y)<38){s.got=1;F.got+=s.big?3:1;sfx('star');for(let i=0;i<5;i++)fx({k:'spark',x:s.x,y:s.y,vx:rnd(-80,80),vy:rnd(-120,0),c:'#ffe27a'})}}F.st=F.st.filter(s=>s.x>-30&&!s.got);
 for(const c of F.cl){c.x-=60*c.s*dt;if(c.x<-80){c.x=W+80;c.y=rnd(40,H-80)}}if(Math.random()<dt*2.5)sfx('flap');
 hud(`⭐ ${T('stars')} ${F.got}`,`⏱️ ${Math.max(0,Math.ceil(F.dur-F.t))}`);if(F.t>=F.dur){G.mode='flyE';F.hold=false;sfx('win');later(()=>{hud(null);show(`<h2>${T('flyDone')}</h2><div class="pic">⭐ × ${F.got}</div><div class="row">${B(T('next'),()=>{hideOv();learn(F.got)},'big')}</div>`,{cont:()=>{hideOv();learn(F.got)}})},500)}}
function drawFly(t){const d=curD();const sky={cliff:['#ffb8a0','#fff1c8'],swamp:['#7fb59a','#d8ecc8'],meadow:['#7fc8ff','#eaf8ff'],storm:['#3a4a8a','#9aa8d8'],ice:['#4a8fc0','#e0f6ff'],peaks:['#4a3a8a','#ffb38a'],volcano:['#6a1a1a','#ff9a4a']}[d.bg];
 cx.fillStyle=lg(0,H,sky);cx.fillRect(0,0,W,H);hills(H*.86,20,.01,t*.4,'rgba(255,255,255,.35)');
 for(const c of F.cl){cx.fillStyle='rgba(255,255,255,.85)';ell(c.x,c.y,40*c.s,15*c.s);cx.fill();ell(c.x+18*c.s,c.y-8*c.s,24*c.s,14*c.s);cx.fill()}
 for(const s of F.st)txt(s.big?'🌟':'⭐',s.x,s.y,s.big?34:26);
 const P=moodPose('happy',1);P.wings=.5+.5*Math.sin(t*10);P.noShadow=1;let P2=null;if(d.twin){P2=moodPose('happy',1);P.body=Object.assign(moodPose('happy',1),{wings:P.wings})}
 const rot=clamp(F.vy/900,-.35,.35);cx.save();cx.translate(W*.3,F.y+30);cx.rotate(rot);drawDragon(d,P,0,0,d.kind=='king'?80:95,t,P2,'f');cx.restore();
 cx.save();cx.translate(W*.3,F.y+30);cx.rotate(rot);cx.fillStyle='#ffd2b0';ell(0,-58,10,10);cx.fill();cx.fillStyle='#ff6a3a';cx.beginPath();cx.arc(0,-60,11,Math.PI,0);cx.fill();cx.fillStyle='#4a7adf';rrect(-8,-50,16,16,5);cx.fill();cx.restore();
 const tp=1-F.t/F.dur;cx.fillStyle='rgba(255,255,255,.8)';rrect(20,40,W-40,8,4);cx.fill();cx.fillStyle='#ffb02a';rrect(20,40,Math.max(1,(W-40)*tp),8,4);cx.fill()}
// --- learn / quiz / result
function learn(stars){G.mode='learn';G.flyStars=stars;tray(null);hud(null);msg('');const d=curD();const ms=[...new Set(d.moods)];
 show(`<h2>${T('learnT')}</h2><p>${tx(d.learn)}</p>${ms.map(m=>`<div class="mood"><span class="e">${MOODS[m].e}</span><span>${tx(MOODS[m].cue)} → ${ACTS[MOODS[m].act].e} ${tx(ACTS[MOODS[m].act].n)}</span></div>`).join('')}<div class="row srow">${B(T('next'),quiz,'big')}</div>`,{cont:quiz,guard:800})}
function quiz(){G.mode='quiz';const d=curD();G.qs=shuf(d.quiz).slice(0,3);G.qi=0;G.qok=0;G.ans=0;askQ()}
function askQ(){const q=G.qs[G.qi],ko=L=='ko';const opts=shuf([0,1,2]);
 show(`<h2>❓ ${T('quiz')} ${G.qi+1}/3</h2><p style="font-size:19px;font-weight:500">${ko?q[0]:q[1]}</p><div class="qopts">${opts.map(o=>`<button class="btn" data-o="${o}">${ko?q[2+o*2]:q[3+o*2]}</button>`).join('')}</div><div class="fb" id="fb"></div><div class="row" id="qn"></div>`,{guard:300});
 ov.querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>{if(G.ans)return;G.ans=1;const o=+el.dataset.o,ok=o===0;ov.querySelectorAll('[data-o]').forEach(e=>{e.disabled=e!==el&&+e.dataset.o!==0;if(+e.dataset.o===0)e.classList.add('ok')});if(!ok)el.classList.add('no');
  if(ok){G.qok++;sfx('good')}else sfx('bad');$('fb').innerHTML=(ok?`<b>⭕ ${T('right')}</b><br>`:`<b>❌ ${T('wrong')} ${ko?q[2]:q[3]}</b><br>`)+`💡 ${ko?q[8]:q[9]}`;
  const nx=()=>{G.ans=0;G.qi++;if(G.qi<3)askQ();else result()};$('qn').innerHTML=B(T('next'),nx,'big');contFn=nx;contAt=now()+700;ov.querySelector('.panel').insertAdjacentHTML('beforeend',`<div class="cont">${T('contN')}</div>`)})}
function result(){const d=curD();const h=E?E.hearts:1;const st=h>=3?3:h>=2?2:1;const nw=!SV.done[d.id];SV.done[d.id]=Math.max(SV.done[d.id]||0,st);if(G.di==0){SV.tut=true;G.tut=false}save();sfx('win');G.mode='menu';
 const nd=DR[G.di+1];const all=DR.every(x=>SV.done[x.id]);
 show(`<h1>${T('tamed').replace('{d}',L=='ko'?josa(tx(d.n)):tx(d.n))}</h1><div class="stars">${[0,1,2].map(i=>i<st?'★':'<span class="off">★</span>').join('')}</div><p class="sub">${T('score')} ${G.qok}/3 · ⭐ ${G.flyStars||0}</p>${nw?`<div class="tip">${T('newCard')}</div>`:''}
 <div class="dc"><img src="${portrait(d)}" alt=""><div class="n">${tx(d.n)}</div><div class="t">${T('pers')}: ${tx(d.pers)}</div></div>${all?`<p class="sub">${T('allDone')}</p>`:''}
 <div class="row">${nd?B(`${tx(nd.n)} ▶`,()=>startEnc(G.di+1),'big'):''}${B(T('menu'),menu,nd?'':'big')}${B(T('retry'),()=>startEnc(G.di))}</div>`,{cont:menu,guard:900})}
function unlocked(i){return i==0||!!SV.done[DR[i-1].id]}
function menu(){G.tok++;G.mode='menu';E=null;F=null;tray(null);hud(null);msg('');fingerOff();G.reshow=menu;
 show(`<h2>${T('choose')}</h2><div class="blist">${DR.map((d,i)=>{const u=unlocked(i),s=SV.done[d.id]||0;return B(`<img src="${portrait(d,!u)}" alt="" style="width:64px;height:54px;object-fit:contain"><span><span class="n">${u?tx(d.n):'???'}</span><br><span class="d">${u?'📍 '+tx(d.pl):T('locked')}</span></span><span class="s">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span>`,u?()=>startEnc(i):()=>sfx('bad'),'bb')}).join('')}</div>
 <div class="row srow">${B(T('dex'),dexPanel)}${B(T('glos'),glossary)}${B(T('tut'),()=>{SV.tut=false;save();startEnc(0)})}</div>`)}
function dexPanel(){G.reshow=dexPanel;const cards=DR.map(d=>SV.done[d.id]?`<div class="dc"><img src="${portrait(d)}" alt=""><div class="n">${tx(d.n)}</div><div class="t">📍 ${tx(d.pl)}<br>${tx(d.pers)}</div></div>`:`<div class="dc lk"><img src="${portrait(d,1)}" alt=""><div class="n">${T('dexEmpty')}</div></div>`);
 show(`<h2>${T('dex')}</h2><div class="dexg">${cards.join('')}</div><div class="row srow">${B(T('close'),menu,'big')}</div>`)}
let ov2=null;function glossary(){if(ov2)return closeGl();ov2=document.createElement('div');ov2.id='ov2';ov2.style.cssText='position:fixed;left:0;right:0;top:52px;bottom:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(20,26,44,.5)';
 ov2.innerHTML=`<div class="panel"><h2>${T('glos')}</h2>${ACT_ORDER.map(a=>{const m=Object.keys(MOODS).find(k=>MOODS[k].act==a);return `<div class="mood"><span class="e">${MOODS[m].e}</span><span><b style="font-size:18px">${tx(MOODS[m].n)}</b><br>👀 ${tx(MOODS[m].cue)}<br>→ ${ACTS[a].e} ${tx(ACTS[a].n)}</span></div>`}).join('')}<div class="row srow"><button class="btn big" id="glX">${T('close')}</button></div></div>`;
 document.body.appendChild(ov2);$('glX').onclick=()=>{sfx('tap');closeGl()}}
function closeGl(){if(ov2){ov2.remove();ov2=null}}
function title(){G.mode='title';G.reshow=title;show(`<h1>${T('t')}</h1><img class="dpic" src="${portrait(DR[0])}" alt=""><p class="sub">${T('sub')}</p><p class="sub">${T('sub2')}</p><div class="row">${B(T('start'),menu,'big')}</div>`,{cont:menu,guard:300})}
// ===== loop & input =====
let last=0,started=false,VT=0;const TP=Object.assign({},POSE0);
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(started)VT+=dt;const t=VT;const paused=!!ov2||!ov.classList.contains('hide');
 if(G.mode=='fly'||G.mode=='flyE'){if(started&&!paused&&G.mode=='fly')flyUpdate(dt);drawFly(t)}
 else{const d=(E&&E.d)||DR[G.di];drawScene(d.bg,t,started?dt:0);
  if(E&&(G.mode=='enc'||G.mode=='press'||G.mode=='intro')){if(started&&!paused)encUpdate(dt);drawEnc(t)}
  else if(G.mode!='learn'&&G.mode!='quiz'||true){stepPose(TP,moodPose('happy',.7),dt);const L0=dlayout();let P2=null;if(d.twin){P2=Object.assign({},TP);TP.body=Object.assign({},POSE0)}else delete TP.body;drawDragon(d,TP,L0.x,L0.y,L0.s,t,P2,'m')}}
 drawFX(started?dt:0);if(started)bgmTick();requestAnimationFrame(loop)}
function setHold(v){if(F&&G.mode=='fly')F.hold=v}
cv.addEventListener('pointerdown',e=>{initAudio();started=true;if(ov2||!ov.classList.contains('hide'))return;setHold(true)});
addEventListener('pointerup',()=>setHold(false));addEventListener('pointercancel',()=>setHold(false));
addEventListener('pointerdown',()=>{initAudio();started=true},true);
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=6&&G.mode=='enc'&&E){if(n<=E.d.acts&&!e.repeat)choose(ACT_ORDER[n-1]);return}
 if(e.code!='Space'&&e.code!='Enter')return;e.preventDefault();initAudio();started=true;if(e.repeat)return;if(ov2){closeGl();return}if(!ov.classList.contains('hide')){tryCont();return}setHold(true)});
addEventListener('keyup',e=>{if(e.code=='Space'||e.code=='Enter')setHold(false)});
$('mute').onclick=()=>{initAudio();setMute(!muted)};$('glB').onclick=()=>{initAudio();sfx('tap');glossary()};
function applyLang(){document.documentElement.lang=L;$('lang').textContent=L=='ko'?'EN':'한국어';$('home').textContent=T('home');$('ttl').textContent=T('t');if(G.reshow&&!ov.classList.contains('hide'))G.reshow();
 if(G.mode=='enc'&&E){document.querySelectorAll('.act').forEach(b=>{const a=b.dataset.a;b.innerHTML=`<span class="e">${ACTS[a].e}</span>${tx(ACTS[a].n)}`});if(!E.lock){prompt();hint()}}}
$('lang').onclick=()=>{L=L=='ko'?'en':'ko';localStorage.setItem('dtLang',L);sfx('tap');if(ov2){closeGl();glossary()}applyLang()};
setMute(muted);applyLang();title();requestAnimationFrame(loop);
</script></body></html>
