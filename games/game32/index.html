 ov2.innerHTML=`<div class="panel"><h2>${T('glos')}</h2>${GLOS.map(g=>`<div class="gl"><span class="e">${g[0]}</span><span><b style="font-size:18px">${tx(g[1])}</b><br>${tx(g[2])}</span></div>`).join('')}<div class="row" style="position:sticky;bottom:-16px;background:#f7e6c6;padding:8px 0"><button class="btn big" id="glX">${T('close')}</button></div></div>`;
 document.body.appendChild(ov2);$('glX').onclick=()=>{sfx('tap');closeGl()}}
function closeGl(){if(ov2){ov2.remove();ov2=null}}
function title(){G.mode='title';G.reshow=title;show(`<h1>${T('t')}</h1><div class="pic">🍞🥐🥖</div><p class="sub">${T('sub')}</p><p class="sub">${T('sub2')}</p><div class="row">${B('▶ '+(L=='ko'?'시작하기':'Start'),menu,'big')}</div>`,{cont:menu,guard:300})}
// ===== loop & input =====
let last=0,started=false;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;const t=ts/1000;const paused=!!ov2||!ov.classList.contains('hide');
 if(started&&!paused){if(G.cur){G.cur.update(dt);if(G.cur)G.vis=G.cur}if(G.mode=='rush'&&R)rushUpdate(dt)}
 drawBG(t);if(G.vis&&G.mode=='step')G.vis.draw(t);if((G.mode=='rush'||G.mode=='rushE')&&R)drawRush(t);
 if(G.mode=='title'||G.mode=='menu'){drawBread('crois',W*.25,H*.6,40,.7);drawBread('shik',W*.5,H*.58,46,.68);drawBread('bag',W*.78,H*.62,40,.72)}
 drawFX(started&&!paused?dt:0);if(started)bgmTick();requestAnimationFrame(loop)}
function pos(e){return [e.clientX,e.clientY-52]}
cv.addEventListener('pointerdown',e=>{initAudio();started=true;if(ov2||!ov.classList.contains('hide'))return;const [x,y]=pos(e);if(G.mode=='rush')rushTap(x,y);else if(G.cur&&G.cur.down)G.cur.down(x,y)});
cv.addEventListener('pointermove',e=>{if(G.cur&&G.cur.move){const [x,y]=pos(e);G.cur.move(x,y)}});
addEventListener('pointerup',()=>{if(G.cur&&G.cur.up)G.cur.up();if(G.cur===STEP.measure)G.cur.release()});
addEventListener('pointercancel',()=>{if(G.cur===STEP.measure)G.cur.release()});
addEventListener('pointerdown',()=>{initAudio();started=true},true);
addEventListener('keydown',e=>{if(e.code!='Space'&&e.code!='Enter')return;e.preventDefault();initAudio();started=true;if(e.repeat)return;
 if(ov2){closeGl();return}if(!ov.classList.contains('hide')){tryCont();return}if(G.cur&&G.cur.key)G.cur.key(true)});
addEventListener('keyup',e=>{if(e.code!='Space'&&e.code!='Enter')return;if(G.cur&&G.cur.key&&(G.cur===STEP.measure||G.cur===STEP.proof))G.cur.key(false)});
$('mute').onclick=()=>{initAudio();setMute(!muted)};$('glB').onclick=()=>{initAudio();sfx('tap');glossary()};
function applyLang(){document.documentElement.lang=L;$('lang').textContent=L=='ko'?'EN':'한국어';$('home').textContent=T('home');$('ttl').textContent=T('t');if(G.reshow&&!ov.classList.contains('hide'))G.reshow()}
$('lang').onclick=()=>{L=L=='ko'?'en':'ko';localStorage.setItem('nbLang',L);sfx('tap');if(ov2){closeGl();glossary()}applyLang()};
setMute(muted);applyLang();title();requestAnimationFrame(loop);
</script></body></html>
