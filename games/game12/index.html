  const rivalUnits = started ? STAR[tl][1] * (tl === 'en' ? 5 : 1) * el / 60 : 0;
  $('rival').style.left = (6 + Math.min(1, rivalUnits / trackLen()) * w) + 'px';
  $('sTime').textContent = Math.ceil(timeLeft);
  $('sSpeed').textContent = speed(); $('sAcc').textContent = acc() + '%';
}
function endRace() {
  state = 'over'; snd.stopMusic(); inp.blur(); $('pauseBtn').style.visibility = 'hidden';
  const s = speed(), a = acc(), st = STAR[tl], stars = (s >= st[0] ? 1 : 0) + (s >= st[1] ? 1 : 0) + (s >= st[2] ? 1 : 0);
  const key = tl === 'ko' ? 'bestKo' : 'bestEn', nb = s > store[key]; if (nb) { store[key] = s; save(); }
  $('overEmoji').textContent = stars >= 2 ? '🏆' : stars ? '🐷' : '💩';
  $('overTitle').textContent = t('r' + stars);
  $('overStars').innerHTML = [0, 1, 2].map(i => '<i class="' + (i < stars ? '' : 'off') + '">⭐</i>').join('');
  $('overScore').textContent = s + (tl === 'ko' ? (lang === 'ko' ? '타' : ' kpm') : ' WPM');
  $('overStats').textContent = t(tl === 'ko' ? 'statsKo' : 'statsEn', { s, a, n: lines });
  $('overNew').style.display = nb && s > 0 ? '' : 'none'; $('overNew').textContent = t('newBest');
  $('overBest').textContent = stars < 3 ? t('nextStar', { n: st[stars] - s }) : bestLine();
  stars >= 2 ? snd.fanfare() : stars ? (ding(), snd.fart(0.4)) : snd.sad();
  show('overScr');
}

/* ===== 편지 ===== */
const ltxt = $('ltxt');
let lineDinged = false;
function startLetter() {
  mode = 'letter'; state = 'letter'; $('game').classList.remove('on'); $('letter').classList.add('on'); show(null);
  ltxt.className = 'tw' + (tl === 'ko' ? ' ko' : ''); ltxt.placeholder = t('letterPh');
  $('pauseBtn').style.visibility = 'hidden';
  ltxt.focus(); snd.startMusic();
}
ltxt.addEventListener('input', e => {
  const br = e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph';
  if (br) { ding(); zip(); lineDinged = false; return; }
  clack(e.inputType && e.inputType.startsWith('delete'));
  const v = ltxt.value, ln = v.slice(v.lastIndexOf('\n') + 1).length, cols = Math.floor((ltxt.clientWidth - 40) / 11);
  if (!lineDinged && ln >= cols - 4) { lineDinged = true; ding(); } if (ln < cols - 6) lineDinged = false;
});
async function savePng() {
  const text = ltxt.value.trim(); if (!text) { toast(t('empty')); return; }
  try { await Promise.all([document.fonts.load('46px "Special Elite"'), document.fonts.load('bold 46px "Nanum Gothic Coding"')]); } catch (e) {}
  const W = 1080, H = 1440, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  // 낡은 종이
  x.fillStyle = '#f1dfb8'; x.fillRect(0, 0, W, H);
  let g = x.createRadialGradient(W / 2, H * 0.42, 200, W / 2, H / 2, 900); g.addColorStop(0, 'rgba(255,248,228,.7)'); g.addColorStop(1, 'rgba(150,105,45,.45)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) { x.fillStyle = 'rgba(' + (90 + Math.random() * 60 | 0) + ',60,20,' + (Math.random() * 0.12).toFixed(3) + ')'; const r = Math.random() * 2.2; x.fillRect(Math.random() * W, Math.random() * H, r, r); }
  x.strokeStyle = 'rgba(120,80,30,.12)'; x.lineWidth = 3; x.beginPath(); x.moveTo(0, H / 2 + 6); x.lineTo(W, H / 2 - 6); x.stroke();
  x.strokeStyle = 'rgba(130,80,30,.18)'; x.lineWidth = 14; x.beginPath(); x.arc(W * 0.84, H * 0.24, 70, 0.3, Math.PI * 1.85); x.stroke(); // 커피 자국
  // 글자 (잉크 번짐·흔들림)
  const fam = tl === 'ko' ? 'bold 44px "Nanum Gothic Coding", "Special Elite", monospace' : '46px "Special Elite", "Nanum Gothic Coding", monospace';
  x.font = fam; x.textBaseline = 'alphabetic';
  const L = 110, R = W - 110, LH = 66; let cx = L, cy = 210;
  const d = new Date(); x.fillStyle = 'rgba(40,32,28,.8)'; x.textAlign = 'right'; x.fillText(d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.', R, 140); x.textAlign = 'left';
  const toks = text.match(/\n|[^\s]+|[ \t]+/g) || [];
  const chars = [];
  for (const tk of toks) {
    if (tk === '\n') { chars.push('\n'); continue; }
    const tw = x.measureText(tk).width;
    if (tk.trim() && tw <= R - L) { chars.push({ wrap: tw }); }
    for (const ch of tk) chars.push(ch);
  }
  for (const ch of chars) {
    if (ch === '\n') { cx = L; cy += LH; continue; }
    if (typeof ch === 'object') { if (cx + ch.wrap > R && cx > L) { cx = L; cy += LH; } continue; }
    const w = x.measureText(ch).width;
    if (cx + w > R) { cx = L; cy += LH; if (ch === ' ') continue; }
    if (cx === L && ch === ' ') continue;
    if (cy > H - 230) break;
    const a = 0.72 + Math.random() * 0.28;
    x.fillStyle = 'rgba(30,24,20,' + a.toFixed(2) + ')';
    x.fillText(ch, cx + (Math.random() - 0.5) * 1.6, cy + (Math.random() - 0.5) * 2.4);
    if (Math.random() < 0.18) { x.fillStyle = 'rgba(30,24,20,.25)'; x.fillText(ch, cx + 0.9, cy + 0.6); }
    if (Math.random() < 0.025) { x.save(); x.filter = 'blur(4px)'; x.fillStyle = 'rgba(30,24,20,.3)'; x.fillText(ch, cx + 4, cy + 3); x.restore(); }
    cx += w;
  }
  // 도장 '나두'
  x.save(); x.translate(W - 220, H - 200); x.rotate(-0.2); x.globalAlpha = 0.82;
  x.strokeStyle = '#c8202a'; x.fillStyle = '#c8202a'; x.lineWidth = 9; x.beginPath(); x.arc(0, 0, 92, 0, Math.PI * 2); x.stroke(); x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 76, 0, Math.PI * 2); x.stroke();
  x.font = 'bold 64px "Nanum Gothic Coding", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('나두', 0, 4);
  x.globalCompositeOperation = 'destination-out'; for (let i = 0; i < 260; i++) { x.globalAlpha = Math.random() * 0.8; x.fillRect((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, Math.random() * 4, Math.random() * 4); }
  x.restore();
  x.fillStyle = 'rgba(80,55,30,.55)'; x.font = '26px "Special Elite", monospace'; x.textAlign = 'left'; x.fillText('Toot Typewriter · nadoo games', L, H - 70);
  lastPng = { w: W, h: H, chars: text.length };
  c.toBlob(b => { if (!b) return; const u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = 'nadoo-letter.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); toast(t('saved')); snd.fart(0.3); ding(); }, 'image/png');
}
let lastPng = null;
$('saveBtn').addEventListener('click', ui(() => savePng()));
$('clearBtn').addEventListener('click', ui(() => { ltxt.value = ''; zip(); ltxt.focus(); }));
$('lMenuBtn').addEventListener('click', ui(() => toTitle()));

/* ===== 공통 ===== */
function bestLine() { return t('best', { k: store.bestKo, e: store.bestEn }); }
function pause() { if (mode !== 'race' || state !== 'play') return; state = 'pause'; snd.stopMusic(); inp.blur(); show('pauseScr'); $('pauseBtn').textContent = '▶️'; }
function resume() { if (state !== 'pause') return; state = 'play'; show(null); $('pauseBtn').textContent = '⏸️'; last = performance.now(); if (started) snd.startMusic(); inp.focus(); }
function toTitle() { state = 'title'; snd.stopMusic(); inp.blur(); ltxt.blur(); $('game').classList.remove('on'); $('letter').classList.remove('on'); show('titleScr'); $('pauseBtn').textContent = '⏸️'; $('pauseBtn').style.visibility = 'hidden'; applyLang(); }
function loop(now) { const dt = Math.min(100, now - (last || now)); last = now; step(dt); requestAnimationFrame(loop); }
document.querySelectorAll('[data-tl]').forEach(b => b.addEventListener('click', ui(() => { tl = b.dataset.tl; store.tl = tl; save(); clack(); renderTl(); })));
function renderTl() { document.querySelectorAll('[data-tl]').forEach(b => b.classList.toggle('sel', b.dataset.tl === tl)); }
$('raceBtn').addEventListener('click', ui(() => startRace()));
$('letterBtn').addEventListener('click', ui(() => startLetter()));
$('againBtn').addEventListener('click', ui(() => startRace()));
$('menuBtn').addEventListener('click', ui(() => toTitle()));
$('resumeBtn').addEventListener('click', ui(() => resume()));
$('quitBtn').addEventListener('click', ui(() => toTitle()));
const homeBtn = $('homeBtn'); uiTap(homeBtn, () => { location.href = homeBtn.href; });
uiTap($('pauseBtn'), () => { state === 'pause' ? resume() : pause(); });
uiTap($('muteBtn'), () => { snd.init(); snd.setMute(!snd.muted); updateMuteBtn(); if (!snd.muted) snd.fart(0.2); });
uiTap($('langBtn'), () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} applyLang(); snd.init(); snd.boing(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
function applyLang() {
  applyLangBase(); $('bestTxt').textContent = bestLine(); ltxt.placeholder = t('letterPh');
  $('sSpeedL').textContent = tl === 'ko' ? t('spdKo') : t('spdEn');
}

/* ===== 읽기 전용 상태 (쇼츠 자동화용) ===== */
const snapshot = () => ({
  state, lang, mode, typeLang: tl, timeLeft: +timeLeft.toFixed(2), started, sentence: target, typed: judged, composing,
  marks: marks.map(m => m === 1 ? 1 : m ? 0 : null), correct: okChars, typos: badChars, lines, speed: speed(), speedUnit: tl === 'ko' ? 'keys/min' : 'WPM', accuracy: acc(),
  progress: +meX.toFixed(3), stars: STAR[tl].filter(s => speed() >= s).length, best: { ko: store.bestKo, en: store.bestEn },
  letterChars: ltxt.value.length, lastPng,
  audio: { state: snd.ac ? snd.ac.state : 'none', music: snd.musicOn, muted: snd.muted },
});
window.__toottype = Object.freeze({ snapshot });

renderTl(); applyLang(); updateMuteBtn(); show('titleScr'); $('pauseBtn').style.visibility = 'hidden';
requestAnimationFrame(loop);
})();
</script>
