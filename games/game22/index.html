// seagulls (sparse, after a gentle start)

for(const b of birds){b.x-=(sp+70)*dt;b.y+=b.vy*dt;b.ph+=dt*12;if(!b.hit&&Math.hypot(b.x-pl.x,b.y-pl.y)<24){b.hit=1;vy=260;combo=0;heat=Math.min(100,heat+15);shake=8;sfx(200,.2,'square');pop('💥','#fff');burst(b.x,b.y,'#ddd',12)}}

}
// drawing
