<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뿡뿡 숲 지키기 / Toot Forest Guard - 나두Ai</title>
<script src="/counter.js" defer></script>
<style>
html,body{margin:0;height:100%;background:#03140c;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
.top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;justify-content:space-between;z-index:2}
.btn{background:rgba(10,50,30,.78);color:#cfe;border:1px solid #6f9a;border-radius:12px;padding:7px 11px;font-size:15px;text-decoration:none;cursor:pointer}
.brand{position:fixed;bottom:6px;right:10px;color:#9fc8;font-size:12px;z-index:2}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><a class="btn" href="/" id="home">🏠 홈</a><span><button class="btn" id="lang">EN</button> <button class="btn" id="mute">🔊</button></span></div>
<div class="brand">나두Ai</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let W,H,D,GROUND;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);GROUND=H*.8}
let lang=localStorage.getItem('g25lang')||((navigator.language||'ko').startsWith('ko')?'ko':'en');
const T={ko:{t:'뿡뿡 숲 지키기',s:'톡! 해서 시작',h:'로봇을 직접 조준해서 맞혀요! 헛방은 손해',go:'숲이 쓰러졌어요',r:'탭 / Space / Enter 로 다시',wv:'스테이지',miss:'헛방!',heat:'과열!',clr:'클리어!',go2:'탭/Space 로 시작',pc:'PC: 마우스/방향키 조준 · 클릭/Space 발사',best:'최고',home:'🏠 홈',combo:'콤보',burst:'정령 폭발!',sc:'점수'},
en:{t:'Toot Forest Guard',s:'Tap to start',h:'Aim at robots yourself! Misses cost you',go:'The forest fell',r:'Tap / Space / Enter to retry',wv:'Stage',miss:'Miss!',heat:'Overheat!',clr:'Clear!',go2:'Tap / Space to go',pc:'PC: aim mouse/arrows · click/Space fire',best:'Best',home:'🏠 Home',combo:'Combo',burst:'Spirit Burst!',sc:'Score'}};
function L(k){return T[lang][k]}
function setLang(){document.getElementById('lang').textContent=lang=='ko'?'EN':'한';document.getElementById('home').textContent=L('home');document.title=T.ko.t+' / '+T.en.t+' - 나두Ai'}
document.getElementById('lang').onclick=e=>{e.stopPropagation();lang=lang=='ko'?'en':'ko';localStorage.setItem('g25lang',lang);setLang()};
// ---- audio: self-made addictive loop ----
let ac,mg,muted=localStorage.getItem('g25mute')=='1',bgmOn=false,nextBeat=0,beatN=0;
const SC=[220,246.9,277.2,329.6,370,440,493.9,554.4,659.3];
const RIFF=[0,2,4,2,5,4,2,1,0,2,4,5,7,5,4,2];const BASS=[55,55,73.4,65.4];
function au(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=muted?0:.5;mg.connect(ac.destination)}if(ac.state=='suspended')ac.resume()}
function tone(f,t,d,type,v,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,hp){const b=ac.createBuffer(1,ac.sampleRate*d|0,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp||5000;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(mg);s.start(t)}
function bpm(){return 118+Math.min(stage,15)*3}
function sched(){if(!ac||!bgmOn)return;const sp=60/bpm()/2;while(nextBeat<ac.currentTime+.15){const t=nextBeat,n=beatN%16,bar=(beatN>>4)%4;
 if(n%4==0)tone(130,t,.16,'sine',.55,45);
 if(n%8==4)noise(t,.12,.3,1500);
 noise(t,.02,n%2?.05:.1);
 if(n%2==0)tone(BASS[bar]*(n%4==2?2:1),t,.18,'sawtooth',.12);
 const m=RIFF[(n+bar*2)%16];if(n%2==0||bar==3)tone(SC[m]*2,t,.14,'square',.045);
 if(n==0||n==10)tone(SC[(bar*2)%9]*4,t,.35,'triangle',.05);
 nextBeat+=sp;beatN++}}
function sfxZap(c){if(!ac)return;const t=ac.currentTime,k=Math.min(c,16);tone(500+k*40,t,.12,'square',.12,1500+k*60);noise(t,.08,.15,3000)}
function sfxBoom(){if(!ac)return;const t=ac.currentTime;noise(t,.25,.35,400);tone(160,t,.25,'sine',.4,40)}
function sfxHurt(){if(!ac)return;const t=ac.currentTime;tone(180,t,.35,'sawtooth',.25,70);noise(t,.3,.2,800)}
function sfxBurst(){if(!ac)return;const t=ac.currentTime;for(let i=0;i<6;i++)tone(SC[i+2]*2,t+i*.05,.3,'triangle',.18)}
document.getElementById('mute').onclick=e=>{e.stopPropagation();muted=!muted;localStorage.setItem('g25mute',muted?'1':'0');if(mg)mg.gain.value=muted?0:.5;e.target.textContent=muted?'🔇':'🔊'};
document.getElementById('mute').textContent=muted?'🔇':'🔊';
// ---- game ----
let state='title',stage=1,score=0,combo=0,maxCombo=0,hp=5,best=+localStorage.getItem('g25best')||0,bots=[],parts=[],beams=[],pops=[],spawnLeft=0,spawnT=0,need=0,done=0,shake=0,goAt=0,lastHit=0,last=0,en=6,enT=0,heatT=0,clrT=0;
const MAXHP=5,MAXEN=6;let aim={x:0,y:0,on:false},keys={};
function now(){return performance.now()}
const GOAL={ko:['로봇 {n}대를 직접 조준해서 맞혀요!','노란 로봇은 빨라요! {n}대 막기','투구 로봇은 2번 맞혀야 해요 · {n}대','파란 로봇은 맞으면 둘로 쪼개져요 · {n}대','유령 로봇은 선명할 때만 맞아요 · {n}대','빨갛게 깜빡이면 돌진! 먼저 쏴요 · {n}대','모두 섞여요! {n}대를 지켜내요'],
en:['Aim and hit {n} robots yourself!','Yellow bots are fast! Stop {n}','Helmet bots take 2 hits · {n} bots','Blue bots split in two when hit · {n} bots','Ghost bots only take hits when solid · {n}','Red flash = dash! Shoot first · {n} bots','Everything mixed! Hold off {n} bots']};
function goal(){return GOAL[lang][Math.min(stage,7)-1].replace('{n}',need)}
function regenMs(){return Math.min(650,420+stage*25)}
function setupStage(){need=5+stage*2;done=0;spawnLeft=need;bots=[];beams=[];en=MAXEN;heatT=0;state='intro'}
function begin(){state='play';spawnT=now()+300;enT=now()}
function start(){au();if(!aim.on){aim.x=W/2;aim.y=H*.5}stage=1;score=0;combo=0;maxCombo=0;hp=MAXHP;parts=[];pops=[];setupStage();if(!bgmOn){bgmOn=true;nextBeat=ac.currentTime+.05;beatN=0}}
function spawnBot(){const r=Math.random(),w=stage;let type='n';
 const pool=['n'];if(w>=2)pool.push('f');if(w>=3)pool.push('a');if(w>=4)pool.push('s');if(w>=5)pool.push('g');if(w>=6)pool.push('d');
 if(r<.65||w==1)type=w>=7?pool[Math.random()*pool.length|0]:(Math.random()<.5?pool[pool.length-1]:'n');
 if(w==1)type='n';
 const sz=Math.min(W,H)*(w==1?.09:type=='f'?.065:.08);
 const sp=(H*.055+w*H*.009)*(type=='f'?1.6:type=='a'?.8:1)*(.85+Math.random()*.3);
 bots.push({x:sz+Math.random()*(W-2*sz),y:-sz,s:sz,v:sp,hp:type=='a'?2:1,type,ph:Math.random()*6,hit:0,dt:0,dash:0,cnt:1})}
function solid(b,t){return b.type!='g'||Math.sin(t/420+b.ph)>-.2}
function kill(b,i,t){bots.splice(i,1);sfxBoom();
 for(let k=0;k<14;k++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,l:1,c:k%2?'#9f6':'#ccd'});
 if(b.type=='s'){for(let k=-1;k<=1;k+=2)bots.push({x:b.x+k*b.s*.6,y:b.y,s:b.s*.65,v:b.v*1.2,hp:1,type:'m',ph:Math.random()*6,hit:0,dt:0,dash:0,cnt:0})}
 if(b.cnt)done++;
 combo++;maxCombo=Math.max(maxCombo,combo);lastHit=t;
 const pts=10*(1+Math.floor(combo/4));score+=pts;pops.push({x:b.x,y:b.y,s:'+'+pts+(combo>=3?' x'+combo:''),l:1})}
function miss(px,py,label){combo=0;en=Math.max(0,en-1);pops.push({x:px,y:py,s:label||L('miss'),l:.8});if(ac)tone(120,ac.currentTime,.12,'square',.12,80)}
function fire(px,py){const t=now();
 if(t<heatT){pops.push({x:px,y:py,s:L('heat'),l:.5});return}
 if(en<1){heatT=t+900;pops.push({x:px,y:py,s:L('heat'),l:.8});return}
 en--;if(en<=0)heatT=t+900;
 let bi=-1,bd=1e9;for(let i=0;i<bots.length;i++){const b=bots[i],d=Math.hypot(px-b.x,py-b.y);if(d<b.s*.75&&d<bd){bd=d;bi=i}}
 const sp={x:W/2,y:GROUND-H*.1};beams.push({x1:sp.x,y1:sp.y,x2:px,y2:py,l:1});
 if(bi<0){miss(px,py);return}
 const b=bots[bi];if(!solid(b,t)){miss(px,py,'👻');return}
 sfxZap(combo);b.hp--;b.hit=1;if(b.hp<=0)kill(b,bi,t);else{b.y-=b.s*.3;b.helm=0}}
function input(px,py,key){au();const t=now();
 if(state=='title'){start();return}
 if(state=='over'){if(t-goAt>450)start();return}
 if(state=='intro'){begin();return}
 if(state=='play'){if(key){fire(aim.x,aim.y)}else fire(px,py)}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(e.pointerType=='mouse'){aim.x=e.clientX;aim.y=e.clientY;aim.on=true}input(e.clientX,e.clientY,false)});
cv.addEventListener('pointermove',e=>{if(e.pointerType=='mouse'){aim.x=e.clientX;aim.y=e.clientY;aim.on=true}});
addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='Enter'){e.preventDefault();if(!e.repeat)input(0,0,true)}else if(e.code.startsWith('Arrow')){e.preventDefault();keys[e.code]=1;aim.on=true}});
addEventListener('keyup',e=>{keys[e.code]=0});
function drawBot(b,t){const s=b.s;x.save();x.translate(b.x,b.y+Math.sin(t/120+b.ph)*2);
 x.globalAlpha=solid(b,t)?1:.25;x.fillStyle=b.hit>.1?'#fff':b.dt>0&&Math.sin(t/40)>0?'#f44':b.type=='a'?'#8a7f9a':b.type=='f'?'#e8b02a':b.type=='s'||b.type=='m'?'#5aa0c8':b.type=='g'?'#c9b8ff':b.type=='d'?'#c0605a':'#9aa4ad';
 x.strokeStyle='#223';x.lineWidth=3;
 x.beginPath();x.roundRect(-s*.5,-s*.45,s,s*.8,s*.15);x.fill();x.stroke();
 if(b.type=='a'){x.fillStyle='#556';x.fillRect(-s*.55,-s*.55,s*1.1,s*.18);if(b.hp>1){x.fillStyle='#cde';x.fillRect(-s*.4,-s*.25,s*.8,s*.08)}}
 x.fillStyle='#f33';x.shadowColor='#f33';x.shadowBlur=10;x.beginPath();x.arc(-s*.18,-s*.12,s*.1,0,7);x.arc(s*.18,-s*.12,s*.1,0,7);x.fill();x.shadowBlur=0;
 x.fillStyle='#223';x.fillRect(-s*.2,s*.08,s*.4,s*.06);
 x.save();x.translate(0,s*.55);x.rotate(t/60);x.fillStyle='#dde';x.beginPath();for(let k=0;k<12;k++){const a=k*Math.PI/6,r=k%2?s*.22:s*.3;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.stroke();x.restore();
 x.strokeStyle='#223';x.beginPath();x.moveTo(0,-s*.45);x.lineTo(0,-s*.65);x.stroke();x.fillStyle=b.type=='f'?'#ff4':'#f80';x.beginPath();x.arc(0,-s*.68,s*.06,0,7);x.fill();
 x.globalAlpha=1;x.restore();b.hit*=.8}
function drawTree(cx,base,h,t,i){const alive=hp>i;x.save();x.translate(cx,base);
 x.fillStyle=alive?'#4a2e1a':'#3a2a20';x.fillRect(-h*.06,-h*.55,h*.12,h*.55);
 if(alive){x.shadowColor='#7f9';x.shadowBlur=18;for(let k=0;k<3;k++){x.fillStyle=['#1d6b3a','#2a8a48','#3fb060'][k];x.beginPath();x.arc(Math.sin(t/900+k+i)*3,-h*(.6+k*.15),h*(.32-k*.07),0,7);x.fill()}x.shadowBlur=0}
 else{x.fillStyle='#5a3a24';x.beginPath();x.ellipse(0,-h*.55,h*.08,h*.03,0,0,7);x.fill()}
 x.restore()}
let stars=[];for(let i=0;i<60;i++)stars.push({x:Math.random(),y:Math.random()*.5,p:Math.random()*6});
function btxt(s,X,Y,sz,c,mw){x.font=`500 ${sz}px system-ui,sans-serif`;x.textAlign='center';const ws=String(s).split(' '),ls=[];let l='';for(const w of ws){const t=l?l+' '+w:w;if(x.measureText(t).width>mw&&l){ls.push(l);l=w}else l=t}ls.push(l);x.fillStyle=c||'#fff';x.shadowColor='#000';x.shadowBlur=5;ls.forEach((t,i)=>x.fillText(t,X,Y+i*sz*1.4));x.shadowBlur=0;return ls.length}
function txt(s,X,Y,sz,c,gl){x.fillStyle=c||'#fff';x.font=`bold ${sz}px system-ui,sans-serif`;x.textAlign='center';x.shadowColor=gl||'#3f8';x.shadowBlur=10;x.fillText(s,X,Y);x.shadowBlur=0}
function loop(){const t=now(),dt=Math.min(.05,(t-(last||t))/1000);last=t;sched();
 if(state=='clear'&&t>=clrT){stage++;setupStage()}
 if(state=='play'){
  if(spawnLeft>0&&t>=spawnT){spawnBot();spawnLeft--;spawnT=t+Math.max(380,1300-stage*110)*(.6+Math.random()*.6)}
  if(spawnLeft<=0&&bots.length==0){state='clear';clrT=t+700;score+=stage*25;if(hp<MAXHP)hp++;sfxBurst()}
  if(t-enT>=regenMs()){enT=t;if(en<MAXEN)en++}
  if(combo&&t-lastHit>2200)combo=0;
  const as=W*.9*dt;if(keys.ArrowLeft)aim.x-=as;if(keys.ArrowRight)aim.x+=as;if(keys.ArrowUp)aim.y-=as;if(keys.ArrowDown)aim.y+=as;aim.x=Math.max(0,Math.min(W,aim.x));aim.y=Math.max(0,Math.min(GROUND,aim.y));
  for(let i=bots.length-1;i>=0;i--){const b=bots[i];let v=b.v;
   if(b.type=='f')b.x+=Math.sin(t/300+b.ph)*b.s*dt*3;
   if(b.type=='d'){if(!b.dash&&!b.dt&&b.y>H*.25)b.dt=t+700;if(b.dt&&t>=b.dt){b.dt=0;b.dash=1}if(b.dt)v=0;if(b.dash)v*=3.2}
   b.y+=v*dt;b.x=Math.max(b.s/2,Math.min(W-b.s/2,b.x));
   if(b.y>=GROUND-b.s*.6){bots.splice(i,1);if(b.cnt)done++;hp--;combo=0;shake=14;sfxHurt();for(let k=0;k<10;k++)parts.push({x:b.x,y:GROUND-10,vx:(Math.random()-.5)*6,vy:-Math.random()*5,l:1,c:'#a63'});
    if(hp<=0){state='over';goAt=t;if(score>best){best=score;localStorage.setItem('g25best',best)}}}}}
 x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0}
 const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#04122a');gr.addColorStop(.55,'#0a3324');gr.addColorStop(1,'#052014');x.fillStyle=gr;x.fillRect(-20,-20,W+40,H+40);
 for(const s of stars){x.globalAlpha=.3+.4*Math.sin(t/800+s.p);x.fillStyle='#dff';x.fillRect(s.x*W,s.y*H,1.5,1.5)}x.globalAlpha=1;
 // danger line
 x.strokeStyle='rgba(255,90,90,.35)';x.setLineDash([8,8]);x.beginPath();x.moveTo(0,GROUND-H*.02);x.lineTo(W,GROUND-H*.02);x.stroke();x.setLineDash([]);
 x.fillStyle='#0b2a18';x.fillRect(-20,GROUND,W+40,H);
 const th=Math.min(H*.2,W*.3);for(let i=0;i<MAXHP;i++)drawTree(W*(i+.5)/MAXHP,GROUND+H*.08,th*(i%2?.85:1),t,i);
 {const p={x:W/2,y:GROUND-H*.1};x.shadowColor='#bfe';x.shadowBlur=20;x.fillStyle=t<heatT?'#f88':'#e8fff4';x.beginPath();x.arc(p.x,p.y,11,0,7);x.fill();x.fillStyle='#7fd';x.beginPath();x.arc(p.x,p.y,6,0,7);x.fill();x.shadowBlur=0}
 for(const b of bots)drawBot(b,t);
 for(let i=beams.length-1;i>=0;i--){const m=beams[i];x.globalAlpha=m.l;x.strokeStyle='#bfffd8';x.lineWidth=6*m.l;x.shadowColor='#5fd';x.shadowBlur=16;x.beginPath();x.moveTo(m.x1,m.y1);x.lineTo(m.x2,m.y2);x.stroke();x.shadowBlur=0;m.l-=.12;if(m.l<=0)beams.splice(i,1)}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l-=.03;x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5);if(p.l<=0)parts.splice(i,1)}
 for(let i=pops.length-1;i>=0;i--){const p=pops[i];x.globalAlpha=Math.min(1,p.l);txt(p.s,p.x,p.y,p.big?34:18,p.big?'#ffe066':'#fff');p.y-=.8;p.l-=.025;if(p.l<=0)pops.splice(i,1)}
 if(aim.on&&state=='play'){x.strokeStyle='#ff6';x.lineWidth=2;x.beginPath();x.arc(aim.x,aim.y,16,0,7);x.moveTo(aim.x-24,aim.y);x.lineTo(aim.x+24,aim.y);x.moveTo(aim.x,aim.y-24);x.lineTo(aim.x,aim.y+24);x.stroke()}
 x.globalAlpha=1;x.restore();
 txt(L('t'),W/2,82,Math.min(28,W/13));
 if(state=='title'){btxt(L('h'),W/2,H*.32,18,'#e4fff0',W-40);txt(L('s'),W/2,H*.4,26,'#9ff');txt(L('best')+' '+best,W/2,H*.4+32,16,'#cfc');btxt(L('pc'),W/2,H*.4+60,15,'#cfe8da',W-40)}
 else{txt(L('wv')+' '+stage+'  ·  '+score,W/2,110,18,'#dfe');
  if(combo>=3)txt(L('combo')+' x'+combo,W/2,136,18,'#ffd84a','#f80');
  const gw=Math.min(220,W*.55),gx=W/2-gw/2,hot=t<heatT;for(let k=0;k<MAXEN;k++){x.fillStyle=hot?'#f66':k<en?'#7fd':'rgba(255,255,255,.15)';x.fillRect(gx+k*gw/MAXEN+2,148,gw/MAXEN-4,9)}
  txt(done+' / '+need,W/2,180,15,'#cfe');
  if(state=='intro'){x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,W,H);txt(L('wv')+' '+stage,W/2,H*.32,36,'#ffe066','#f80');txt(goal(),W/2,H*.32+40,Math.min(19,W/22),'#fff');txt(L('go2'),W/2,H*.32+76,17,'#9ff')}
  if(state=='clear')txt(L('wv')+' '+stage+' '+L('clr'),W/2,H*.35,34,'#ffe066','#f80')}
 if(state=='over'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);txt(L('go'),W/2,H*.38,34,'#f9a','#f36');txt(L('wv')+' '+stage+' · '+L('sc')+' '+score,W/2,H*.38+42,22);txt(L('combo')+' max x'+maxCombo+'  ·  '+L('best')+' '+best,W/2,H*.38+72,17,'#cfc');txt(L('r'),W/2,H*.38+112,18,'#9ff')}
 requestAnimationFrame(loop)}
addEventListener('resize',rs);rs();setLang();requestAnimationFrame(loop);
window.__g25={get state(){return state},get bots(){return bots},get stage(){return stage},get hp(){return hp},get score(){return score},get en(){return en},input};
</script>
