  cvs.width = Math.round(r.width * dpr);
  cvs.height = Math.round(r.height * dpr);

/* ================== 언어 (KO/EN) ================== */

try { lang = localStorage.getItem(LANG_KEY) || autoLang(); } catch (e) {}

};
const t = (k, v = {}) => T[k][lang === 'ko' ? 0 : 1].replace(/\{(\w)\}/g, (_, x) => v[x]);
const pick = a => a[lang === 'ko' ? 0 : 1];
const FAIL_MSG = [['엉덩이 배터리 방전!', 'Butt battery empty!'], ['방귀 다 썼다… 피식', 'All out of toots… pfft'], ['오늘의 방귀왕은 바로 나!', 'I am the fart king today!'], ['냄새는 남기고 간다~', 'I leave only the smell~'], ['방귀 조절 장인 도전 중', 'Fart control: in training'], ['우주까지 가려면 콩 더 먹자!', 'Eat more beans to reach space!']];

    if (b.y > y + 900) return -1;

}
// 목표 발판(from+1)에 착지하는 게이지 구간 중 가장 넓은 구간
function sweetRange(x, y, dir, from, sup, target) {
  const tgtI = target ? target.i : from + 1;
  let best = null, cur = null;
  for (let k = 0; k <= 50; k++) {
    const g = k / 50;
    const hit = simulate(x, y, dir, from, g, sup, target) === tgtI;
    if (hit) { if (!cur) cur = [g, g]; else cur[1] = g; }
    if ((!hit || k === 50) && cur) { if (!best || cur[1] - cur[0] > best[1] - best[0]) best = cur; cur = null; }
  }
  return best ? { ok: true, lo: best[0], hi: best[1] } : { ok: false, lo: 0, hi: 0 };
}

/* ================== 게임 상태 ================== */
let state = 'title'; // title | play | ending | pause | over

const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.6, tw: Math.random() * 6 }));

function reset() {

  shake = 0; flash = 0; timeLeft = ROUND; roundBest = 0; roundBeans = 0; jumps = 0; falls = 0; bonks = 0; maxM = 0;

/* ================== 입력: 꾹 누르기 / 떼기 ================== */
function pressDown(src) {

}

// 입력 레이어 = 캔버스. UI 버튼은 캔버스보다 위(z-index)에 있어서 버튼을 누르면 캔버스로 이벤트가 오지 않음

/* ================== 이벤트 처리 ================== */

/* ================== 업데이트 (고정 60Hz) ================== */
const zoneOf = m => ({ space: clamp((m - 80) / 50, 0, 1), alien: clamp((m - 220) / 60, 0, 1) });
function update(dt) {
  time += dt;
  if (state === 'over' || state === 'title') { endT += dt; updateFx(dt); camY += (camTarget - camY) * 0.05; return; }
  if (state === 'play') {
    timeLeft -= dt;
    const sec = Math.ceil(timeLeft);
    if (sec <= 5 && sec >= 1 && sec !== lastTick) { lastTick = sec; snd.tick(); }
    if (timeLeft <= 0) { timeLeft = 0; endRound(); }
  } else if (state === 'ending') {
    endT += dt;
    if ((!pig.air && endT > 1.2) || endT > 5) { gameOver(); return; }
  }
  if (beanT > 0) { beanT -= dt; if (beanT <= 0) { beanT = 0; if (!pig.air) computeSweet(); } }
  if (pig.dizzy > 0) { pig.dizzy -= dt; if (pig.dizzy <= 0) { pig.dizzy = 0; tryStartCharge(); } }

  // 충전 (꾹 참는 중)
  if (charging) {
    chargeT += dt * (beanT > 0 ? 1.4 : 1);
    if (Math.random() < 0.25) puffs.push({ x: pig.x - pig.dir * PR * 0.8, y: pig.y + 6, vx: -pig.dir * 30, vy: -20 - Math.random() * 30, r: 2 + Math.random() * 3, life: 0.5, c: '#d6ffb8' });
    if (gauge() >= 1) { overT += dt; if (overT >= OVER_T) { held = false; holdSrc = null; launch(1); } }
  }
  // 비행
  if (pig.air) {
    const evs = stepBody(pig, dt, plats);
    for (const ev of evs) { if (ev.t === 'bonk') onBonk(ev); else if (ev.t === 'land') onLand(ev.i); }
    if (pig.air) {
      if (Math.abs(pig.vx) > 20) pig.face = Math.sign(pig.vx);
      if (!pig.scream && pig.vy > 250 && (pig.bonked || pig.y > pig.launchY + 40)) startScream();
      pig.rot = pig.scream ? pig.rot + dt * 8 * pig.face : clamp(pig.vy / 1400, -0.4, 0.5) * pig.face;
      if (pig.scream) trail.push({ x: pig.x - pig.face * 8, y: pig.y - 4, life: 1.6, w: 7 + Math.random() * 4 });
      else if (pig.vy < 0 || pig.sup) puffs.push({ x: pig.x - pig.face * PR * 0.8, y: pig.y + 8, vx: -pig.face * 30 + (Math.random() - 0.5) * 30, vy: 60 + Math.random() * 40, r: 3 + Math.random() * 5, life: 0.6, c: pig.sup ? '#ffcf6b' : '#d6ffb8' });
    }
  }
  pig.sq += (1 - pig.sq) * 0.18;
  if (pig.walk && !pig.air && pig.dizzy <= 0) {
    const d = 100 - pig.x, st = 240 * dt;
    pig.face = Math.sign(d) || 1;
    if (Math.abs(d) <= st) { pig.x = 100; pig.walk = false; pig.rot = 0; pig.dir = Math.sign(plats[1].x - pig.x) || 1; pig.face = pig.dir; computeSweet(); tryStartCharge(); }
    else { pig.x += Math.sign(d) * st; pig.rot = Math.sin(time * 18) * 0.15; }
  }
  // 콩 줍기
  for (let i = Math.max(1, pig.on - 3); i < Math.min(plats.length, pig.on + 14); i++) {
    const p = plats[i];
    if (p.bean && !p.bean.got) { p.bean.bob += dt * 4; if (Math.hypot(pig.x - p.x, pig.y - (p.y - 34 + Math.sin(p.bean.bob) * 4)) < PR + 16) collectBean(p); }
  }
  // 카메라
  const look = pig.air ? pig.y : pig.y - 40;
  camTarget = Math.min(-H + 80, look - H * 0.6);
  camY += (camTarget - camY) * (pig.air && pig.vy > 600 ? 0.2 : 0.09);
  // 구역 바뀜 알림 + 음악 키 업
  const hm = heightOf(pig.y);
  maxM = Math.max(maxM, hm);
  if (zoneShown < 1 && hm >= 100) { zoneShown = 1; floaters.push({ x: W / 2, y: pig.y - 110, t: t('space'), life: 2, big: true, size: 30 }); snd.whoosh(); snd.key = 2; }
  if (zoneShown < 2 && hm >= 240) { zoneShown = 2; floaters.push({ x: W / 2, y: pig.y - 110, t: t('alien'), life: 2, big: true, size: 30 }); snd.whoosh(); snd.key = 5; }
  updateFx(dt);
}
function updateFx(dt) {
  for (const pf of puffs) { pf.x += pf.vx * dt; pf.y += pf.vy * dt; pf.vx *= 0.95; pf.vy *= 0.95; pf.r += 12 * dt; pf.life -= dt * 1.5; }
  puffs = puffs.filter(pf => pf.life > 0);
  if (puffs.length > 220) puffs.splice(0, puffs.length - 220);
  for (const tr of trail) tr.life -= dt * (pig && pig.scream ? 0.5 : 1.2);
  trail = trail.filter(tr => tr.life > 0);
  if (trail.length > 260) trail.splice(0, trail.length - 260);
  for (const fl of floaters) { if (fl.follow && pig && pig.scream) { fl.x = pig.x; fl.y = pig.y - 36; } else fl.y -= 40 * (fl.rise ?? 1) * dt; fl.life -= dt; }
  floaters = floaters.filter(fl => fl.life > 0);
  for (const c of confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 500 * dt; c.rot += dt * 8; c.life -= dt; }
  confetti = confetti.filter(c => c.life > 0);
  if (shake > 0) shake = Math.max(0, shake - 36 * dt);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
}

/* ================== 그리기 ================== */
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix3 = (a, b, c, s, al) => { const A = hex(a), B = hex(b), C = hex(c); return `rgb(${A.map((v, i) => { const ab = v + (B[i] - v) * s; return Math.round(ab + (C[i] - ab) * al); }).join(',')})`; };

const INK = '#3b2352';
const viewM = () => Math.max(0, -(camY + H * 0.5) / PX_M);

function drawBackground() {
  const z = zoneOf(viewM());
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix3('#86ccff', '#1d1650', '#7a4cc2', z.space, z.alien));
  g.addColorStop(0.6, mix3('#bfe6ff', '#34287a', '#c08ae8', z.space, z.alien));
  g.addColorStop(1, mix3('#ffe3f1', '#4b3590', '#9df0c8', z.space, z.alien));
  ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);
  // 별 반짝
  const sa = z.space * (1 - z.alien * 0.4);
  if (sa > 0.01) {
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      const y = ((s.y - camY * 0.12) % H + H) % H;
      ctx.globalAlpha = sa * (0.5 + 0.5 * Math.sin(time * 2 + s.tw));
      ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 해 → 지구 → 외계 하늘
  if (z.space < 1) { ctx.globalAlpha = 1 - z.space; drawEmo('🌞', 300, 130, 38, Math.sin(time) * 0.1); ctx.globalAlpha = 1; }
  if (z.space > 0 && z.alien < 1) { ctx.globalAlpha = z.space * (1 - z.alien); drawEmo('🌍', 70, 600 - z.space * 120, 72, time * 0.05); ctx.globalAlpha = 1; }
  if (z.alien > 0) {
    ctx.globalAlpha = z.alien;
    drawEmo('🪐', 270, 150, 90, -0.2);
    ctx.fillStyle = '#ffd6f5'; ctx.beginPath(); ctx.arc(70, 120, 16, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#b8fff0'; ctx.beginPath(); ctx.arc(112, 92, 9, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // 떠다니는 장식 (높이마다 다름, 패럴랙스)
  const PAR = 0.5, BAND = 170;
  const top = camY * PAR, k0 = Math.floor(-(top + H) / BAND) - 1, k1 = Math.ceil(-top / BAND) + 1;
  for (let k = Math.max(1, k0); k <= k1; k++) {
    const sy = -k * BAND - top;
    const m = k * BAND / PAR / PX_M;
    const zz = zoneOf(m), r = srand(k), x = 30 + srand(k + 9) * (W - 60);
    if (zz.space < 0.5) {       // 구름
      const s = 18 + r * 16;
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      const cx = ((x + time * (6 + r * 8)) % (W + 120)) - 60;
      ctx.beginPath(); ctx.arc(cx, sy, s, 0, 6.28); ctx.arc(cx + s, sy + 5, s * 0.8, 0, 6.28); ctx.arc(cx - s, sy + 5, s * 0.75, 0, 6.28); ctx.fill();
      if (r > 0.75) drawEmo('🐦', (cx + 90) % W, sy - 30, 18, 0, -1, 1);
    } else if (zz.alien < 0.5) {
      const E = ['🛰️', '☄️', '🌙', '⭐', '🚀', '🪐'];
      drawEmo(E[Math.floor(r * E.length)], x, sy, 22 + r * 14, Math.sin(time + k) * 0.3);
    } else {
      const E = ['🛸', '👾', '🍄', '🌌', '👽', '🦠'];
      drawEmo(E[Math.floor(r * E.length)], x + Math.sin(time + k) * 10, sy, 22 + r * 14, Math.sin(time * 1.5 + k) * 0.2);
    }
  }
}

function drawPlat(p, sy) {
  if (p.ground) {
    ctx.fillStyle = '#9ee89a'; ctx.fillRect(-40, sy, W + 80, 400);
    ctx.fillStyle = '#7fd68a';
    for (let x = -10; x < W + 20; x += 24) { ctx.beginPath(); ctx.arc(x, sy + 2, 12, 0, Math.PI); ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-40, sy); ctx.lineTo(W + 40, sy); ctx.stroke();
    ['🌷', '🌼', '🍄', '🌷', '🌼'].forEach((e, i) => drawEmo(e, 24 + i * 78, sy + 36 + (i % 2) * 18, 18));
    drawEmo('🏡', 300, sy - 24, 46);
    return;
  }
  const z = zoneOf(heightOf(p.y));
  const x = p.x - p.w / 2, w = p.w;
  const col = z.alien > 0.5 ? ['#a8f5c0', '#6fdc9a'] : z.space > 0.5 ? ['#d8ccff', '#a996f0'] : (p.i % 3 === 0 ? ['#ffc2dc', '#ff9cc6'] : p.i % 3 === 1 ? ['#bff3ea', '#86e0d2'] : ['#ffe7a3', '#ffd06b']);
  ctx.fillStyle = col[1]; roundRect(x, sy + 4, w, PLAT_H, 9); ctx.fill();
  ctx.fillStyle = col[0]; roundRect(x, sy, w, PLAT_H - 2, 9); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; roundRect(x, sy, w, PLAT_H + 2, 9); ctx.stroke();
  if (z.space <= 0.5) {           // 솜사탕 구름 뚜껑
    ctx.fillStyle = '#fff';
    for (let bx = x + 10; bx < x + w - 6; bx += 16) { ctx.beginPath(); ctx.arc(bx, sy + 3, 7, Math.PI, 0); ctx.fill(); }
  } else if (z.alien <= 0.5) {    // 운석 구멍
    ctx.fillStyle = 'rgba(59,35,82,.25)';
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(x + w * (0.2 + k * 0.3), sy + 9, 5, 3, 0, 0, 6.28); ctx.fill(); }
  } else {                        // 끈적 슬라임 방울
    ctx.fillStyle = col[1];
    for (let k = 0; k < 3; k++) { const dx = x + w * (0.25 + k * 0.25), dl = 6 + Math.sin(time * 2 + k + p.i) * 4; ctx.beginPath(); ctx.ellipse(dx, sy + PLAT_H + 2 + dl / 2, 3.5, dl / 2 + 2, 0, 0, 6.28); ctx.fill(); }
    if (p.i % 2) drawEmo('👁️', x + w - 14, sy + 9, 12);
  }
  if (p.i % 5 === 0) {            // 높이 표지
    ctx.font = "bold 12px 'Jua','Malgun Gothic',sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = INK; ctx.fillText(heightOf(p.y) + 'm', p.x, sy + 11);
  }
}

function drawPig() {
  const sk = SKINS[store.d.skin];
  const g = charging ? gauge() : 0;
  const sy = pig.y - camY;
  // 비명 방귀 연기 꼬리
  if (trail.length > 1) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i];
      ctx.globalAlpha = Math.min(1, b.life) * 0.75; ctx.strokeStyle = i % 2 ? '#c8f7a8' : '#e6ffb8'; ctx.lineWidth = b.w;
      ctx.beginPath(); ctx.moveTo(a.x, a.y - camY); ctx.lineTo(b.x, b.y - camY); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (beanT > 0 || pig.sup) { ctx.fillStyle = 'rgba(255,207,107,.45)'; ctx.beginPath(); ctx.arc(pig.x, sy, PR + 10 + Math.sin(time * 20) * 3, 0, 6.28); ctx.fill(); }
  const swell = 1 + g * 0.45;
  const jit = g > 0.6 ? (Math.random() - 0.5) * g * 3 : 0;
  const face = (pig.air || pig.walk) ? pig.face : pig.dir;
  const sxs = face * faceX(sk) * swell / Math.sqrt(pig.sq);
  const sys = swell * pig.sq * (charging ? 1 - g * 0.12 : 1);
  drawEmo(sprite(sk), pig.x + jit, sy + (1 - sys) * PR * 0.5 + (charging ? g * 3 : 0), PR * 2.3, pig.rot, sxs, sys);
  if (g > 0.5) {  // 빨개진 볼 + 땀
    ctx.globalAlpha = Math.min(0.7, (g - 0.5) * 1.4); ctx.fillStyle = '#ff6b9a';
    ctx.beginPath(); ctx.arc(pig.x + face * 9, sy + 5, 5 * swell, 0, 6.28); ctx.fill(); ctx.globalAlpha = 1;
    drawEmo('💦', pig.x - face * 12, sy - PR * swell - 6, 14, 0, -face, 1);
  }
  if (pig.dizzy > 0 || (pig.air && pig.bonked)) for (let k = 0; k < 3; k++) { const a = time * 6 + k * 2.1; drawEmo('💫', pig.x + Math.cos(a) * 18, sy - PR - 8 + Math.sin(a) * 5, 12); }
  // 방향 화살표 + 게이지 (서 있을 때)
  if (!pig.air && !pig.walk && state === 'play') {
    const ax = pig.x + pig.dir * 34;
    ctx.save(); ctx.translate(ax, sy - 26 + Math.sin(time * 6) * 2); ctx.scale(pig.dir, 1); ctx.rotate(-0.9);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(4, -4); ctx.lineTo(4, -9); ctx.lineTo(13, 0); ctx.lineTo(4, 9); ctx.lineTo(4, 4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    const gx = clamp(pig.x - pig.dir * 38, 14, W - 26) - 6, gy = sy - 40, gh = 58, gw = 13;
    ctx.fillStyle = '#fff'; roundRect(gx, gy, gw, gh, 6); ctx.fill();
    if (sweet && sweet.ok && jumps < 4 && beanT <= 0) { // 처음 몇 번은 '딱 좋은 구간' 힌트
      ctx.fillStyle = 'rgba(80,220,120,.6)'; ctx.fillRect(gx + 1, gy + gh - sweet.hi * gh, gw - 2, Math.max(3, (sweet.hi - sweet.lo) * gh));
    }
    if (g > 0) {
      const fg = ctx.createLinearGradient(0, gy + gh, 0, gy);
      fg.addColorStop(0, '#9bf6c0'); fg.addColorStop(0.55, '#ffd66b'); fg.addColorStop(1, '#ff6b9a');
      ctx.fillStyle = fg; roundRect(gx + 1.5, gy + gh - g * gh + 1.5, gw - 3, Math.max(0, g * gh - 3), 5); ctx.fill();
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; roundRect(gx, gy, gw, gh, 6); ctx.stroke();
    if (g >= 1) drawEmo('😣', gx + gw / 2, gy - 11, 14 + Math.sin(time * 30) * 2);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1b1446'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
  ctx.setTransform(scale, 0, 0, scale, ox + sx * scale, oy + sy * scale);
  drawBackground();
  for (const p of plats) {
    const s = p.y - camY;
    if (s > H + 40 || (!p.ground && s < -40)) continue;
    drawPlat(p, s);
    if (p.bean && !p.bean.got) {
      const by = s - 34 + Math.sin(p.bean.bob || 0) * 4;
      ctx.fillStyle = 'rgba(255,230,107,.5)'; ctx.beginPath(); ctx.arc(p.x, by, 17 + Math.sin(time * 6) * 2, 0, 6.28); ctx.fill();
      drawEmo('🫘', p.x, by, 24, Math.sin(time * 3) * 0.3);
    }
  }
  for (const pf of puffs) { ctx.globalAlpha = Math.max(0, Math.min(1, pf.life)) * 0.8; ctx.fillStyle = pf.c; ctx.beginPath(); ctx.arc(pf.x, pf.y - camY, pf.r, 0, 6.28); ctx.fill(); }
  ctx.globalAlpha = 1;
  drawPig();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const fl of floaters) {
    ctx.globalAlpha = Math.min(1, fl.life * 1.5);
    const size = fl.size || (fl.big ? 24 : 17);
    ctx.font = `bold ${size}px 'Jua','Malgun Gothic',sans-serif`;
    const half = Math.min(W / 2 - 8, ctx.measureText(fl.t).width / 2 + 6);
    const x = clamp(fl.x, half, W - half), y = fl.y - camY;
    ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.strokeText(fl.t, x, y);
    ctx.fillStyle = fl.big ? '#ffd66b' : '#fff'; ctx.fillText(fl.t, x, y);
  }
  ctx.globalAlpha = 1;
  for (const c of confetti) { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.globalAlpha = Math.min(1, c.life); ctx.fillStyle = c.c; ctx.fillRect(-4, -2, 8, 4); ctx.restore(); }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,180,${flash * 0.5})`; ctx.fillRect(-40, -40, W + 80, H + 80); }
  if (state === 'play' || state === 'pause' || state === 'ending') drawHud();
}

function drawHud() {
  // 타이머(원형) + 현재 높이 + 최고 — 글 없이 숫자/그림만
  const cx = W / 2, cy = 84, r = 22;
  ctx.fillStyle = 'rgba(255,250,242,.92)'; roundRect(cx - 118, cy - 24, 236, 48, 22); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; roundRect(cx - 118, cy - 24, 236, 48, 22); ctx.stroke();
  const frac = timeLeft / ROUND;
  ctx.fillStyle = '#eee'; ctx.beginPath(); ctx.arc(cx, cy, r - 4, 0, 6.28); ctx.fill();
  ctx.fillStyle = timeLeft <= 5 ? '#ff6b9a' : '#9bf6c0';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r - 4, -Math.PI / 2, -Math.PI / 2 + frac * 6.283); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, r - 4, 0, 6.28); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const big = timeLeft <= 5 && timeLeft > 0 ? 1 + 0.15 * Math.sin(time * 20) : 1;
  ctx.font = `bold ${Math.round(17 * big)}px 'Jua','Malgun Gothic',sans-serif`; ctx.fillStyle = INK; ctx.fillText(Math.ceil(timeLeft), cx, cy + 1);
  ctx.font = "bold 18px 'Jua','Malgun Gothic',sans-serif";
  ctx.textAlign = 'left'; ctx.fillText('📏' + heightOf(pig.y) + 'm', cx - 110, cy + 1);
  ctx.textAlign = 'right'; ctx.fillText('🏆' + Math.max(store.d.best, roundBest), cx + 110, cy + 1);
  if (beanT > 0) {
    ctx.fillStyle = '#ffcf6b'; roundRect(cx - 50, cy + 30, 100 * (beanT / BEAN_T), 10, 5); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; roundRect(cx - 50, cy + 30, 100, 10, 5); ctx.stroke();
    drawEmo('🫘', cx - 64, cy + 35, 16);
  }
}

/* ================== 메인 루프 ================== */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (state !== 'pause') {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; }
    if (n === 6) acc = 0;
  }
  render();
  requestAnimationFrame(loop);
}

/* ================== UI ================== */
function renderSkins() {
  const box = document.getElementById('skins');
  box.innerHTML = '';
  SKINS.forEach((s, i) => {
    const b = document.createElement('button');
    const ok = unlocked(i);
    b.className = 'skin' + (ok ? '' : ' locked') + (store.d.skin === i ? ' sel' : '');
    b.innerHTML = `${ok ? s.e : '❓'}<small>${ok ? pick(s.n) : '🔒' + s.need + 'm'}</small>`;
    b.setAttribute('aria-label', ok ? pick(s.n) : t('locked', { n: s.need }));
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.addEventListener('click', e => {
      e.stopPropagation();
      snd.init();
      if (!ok) { toast(t('locked', { n: s.need })); snd.tone(200, 0.15, 'square', 0.1); return; }
      store.d.skin = i; store.save(); snd.fart(0.25); renderSkins();
    });
    box.appendChild(b);
  });
  document.getElementById('titleBest').textContent = t('best', { b: store.d.best });
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = 'none', 1800);
}
function pause() {
  if (state !== 'play' && state !== 'ending') return;
  prevState = state; state = 'pause';
  held = false; holdSrc = null; if (charging) { charging = false; chargeT = 0; snd.chargeStop(); }
  snd.stopMusic(); show('pauseScr'); document.getElementById('pauseBtn').textContent = '▶️';
}
function resume() {
  if (state !== 'pause') return;
  state = prevState; snd.init(); if (state === 'play') snd.startMusic();
  show(null); document.getElementById('pauseBtn').textContent = '⏸️'; last = performance.now(); acc = 0;
}
function toTitle() { state = 'title'; snd.stopMusic(); snd.chargeStop(); reset(); show('titleScr'); renderSkins(); document.getElementById('pauseBtn').textContent = '⏸️'; }
function updateMuteBtn() { const m = document.getElementById('muteBtn'); m.textContent = snd.muted ? '🔇' : '🔊'; m.setAttribute('aria-pressed', snd.muted ? 'true' : 'false'); }
const ui = fn => e => { e.stopPropagation(); if (e.currentTarget && e.currentTarget.blur) e.currentTarget.blur(); fn(e); };

document.getElementById('startBtn').addEventListener('click', ui(() => startGame()));
document.getElementById('retryBtn').addEventListener('click', ui(() => startGame()));
document.getElementById('menuBtn').addEventListener('click', ui(() => toTitle()));
document.getElementById('resumeBtn').addEventListener('click', ui(() => resume()));
document.getElementById('quitBtn').addEventListener('click', ui(() => toTitle()));
document.getElementById('howBtn').addEventListener('click', ui(() => { snd.init(); snd.boing(); show('howScr'); }));
document.getElementById('howClose').addEventListener('click', ui(() => { snd.init(); show('titleScr'); }));
document.getElementById('pauseBtn').addEventListener('click', ui(() => { state === 'pause' ? resume() : pause(); }));
document.getElementById('muteBtn').addEventListener('click', ui(() => { snd.init(); snd.setMute(!snd.muted); updateMuteBtn(); if (!snd.muted) snd.fart(0.2); }));
document.getElementById('shareBtn').addEventListener('click', async e => {
  e.stopPropagation();
  const text = t('shareText', { b: store.d.best });
  const url = location.origin + location.pathname;
  try {
    if (navigator.share) { await navigator.share({ title: t('title'), text, url }); return; }
    await navigator.clipboard.writeText(text + ' ' + url); toast(t('copied'));
  } catch (err) { toast(t('brag', { b: store.d.best })); }
});
// 탭을 벗어나면 자동 일시정지
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', () => pause());

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.title = lang === 'ko' ? '방귀 점프 킹 👑💨 | 나두게임즈' : 'Toot Jump King 👑💨 | Nadoo Games';
  document.getElementById('langBtn').textContent = lang === 'ko' ? '🌏 EN' : '🌏 한';
  renderSkins();
}
document.getElementById('langBtn').addEventListener('click', ui(() => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} applyLang(); snd.init(); snd.boing(); }));

/* ================== 읽기 전용 상태 (쇼츠 봇용) ================== */
const snapshot = () => {
  const zm = zoneOf(viewM());
  const nb = plats.find(q => q.i > pig.on && q.bean && !q.bean.got);
  const nx = SKINS.find(s => s.need > store.d.best);
  return {
    state, lang, timeLeft: +timeLeft.toFixed(2), round: ROUND,
    height: heightOf(pig.y), roundBest, maxHeight: maxM, best: store.d.best, jumps, falls, bonks, beans: roundBeans,
    charging, gauge: +gauge().toFixed(3), sweet: sweet ? { ok: sweet.ok, lo: sweet.lo, hi: sweet.hi } : null,
    beanTime: +beanT.toFixed(2), beanActive: beanT > 0,
    pig: { x: +pig.x.toFixed(1), y: +pig.y.toFixed(1), vx: +pig.vx.toFixed(1), vy: +pig.vy.toFixed(1), air: pig.air, walking: !!pig.walk, on: pig.on, dir: pig.dir, face: pig.face, screaming: pig.scream, bonked: pig.bonked, dizzy: pig.dizzy > 0 },
    zone: zm.alien > 0.5 ? 'alien' : zm.space > 0.5 ? 'space' : 'sky', zoneMix: zm,
    skin: store.d.skin, skinEmoji: SKINS[store.d.skin].e,
    unlocked: SKINS.filter((s, i) => unlocked(i)).map(s => s.e),
    next: nx ? { e: nx.e, need: nx.need } : null,
    nextBean: nb ? { i: nb.i, x: nb.x, y: nb.y - 34 } : null,
    platforms: plats.slice(Math.max(0, pig.on - 2), pig.on + 6).map(p => ({ i: p.i, x: p.x, w: p.w, y: p.y, bean: !!(p.bean && !p.bean.got) })),
    audio: { state: snd.ac ? snd.ac.state : 'none', music: snd.musicOn, muted: snd.muted, level: +snd.level().toFixed(4) },
    camY: +camY.toFixed(1),
  };
};
const api = {};
['state', 'timeLeft', 'height', 'roundBest', 'best', 'jumps', 'falls', 'bonks', 'charging', 'gauge', 'sweet', 'beanActive', 'pig', 'zone', 'skin', 'unlocked', 'audio', 'platforms', 'nextBean'].forEach(k => Object.defineProperty(api, k, { get: () => snapshot()[k], enumerable: true }));
api.snapshot = snapshot;
window.__tootjump = Object.freeze(api);

resize(); reset(); applyLang(); updateMuteBtn(); show('titleScr');
requestAnimationFrame(loop);
})();
</script>
</body>
